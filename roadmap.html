function resolve(rid,fixedId){

    others.forEach(function(X){

        if(B.start-X.start<X.len/2)X.start=B.start;else B.start=X.start+X.len;
      }
    });
    var cur=B.start+B.len;
    others.filter(function(X){return X.start>=B.start}).sort(function(a,b){return a.start-b.start}).forEach(function(X){if(X.start<cur)X.start=cur;cur=Math.max(cur,X.start+X.len)});
  }else{

//  2) 교재 목록: Story 1~6 → Reading 1~6, 부교재에 Work Book 1~6 추가
function fixRowNames(){
  if((S.mig||0)>=9)return false;
  var has=function(r,re){return inRow(r.id).some(function(x){return re.test(x.title)})};
  var main=S.rows.find(function(r){return has(r,/^Phonics \d$/)&&has(r,/^Basic \d+$/)}),sub=S.rows.find(function(r){return has(r,/Alphabet 쓰기|Phonics WB/)});
  if(main&&sub&&main!==sub){
    main.name='수업 주교재';sub.name='수업 부교재';
    var im=S.rows.indexOf(main),is=S.rows.indexOf(sub);if(im>is){S.rows[is]=main;S.rows[im]=sub}
  }
  S.library.forEach(function(x){if(/^Story \d$/.test(x.name))x.name=x.name.replace('Story','Reading')});
  if(!S.library.some(function(x){return /^Work Book \d$/.test(x.name)})){
    var at=-1;S.library.forEach(function(x,i){if(x.cat==='sub'&&/S 워크북/.test(x.name))at=i});
    var add=[1,2,3,4,5,6].map(function(n){return {id:uid('L'),cat:'sub',name:'Work Book '+n,dur:'1개월'}});
    if(at<0)S.library=S.library.concat(add);else S.library.splice.apply(S.library,[at+1,0].concat(add));
  }
  S.mig=9;return true;
}

function act(a){
  var b=sel&&blk(sel);
  switch(a){
  case 'undo':undo();break;case 'redo':redo();break;
  case 'close':sel=null;addAt=null;selRow=null;confirmDel=false;panelMode=null;render();break;
  case 'addrow':var id=uid('r');S.rows.push({id:id,name:'새 줄',kind:'class'});sel=null;addAt=null;selRow=id;commit();break;
  case 'len-':if(b&&b.len>1){var old=b.len;b.len--;if(chain)shiftAfter(b,-1,old);commit()}break;
  case 'len+':if(b){var o2=b.len;b.len++;if(chain)shiftAfter(b,1,o2);resolve(b.row,b.id);commit()}break;
  case 'st-':if(b&&b.start>0){moveBlock(b,b.row,b.start-1);commit()}break;
  case 'st+':if(b){moveBlock(b,b.row,b.start+1);commit()}break;
  case 'dup':if(b){var n={id:uid('b'),row:b.row,start:b.start+b.len,len:b.len,title:b.title,fam:b.fam};S.blocks.push(n);resolve(b.row,n.id);sel=n.id;commit()}break;
  case 'split':if(b&&b.len>1){var h1=Math.ceil(b.len/2),n2={id:uid('b'),row:b.row,start:b.start+h1,len:b.len-h1,title:b.title,fam:b.fam};b.len=h1;S.blocks.push(n2);commit()}else toast('1개월짜리는 나눌 수 없어요');break;
  case 'del':if(b){S.blocks=S.blocks.filter(function(x){return x.id!==b.id});sel=null;commit();toast('삭제했어요 (되돌리기 가능)')}break;
  case 'delpull':if(b){S.blocks=S.blocks.filter(function(x){return x.id!==b.id});inRow(b.row).forEach(function(x){if(x.start>=b.start+b.len)x.start-=b.len});sel=null;commit();toast('삭제하고 뒤 교재를 당겼어요')}break;
  case 'add':var t=(document.getElementById('n-title').value||'').trim();if(!t){toast('교재명을 입력해 주세요');return}
    var L=Math.max(1,parseInt(document.getElementById('n-len').value,10)||1);
    var nb={id:uid('b'),row:addAt.row,start:addAt.start,len:L,title:t,fam:document.getElementById('n-fam').value};
    S.blocks.push(nb);resolve(nb.row,nb.id);addAt=null;sel=nb.id;commit();break;
  case 'rup':case 'rdown':var i=S.rows.findIndex(function(r){return r.id===selRow}),j=i+(a==='rup'?-1:1);if(j>=0&&j<S.rows.length){var tmp=S.rows[i];S.rows[i]=S.rows[j];S.rows[j]=tmp;commit()}break;
  case 'rpack':var c=0;inRow(selRow).forEach(function(x){x.start=c;c+=x.len});commit();break;
  case 'rdel':if(!confirmDel){confirmDel=true;renderPanel();return}
    S.blocks=S.blocks.filter(function(x){return x.row!==selRow});S.rows=S.rows.filter(function(r){return r.id!==selRow});selRow=null;confirmDel=false;commit();break;
  case 'bl':case 'br':var bd=document.getElementById('board');if(bd)bd.scrollBy({left:(a==='bl'?-6:6)*W,behavior:'smooth'});break;
  case 'lib':panelMode='lib';sel=null;addAt=null;selRow=null;renderPanel();break;
  case 'libadd':S.library.push({id:uid('L'),cat:libCat,name:'새 교재',dur:'1개월'});commit();renderPanel();var ins=panel.querySelectorAll('[data-ln]');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}break;
  case 'movelocal':if(localOld){S.students=localOld.students;if(localOld.exams&&localOld.exams.length&&!(S.exams||[]).length)S.exams=localOld.exams;localOld=null;commit();toast('학생 명단을 옮겼어요')}break;
  case 'droplocal':localOld=null;render();break;
  case 'log':panelMode='log';sel=null;addAt=null;selRow=null;renderPanel();break;
  case 'snaps':panelMode='snaps';sel=null;addAt=null;selRow=null;snapConfirm=null;renderPanel();break;
  case 'snapsave':saveSnap();break;
  case 'xlsx':exportXlsx();break;
  case 'backup':backup();break;
  case 'import':document.getElementById('file').click();break;
  }
}
function shiftAfter(b,d,oldLen){inRow(b.row).forEach(function(x){if(x.id!==b.id&&x.start>=b.start+oldLen)x.start=Math.max(0,x.start+d)})}
function moveBlock(b,newRow,newStart){
  var oldRow=b.row,oldStart=b.start,d=newStart-oldStart;

  b.row=newRow;b.start=Math.max(0,newStart);
  resolve(newRow,b.id);
}

// ---------- 학생 로드맵 ----------
var GR_OPTS=[[1,'초1'],[2,'초2'],[3,'초3'],[4,'초4'],[5,'초5'],[6,'초6'],[7,'중1'],[8,'중2'],[9,'중3'],[10,'고1'],[11,'고2'],[12,'고3']];
function grName(g){for(var i=0;i<GR_OPTS.length;i++)if(GR_OPTS[i][0]===g)return GR_OPTS[i][1];return ''}
function parseGrade(v){v=String(v||'').replace(/\s/g,'');var m=v.match(/^(초|중|고)?(\d)/);if(!m)return 0;var n=+m[2];if(m[1]==='중')n+=6;else if(m[1]==='고')n+=9;else if(!m[1]&&n>6)return 0;return n>=1&&n<=12?n:0}
function nowYM(){var d=new Date();return {y:d.getFullYear(),m:d.getMonth()+1}}
function ymIdx(y,m){return y*12+(m-1)}
function ymStr(i){var y=Math.floor(i/12),m=i%12+1;return y+'-'+(m<10?'0':'')+m}
function ymParse(s){var m=String(s||'').match(/^(\d{4})-(\d{1,2})/);return m?ymIdx(+m[1],+m[2]):null}
function stuOf(id){return (S.students||[]).find(function(x){return x.id===id})}
// 이 학생의 학년 (로드맵이 1월~12월이라 1월에 한 학년 올라가는 것으로 계산)
function gradeAtIdx(st,idx){if(!st.grade||!st.gy)return 0;return st.grade+(Math.floor(idx/12)-st.gy)}
// 그 학년·월이 기본 로드맵의 몇 번째 달인지
function stdMonth(st,idx){var g=gradeAtIdx(st,idx);if(!g)return null;return (g-S.startGrade)*12+(idx%12)}
function blockAt(rowId,m){var L=inRow(rowId);for(var i=0;i<L.length;i++)if(m>=L[i].start&&m<L[i].start+L[i].len)return L[i];return null}
function dateIdx(str){var m=String(str||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!m)return null;return ymIdx(+m[1],+m[2])+(+m[3]-1)/30}
function nowIdx(){var d=new Date();return ymIdx(d.getFullYear(),d.getMonth()+1)+(d.getDate()-1)/30}
function idxDate(i){var y=Math.floor(i/12),m=Math.floor(i%12)+1,d=Math.round((i-Math.floor(i))*30)+1;return m+'/'+d}
// 이 학생에게 해당하는 시험대비 기간 (중등 · 학교와 학년이 맞는 것)
function stuExams(st){
  if(!st.school)return [];
  return (S.exams||[]).map(function(x){var e=dateIdx(x.start);return e==null?null:{x:x,e:e,len:(x.weeks||4)/4}}).filter(function(o){
    if(!o||o.x.school!==st.school)return false;
    if(o.x.grade&&gradeAtIdx(st,Math.floor(o.e))!==o.x.grade)return false;
    return true;
  }).sort(function(a,b){return a.e-b.e});
}
// ---- 한 줄의 '원래 계획' (시험대비 적용 전) ----
//  · 개인 편집(st.custom[row])이 있으면 그것을 그대로 씀 (달력 위치·개월 수·순서 모두 학생 전용)
//  · 없으면 출발 칸부터 기본 로드맵 순서·간격대로, 건너뛴 교재는 빼고 당김
function rawItems(st,rowId){
  var cu=st.custom&&st.custom[rowId];
  if(cu&&cu.length){
    var items=cu.map(function(x){return {id:x.id,ref:x.ref||'',title:x.title,cal:+x.cal,len:Math.max(1,+x.len||1)}}).sort(function(a,b){return a.cal-b.cal});
    var sb0=null;for(var i=0;i<items.length;i++){if(items[i].ref&&blk(items[i].ref)){sb0=blk(items[i].ref);break}}
    return {custom:true,from:items[0].cal,items:items,skipped:[],sb:sb0};
  }
  var sb=st.starts&&st.starts[rowId]?blk(st.starts[rowId]):null;
  if(!sb||sb.row!==rowId)return null;
  var from=ymParse(st.from);if(from==null){var n=nowYM();from=ymIdx(n.y,n.m)}
  var shift=0,items=[],skipped=[];
  inRow(rowId).filter(function(b){return b.start>=sb.start}).forEach(function(b){
    if(b.id!==sb.id&&st.skips&&st.skips[b.id]){skipped.push({b:b});shift+=b.len;return}
    items.push({id:b.id,ref:b.id,title:b.title,cal:from+(b.start-sb.start-shift),len:b.len});
  });
  return {custom:false,from:from,items:items,skipped:skipped,sb:sb};
}
// ---- 시험대비 기간만큼 밀기까지 적용한 계획 ----
function stuPlan(st,rowId){
  var R=rawItems(st,rowId);if(!R)return null;
  var segs=R.items.map(function(it){return {item:it,cal:it.cal,len:it.len,done:0}}),exams=[];
  var row=rowOf(rowId);
  if(!row||row.pause!==false){
    stuExams(st).forEach(function(o){
      if(o.e+o.len<=R.from)return;
      var out=[];
      segs.forEach(function(g){
        if(g.exam){if(g.cal>=o.e)g.cal+=o.len;out.push(g);return}
        var end=g.cal+g.len;
        if(end<=o.e)out.push(g);
        else if(g.cal>=o.e){g.cal+=o.len;out.push(g)}
        else{var a=o.e-g.cal;out.push({item:g.item,cal:g.cal,len:a,done:g.done,part:1});out.push({item:g.item,cal:o.e+o.len,len:g.len-a,done:g.done+a,part:2})}
      });
      out.push({exam:o.x,cal:o.e,len:o.len});exams.push(o);
      segs=out.sort(function(a,b){return a.cal-b.cal});
    });
  }
  return {custom:R.custom,sb:R.sb,from:R.from,items:R.items,segs:segs,skipped:R.skipped,exams:exams};
}
// 개인 교재 하나를 몇 개월(progress) 했을 때 기본 로드맵의 몇 번째 달에 와 있는지
function refBase(P,it,progress){
  var b=it.ref?blk(it.ref):null;
  if(b)return b.start+Math.min(b.len,Math.max(0,progress)*b.len/it.len);
  var i=P.items.indexOf(it);
  for(var k=i-1;k>=0;k--){var p=P.items[k].ref&&blk(P.items[k].ref);if(p)return p.start+p.len}
  for(var j=i+1;j<P.items.length;j++){var q=P.items[j].ref&&blk(P.items[j].ref);if(q)return q.start}
  return null;
}
// 오늘 기준: 실제로 와 있는 '기본 로드맵 달' 과 학년 기준 달의 차이
function stuStatus(st,rowId){
  var P=stuPlan(st,rowId),now=nowIdx(),std=stdMonth(st,Math.floor(now));
  var stdB=std!=null?blockAt(rowId,std):null;
  var out={plan:P,std:std,stdB:stdB,cur:null,diff:null,exam:null};
  var endM0=0;S.blocks.forEach(function(b){if(b.row===rowId)endM0=Math.max(endM0,b.start+b.len)});
  if(std!=null&&std>=endM0){out.oor=true;out.stdB=null}
  if(!P||!P.items.length)return out;
  var books=P.segs.filter(function(g){return !g.exam}),baseM=null;
  P.segs.forEach(function(g){if(now>=g.cal&&now<g.cal+g.len){
    if(g.exam){out.exam=g.exam;out.examEnd=g.cal+g.len}
    else{out.cur={title:g.item.title};baseM=refBase(P,g.item,g.done+(now-g.cal))}}});
  if(baseM==null){
    var prev=null,next=null;books.forEach(function(g){if(g.cal+g.len<=now)prev=g;else if(!next&&g.cal>now)next=g});
    if(next)out.next={title:next.item.title};
    if(prev)baseM=refBase(P,prev.item,prev.done+prev.len)+(next||out.exam?0:(now-(prev.cal+prev.len)));
    else if(next){var nb=refBase(P,next.item,next.done);baseM=nb==null?null:nb-(next.cal-now)}
  }
  out.baseM=baseM;
  if(std!=null&&!out.oor&&baseM!=null)out.diff=Math.round(baseM-std);
  var up=P.exams.filter(function(o){return o.e>now})[0];if(up)out.upExam=up;
  return out;
}

function histColor(txt,k){

function resolveItems(list,fixed){
  list.sort(function(a,b){return a.cal-b.cal||(a===fixed?-1:b===fixed?1:0)});
  list.forEach(function(X){if(X!==fixed&&X.cal<fixed.cal&&X.cal+X.len>fixed.cal){if(fixed.cal-X.cal<X.len/2)X.cal=fixed.cal;else fixed.cal=X.cal+X.len}});

  list.filter(function(X){return X!==fixed&&X.cal>=fixed.cal}).sort(function(a,b){return a.cal-b.cal}).forEach(function(X){if(X.cal<cur)X.cal=cur;cur=Math.max(cur,X.cal+X.len)});

function stuAct(a,el){
  var id=el.getAttribute('data-id'),st=id?stuOf(id):null;
  if(a==='open'){stuSetOpen=null;stuSel=id;stuDelConfirm=false;stuPick=null;stuAddOpen=false;stuResetConfirm=null;render();var w=document.getElementById('stuwrap');if(w)w.scrollTop=0;return}
  if(a==='close'){stuSel=null;render();return}
  if(a==='scrl'){var tl=document.getElementById('stl');if(!tl)return;var d=+el.getAttribute('data-d');
    if(d===0)tl.scrollTo({left:Math.max(0,(nowIdx()-stuLo-3)*SW),behavior:'smooth'});else tl.scrollBy({left:d*SW,behavior:'smooth'});return}
  if(a==='exams'){stuExamOpen=!stuExamOpen;render();return}
  if(a==='settog'){var st2=stuOf(stuSel);var any=st2&&S.rows.some(function(r){return (st2.starts&&st2.starts[r.id])||(st2.custom&&st2.custom[r.id]&&st2.custom[r.id].length)});var cur=stuSetOpen==null?!any:stuSetOpen;stuSetOpen=!cur;render();return}
  if(a==='histload'){var hf=document.getElementById('histfile');if(hf)hf.click();return}
  if(a==='examclose'){stuExamOpen=false;render();return}
  if(a==='examadd'){var sc=(document.getElementById('ex-school')||{}).value,sd=(document.getElementById('ex-start')||{}).value;
    if(!sc){toast('중등 학생의 학교가 먼저 있어야 해요');return}if(!sd){toast('시작일을 골라 주세요');return}
    S.exams.push({id:uid('e'),school:sc,grade:+document.getElementById('ex-grade').value,start:sd,weeks:Math.max(1,parseInt(document.getElementById('ex-weeks').value,10)||4),name:(document.getElementById('ex-name').value||'').trim()});commit();toast('시험대비 기간을 넣었어요');return}
  if(a==='examdel'){S.exams=S.exams.filter(function(x){return x.id!==id});commit();return}
  if(a==='paste'){stuPaste=true;render();setTimeout(function(){var t=document.getElementById('pastebox');if(t)t.focus()},30);return}
  if(a==='pasteclose'){stuPaste=false;render();return}
  if(a==='pastego'){pasteStudents((document.getElementById('pastebox')||{}).value||'');return}
  if(a==='add1'){var x={id:uid('s'),name:'새 학생',group:'',school:'',grade:0,gy:0,from:'',starts:{},skips:{}};S.students.push(x);stuSel=x.id;commit();return}
  if(a==='del'&&st){if(!stuDelConfirm){stuDelConfirm=true;render();return}S.students=S.students.filter(function(x){return x.id!==id});stuSel=null;stuDelConfirm=false;commit();toast('학생을 삭제했어요 (되돌리기 가능)');return}
  if(a==='ci'){ciOp(el.getAttribute('data-op'));return}
  if(a==='reset'&&st){var rw=el.getAttribute('data-row');if(stuResetConfirm!==rw){stuResetConfirm=rw;render();return}if(st.custom)delete st.custom[rw];stuResetConfirm=null;stuPick=null;commitKeep();toast('기본 로드맵 계획으로 되돌렸어요');return}
  if(a==='unskip'&&st){var b2=el.getAttribute('data-b');if(st.skips)delete st.skips[b2];commit();return}
}
function pasteStudents(txt){
  var lines=txt.split(/\r?\n/).map(function(l){return l.replace(/\s+$/,'')}).filter(function(l){return l.trim()});
  if(!lines.length){toast('붙여 넣은 내용이 없어요');return}
  var split=function(l){return l.indexOf('\t')>=0?l.split('\t'):l.split(/\s*,\s*/)};
  var head=split(lines[0]).map(function(x){return x.trim()}),map={name:0,group:1,school:2,grade:-1,from:-1},hasHead=head.some(function(x){return /^(이름|학생|성명|학생명)$/.test(x)});
  if(hasHead){map={name:-1,group:-1,school:-1,grade:-1,from:-1};head.forEach(function(x,i){if(/^(이름|학생|성명|학생명)$/.test(x))map.name=i;else if(/^반/.test(x))map.group=i;else if(/^학교/.test(x))map.school=i;else if(/^학년/.test(x))map.grade=i;else if(/등원/.test(x))map.from=i});lines=lines.slice(1)}
  if(map.name<0){toast('이름 칸을 찾지 못했어요');return}
  var add=0,upd=0,y=nowYM().y;
  lines.forEach(function(l){var c=split(l).map(function(x){return (x||'').trim()});var nm=c[map.name];if(!nm)return;
    var grp=map.group>=0?c[map.group]||'':'',sch=map.school>=0?c[map.school]||'':'',gr=map.grade>=0?parseGrade(c[map.grade]):0;
    var fm=map.from>=0?(String(c[map.from]||'').match(/(\d{4})[-.\/년\s]+(\d{1,2})/)||null):null,fr=fm?fm[1]+'-'+(fm[2].length<2?'0':'')+fm[2]:'';
    var nk=nm.replace(/\s/g,'');
    var ex=S.students.find(function(x){return x.name.replace(/\s/g,'')===nk&&(x.school||'')===(sch||x.school||'')});
    if(ex){ex.group=grp||ex.group;ex.school=sch||ex.school;if(gr){ex.grade=gr;ex.gy=y}if(fr)ex.from=fr;upd++}
    else{S.students.push({id:uid('s'),name:nm,group:grp,school:sch,grade:gr,gy:gr?y:0,from:fr,starts:{},skips:{}});add++}
  });
  stuPaste=false;commit();toast('새 학생 '+add+'명 추가'+(upd?' · '+upd+'명 정보 갱신':''));
}
app.addEventListener('click',function(e){
  var v=e.target.closest('[data-v]');if(v){view=v.getAttribute('data-v');try{localStorage.setItem(LS_KEY+'-view',view)}catch(x){}sel=null;addAt=null;selRow=null;panelMode=null;render();return}
  var s=e.target.closest('[data-s]');if(s){stuAct(s.getAttribute('data-s'),s)}
});
app.addEventListener('change',function(e){
  var t=e.target,y=nowYM().y;
  if(t.hasAttribute('data-sg')){var st=stuOf(t.getAttribute('data-sg'));if(st){st.grade=+t.value;st.gy=st.grade?y:0;commit()}}
  else if(t.hasAttribute('data-ss')){stuSetOpen=true;var s2=stuOf(t.getAttribute('data-ss'));if(s2){s2.starts=s2.starts||{};var r=t.getAttribute('data-row');if(t.value)s2.starts[r]=t.value;else delete s2.starts[r];if(!s2.from){var n=nowYM();s2.from=ymStr(ymIdx(n.y,n.m))}commit()}}
  else if(t.hasAttribute('data-sd')){var s3=stuOf(t.getAttribute('data-sd'));if(s3&&t.value){s3.from=t.value;commit()}}
  else if(t.hasAttribute('data-sf')){stuFilter[t.getAttribute('data-sf')]=t.value;render()}
  else if(t.id==='stuchain'){stuChain=t.checked}
  else if(t.id==='histon'){histOn=t.checked;render()}
  else if(t.id==='histfile'){var f=t.files&&t.files[0];if(!f)return;f.text().then(function(txt){try{var o=JSON.parse(txt);if(!o||!o.students)throw 0;saveHist({rows:o.rows||[],students:o.students,made:o.made||''})}catch(x){toast('지난 기록 파일이 아니에요')}})}
  else if(t.hasAttribute('data-pause')){var rr=rowOf(t.getAttribute('data-pause'));if(rr){rr.pause=t.checked;commit()}}
});
app.addEventListener('input',function(e){var t=e.target;if(t.getAttribute('data-sf')==='q'){stuFilter.q=t.value;var p=t.selectionStart;render();var n=app.querySelector('[data-sf=q]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}});

// ---------- 탭·휴대폰 손가락 밀기 (가로·세로) ----------
// 앱 안 액자 화면 등에서 브라우저 기본 스크롤이 막히는 경우가 있어, 손가락 움직임을 직접 받아 화면을 움직임
(function(){
  var T=null;
  function canScroll(el,ax){
    if(!el||el===document.body||el===document.documentElement)return false;
    var cs=getComputedStyle(el),ov=ax==='x'?cs.overflowX:cs.overflowY;
    if(ov!=='auto'&&ov!=='scroll')return false;
    return ax==='x'?el.scrollWidth>el.clientWidth+1:el.scrollHeight>el.clientHeight+1;
  }
  function chain(t,ax){var a=[];for(var el=t;el&&el.nodeType===1;el=el.parentElement)if(canScroll(el,ax))a.push(el);a.push(document.scrollingElement||document.documentElement);return a}
  function move(list,ax,d){ // d: 움직일 픽셀. 안쪽부터 움직이고, 끝에 닿으면 바깥으로 넘김
    for(var i=0;i<list.length&&Math.abs(d)>0.5;i++){
      var el=list[i],before=ax==='x'?el.scrollLeft:el.scrollTop;
      if(ax==='x')el.scrollLeft=before+d;else el.scrollTop=before+d;
      var moved=(ax==='x'?el.scrollLeft:el.scrollTop)-before;d-=moved;
    }
    if(Math.abs(d)>0.5){try{if(window.parent&&window.parent!==window)window.parent.scrollBy(ax==='x'?d:0,ax==='y'?d:0)}catch(e){}}
  }
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){T=null;return}
    var tg=e.target;if(tg.closest&&tg.closest('input[type=range],select,textarea,input[type=month],input[type=date]')){T=null;return}
    var t=e.touches[0];T={t:tg,x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,axis:null,list:null};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!T||e.touches.length!==1)return;
    var t=e.touches[0];
    if(!T.axis){var dx0=t.clientX-T.x,dy0=t.clientY-T.y;if(Math.abs(dx0)<6&&Math.abs(dy0)<6)return;
      T.axis=Math.abs(dx0)>Math.abs(dy0)?'x':'y';T.list=chain(T.t,T.axis);T.lx=T.x;T.ly=T.y}
    e.preventDefault();
    if(T.axis==='x'){move(T.list,'x',T.lx-t.clientX)}else{move(T.list,'y',T.ly-t.clientY)}
    T.lx=t.clientX;T.ly=t.clientY;
  },{passive:false});
  document.addEventListener('touchend',function(){T=null},{passive:true});
  document.addEventListener('touchcancel',function(){T=null},{passive:true});
})();

// ---------- start ----------
if(!ONLINE){
  try{var loc=localStorage.getItem(LS_KEY);if(loc){var emb=S.students;S=fromStore(JSON.parse(loc));if(!S.students.length&&emb&&emb.length)S.students=emb}}catch(e){}
  try{var hh=localStorage.getItem(LS_KEY+'-history');if(hh)HIST=JSON.parse(hh)}catch(e){}
  synced=toStore(S);if(fixRowNames())push();hist=[JSON.stringify(S)];hi=0;synced=toStore(S);render();
}else{
  render();
  try{
    var fbApp=(firebase.apps||[]).find(function(x){return x.name===FB_APP_NAME})||firebase.initializeApp(FIREBASE_CONFIG,FB_APP_NAME);
    db=fbApp.database();dataRef=db.ref(DB_PATH+'/data');
    db.ref('.info/connected').on('value',function(sn){connected=!!sn.val();if(!D)render()});
    var seed=toStore(S);
    db.ref(DB_PATH+'/seeded').transaction(function(cur){return cur?undefined:true}).then(function(res){
      if(res.committed)return dataRef.set(seed);
    }).then(function(){
      dataRef.on('value',function(sn){var v=sn.val()||{};if(D){pending=v;return}applyRemote(v)});
    }).catch(function(){toast('Firebase에 연결하지 못했어요. 설정값과 데이터베이스 규칙을 확인해 주세요')});
    if(false)db.ref(DB_PATH+'/log').limitToLast(50).on('value',function(sn){var a=[];sn.forEach(function(c){a.push(c.val())});logs=a.reverse();if(panelMode==='log')renderPanel()});
    db.ref(DB_PATH+'/history').on('value',function(sn){var v=sn.val();HIST=v&&v.students?{rows:v.rows||[],students:v.students}:{rows:[],students:{}};if(!D&&!SD)render()});
    if(false)db.ref(DB_PATH+'/snapshots').limitToLast(30).on('value',function(sn){var a=[];sn.forEach(function(c){var v=c.val();a.push({k:c.key,t:v.t,who:v.who,name:v.name})});snaps=a.reverse();if(panelMode==='snaps')renderPanel()});
  }catch(e){toast('Firebase 설정을 확인해 주세요')}
}
})();
