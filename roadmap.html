<style id="app-style">

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}

.banner{background:#fff6e5;border-bottom:1px solid #f3d9a8;padding:8px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.board{flex:1;overflow:auto;position:relative}
.grid{position:relative;padding-bottom:140px}
.r{display:flex;position:relative}
.lab{position:sticky;left:0;z-index:5;width:var(--lab);min-width:var(--lab);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:12px;word-break:keep-all;line-height:1.25;color:#fff;background:#3a3f45;border-bottom:3px solid #fff;padding:4px 6px;cursor:pointer}

.hdr.g{top:0}.hdr.m{top:30px}
.hdr .lab{cursor:default;background:#1f2933}
.hdr.m .lab{background:#eceff2;color:#59636e;border:0}
.hl{position:relative;height:30px}

.gseg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;border-left:2px solid #fff}
.mseg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6b7785}
.lane{position:relative;height:64px;background-color:#f4f5f7;border-bottom:3px solid #fff;
 background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--w) - 1px),#e8eaed calc(var(--w) - 1px),#e8eaed var(--w));cursor:copy}
.r.dist .lane{height:30px;background-color:#fffaf2}
.r.dist .lab{background:#b54708}
.blk.dist{background:none!important;color:#b54708!important;box-shadow:none;overflow:visible;white-space:nowrap;justify-content:center;align-items:flex-start;padding:0;font-size:11px;z-index:2}
.blk.dist .t{word-break:normal}
.mseg.k{border-left:1px solid #fff}
.gseg.stg{font-size:12px}
.blk{position:absolute;top:3px;bottom:3px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10.5px;font-weight:700;line-height:1.18;padding:2px 8px 2px 3px;overflow:hidden;cursor:grab;touch-action:pan-x pan-y;user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.08);transition:box-shadow .12s}

.blk .n{font-size:10px;font-weight:600;opacity:.75;margin-top:1px}

.ghost{position:absolute;z-index:20;border-radius:7px;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.28);outline:2px dashed #1f2933;outline-offset:1px}
.cellhint{position:absolute;top:3px;bottom:3px;border-radius:7px;border:2px dashed var(--accent);background:rgba(42,111,176,.08);pointer-events:none}
.addrow{display:flex}
.addrow .lab{background:transparent;color:var(--accent);border:0;font-weight:700}
.legend{display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:#fff;border-top:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px}

.chip{padding:4px 10px;border-radius:6px;font-weight:700;font-size:11px}
.arr{color:#a0a8b1;font-size:10px}
#panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 20px));background:#fff;border:1px solid #d5dae0;border-radius:14px;box-shadow:0 12px 40px rgba(16,24,40,.22);padding:12px 14px;z-index:50;display:none}

.fr{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--sub);font-weight:700}
.f input,.f select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #cfd5dc;border-radius:8px;color:var(--ink);background:#fff}

.num{display:flex;align-items:center;gap:4px}

.acts{display:flex;flex-wrap:wrap;gap:6px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;border:1px solid rgba(0,0,0,.1)}
.who{font:inherit;font-size:13px;width:92px;padding:6px 8px;border:1px solid #d5dae0;border-radius:8px}
.list{max-height:46vh;overflow:auto;border-top:1px solid var(--line)}
.li{padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}

.pick1{border:1px solid var(--accent);background:#e6f0fa;color:#1d4f80;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}

.serlist{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.ser{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid #f0f2f4;font-size:13px}

.sname{font-weight:800;min-width:96px;color:var(--ink)}
.sname.one{border:0;background:none;font:inherit;font-weight:700;text-align:left;cursor:pointer;padding:3px 6px;border-radius:6px;margin-left:-6px}
.sname.one:hover{background:#e6f0fa}.sname.one.on{background:#e6f0fa;color:#1d4f80;box-shadow:inset 0 0 0 2px var(--accent)}
.nums{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.num{min-width:30px;border:1px solid #d5dae0;background:#fff;border-radius:6px;padding:3px 7px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.num:hover{border-color:var(--accent)}.num.on{background:var(--accent);border-color:var(--accent);color:#fff}
.used{opacity:.4}
.sdur{font-size:11.5px;color:var(--sub);white-space:nowrap;margin-left:auto}
.addall{border:0;background:none;color:var(--accent);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.addall:hover{text-decoration:underline}
.libtabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.libtabs input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #cfd5dc;border-radius:8px;margin-left:auto}

.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.picklist{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto;padding:6px;background:#f6f8fa;border-radius:10px;margin-bottom:10px}
.pick{border:1px solid #d5dae0;background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.pick small{font-size:10.5px;color:var(--sub);font-weight:600}
.pick:hover{border-color:var(--accent)}

.pick.used{opacity:.5}
.librow{display:flex;gap:6px;align-items:center}
.librow input{font:inherit;font-size:13px;padding:4px 7px;border:1px solid #cfd5dc;border-radius:7px;flex:1}
.ver{font-size:11px;font-weight:800;color:#5b6570;background:#eef1f4;border-radius:999px;padding:2px 8px;margin-left:-4px}
.tabs{display:inline-flex;background:#eef1f4;border-radius:10px;padding:3px;gap:2px}
.tab{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:#5b6570;padding:6px 12px;border-radius:8px;cursor:pointer}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab .cnt{font-size:11px;color:#8a949e;margin-left:2px}
.stu{flex:1;overflow:auto;padding:12px 14px 40px}
.sbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sbar select,.sbar input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #cfd5dc;border-radius:8px;background:#fff}
.stbl{border-collapse:separate;border-spacing:0;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:100%}
.stbl th{background:#f3f5f7;color:#5b6570;font-weight:700;padding:8px 8px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:2}
.stbl td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.stbl tr:hover td{background:#fafcff}
/* 학생 표: 화면 안에서 위아래·좌우로 움직이게 (좌우 스크롤바가 맨 아래가 아니라 화면 안에 보이도록) */
.stwrap{overflow:auto;max-height:calc(100vh - 210px);min-height:240px;border-radius:10px}
.stwrap .stbl{min-width:max-content;overflow:visible}
.stbl th:first-child,.stbl td:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line)}
.stbl th:first-child{z-index:3;background:#f3f5f7}
.stbl .nm{font-weight:800;cursor:pointer;color:var(--accent)}
.stbl select{font:inherit;font-size:12px;padding:3px 4px;border:1px solid #cfd5dc;border-radius:6px}
.stbl.bulk td{vertical-align:top}.stbl.bulk input[type=date]{font:inherit;font-size:12px;padding:2px 4px;border:1px solid #cfd5dc;border-radius:6px}.stbl.bulk input[type=date]:disabled{opacity:.35}
.cellp{display:flex;align-items:center;gap:6px}
.cur{max-width:130px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.dg{display:inline-block;min-width:44px;text-align:center;font-weight:800;font-size:11px;border-radius:999px;padding:2px 7px}
.dg.p{background:#e3f4e8;color:#1d6b3a}.dg.z{background:#eef1f4;color:#4a5560}.dg.m1{background:#fff1dc;color:#9a5300}.dg.m3{background:#fde4e1;color:#b42318}.dg.n{background:#f3f4f6;color:#9aa3ad;font-weight:600}
.sdet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sdh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.sdh h2{margin:0;font-size:18px}
.sdh .meta{color:var(--sub);font-size:13px}
.srow{display:grid;grid-template-columns:118px 1fr;gap:0;border-top:1px solid var(--line)}
.srow .sl{background:#3a3f45;color:#fff;font-weight:700;font-size:12.5px;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.srow .sl select{font:inherit;font-size:11.5px;max-width:104px;border-radius:6px;border:0;padding:3px}
.sinfo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:#4a5560;padding:6px 8px;background:#fafbfc;border-bottom:1px solid var(--line)}
.sinfo b{color:var(--ink)}
.stl{overflow-x:auto}
.stlin{position:relative}
.saxis{display:flex;position:relative;height:46px;background:#eceff2}
.saxis .ym{position:absolute;top:0;bottom:0;font-size:10.5px;color:#5b6570;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border-left:1px solid #fff}
.saxis .ym.jan{border-left:2px solid #55606b}
.slane{position:relative;height:42px;background-color:#f4f5f7;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--sw) - 1px),#eaecef calc(var(--sw) - 1px),#eaecef var(--sw))}
.slane.dl{height:22px;background:#fffaf2}
.sdist{position:absolute;top:2px;font-size:11px;font-weight:800;color:#b54708;white-space:nowrap}
.sblk.done{background:#f1e6da!important;color:#8a8178!important;box-shadow:none}
.sblk .lt{position:absolute;top:1px;right:2px;background:#FAEEDA;color:#633806;border-radius:9px;padding:0 5px;font-size:10px;font-weight:800;line-height:14px;z-index:3;pointer-events:none}.sblk .lt.m{background:#E6F1FB;color:#0C447C}
.sblk .ck{color:#1d9e57;font-weight:900;margin-left:3px}
.donebar{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding-left:8px;border-left:2px solid #d5dae0;margin-left:4px}
.uc{font-size:11px;color:#9a5300;font-weight:700}
.rm{font-size:11px;color:#5b6570;background:#f1f3f5;border-radius:999px;padding:1px 7px;font-weight:700;white-space:nowrap}.rm.w{color:#9a5300;background:#fff1dc}
.ldot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f79009;margin-left:4px;vertical-align:middle}
.sblk{position:absolute;top:3px;bottom:3px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10.5px;font-weight:700;line-height:1.15;padding:2px 3px;overflow:hidden;cursor:pointer;word-break:keep-all;overflow-wrap:break-word}
.sblk:hover{box-shadow:0 2px 8px rgba(0,0,0,.2)}
.sblk.past{opacity:.45}
.sblk.exam{background:repeating-linear-gradient(135deg,#fde8d7 0 6px,#fbd3b4 6px 12px);color:#8a3b00;border:1px dashed #e08a4a;cursor:default;font-size:10px}
.sblk.part1{border-top-right-radius:0;border-bottom-right-radius:0}.sblk.part2{border-top-left-radius:0;border-bottom-left-radius:0}
.exb{display:inline-block;background:#fde8d7;color:#8a3b00;border:1px dashed #e08a4a;border-radius:6px;padding:0 6px;font-size:11px;font-weight:800}
.sblk.mv{cursor:grab;touch-action:pan-x pan-y;user-select:none}
.sblk.mv.on{outline:3px solid #ffb703;outline-offset:1px;z-index:3}
.sblk.mv.drag{opacity:.75;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:5}
.rh2{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.rh2::after{content:"";position:absolute;right:2px;top:30%;bottom:30%;width:2px;border-radius:2px;background:currentColor;opacity:.35}
.cust{display:inline-block;background:#fff4d6;color:#8a5a00;border:1px solid #f0cf7a;border-radius:6px;padding:0 6px;font-size:11px;font-weight:800}
.sbar2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;background:#f6f8fa;border-radius:8px;margin-top:8px;font-size:12.5px}
.sbar2 .selname{margin:0 4px}
.sbar2 select,.sbar2 input{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid #cfd5dc;border-radius:6px}
.saxis .ym .yr{font-size:10px;font-weight:700;color:#6b7785;white-space:nowrap}
.saxis .ym .gr{font-size:10.5px;font-weight:800;color:#34495e;white-space:nowrap}
.saxis .ym.cur{background:#fde7e7}
.saxis .ym.cur span{color:#c0392b}
.hint{font-size:11px;color:#8a949e;font-weight:600}
.hsep{white-space:nowrap;padding:0 10px;height:20px;background:#fff;color:#6b7785;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border-top:2px dashed #c3cad2}

.hblk.h1{background:#f0f2f5}.hblk.h2,.hblk.h3{background:#eef2ee;border-color:#cdd8cd}.hblk.h4{background:#f7f3ee;border-color:#e2d6c6;color:#6b5a45}

.plab.v{background:#5b636c}.plab .dg{font-size:10px;padding:0 6px;min-width:0}
.cdot{font-style:normal;color:#f0c75e;font-size:9px}

function famList(kind){return kind==='vocab'?VOC:FAM}
function detect(title,kind){
  var s=(title||'').toLowerCase().replace(/\s/g,'');
  if(kind==='vocab'){for(var i=VOC.length-1;i>=0;i--){if(s.indexOf(VOC[i][0])>=0)return VOC[i][0]}return 'etc'}
  if(s.indexOf('ph워크북')>=0||s.indexOf('phs워크북')>=0||s.indexOf('phspeed')>=0)return 'phonics';
  if(s.indexOf('story')>=0)return 'reading';
  if(s.indexOf('workbook')>=0||s.indexOf('wookbook')>=0||s.indexOf('워크북e')>=0||s.indexOf('워크북m')>=0||s.indexOf('sentencebuildup')>=0)return 'basic';
  for(var j=0;j<FAM.length;j++){if(s.indexOf(FAM[j][0])>=0)return FAM[j][0]}

}

function colors(){ // id -> [bg,fg]
  var out={};
  S.rows.forEach(function(r){
    var list=inRow(r.id),groups={};
    list.forEach(function(b){var k=famOf(b);(groups[k]=groups[k]||[]).push(b)});

// push overlaps right; fixed block keeps its spot (or snaps beside a block it mostly overlaps)
function resolve(rid,fixedId){
  var B=blk(fixedId),others=inRow(rid).filter(function(b){return b.id!==fixedId});
  if(B){
    if(B.start<0)B.start=0;
    others.forEach(function(X){
      if(X.start<B.start&&X.start+X.len>B.start){
        if(B.start-X.start<X.len/2)X.start=B.start;else B.start=X.start+X.len;
      }
    });
    var cur=B.start+B.len;
    others.filter(function(X){return X.start>=B.start}).sort(function(a,b){return a.start-b.start}).forEach(function(X){if(X.start<cur)X.start=cur;cur=Math.max(cur,X.start+X.len)});
  }else{
    var c=0;others.forEach(function(X){if(X.start<c)X.start=c;c=X.start+X.len});
  }
}

function act(a){

  case 'len+':if(b){var o2=b.len;b.len++;if(chain)shiftAfter(b,1,o2);resolve(b.row,b.id);commit()}break;

  case 'add':var t=(document.getElementById('n-title').value||'').trim();if(!t){toast('교재명을 입력해 주세요');return}
    var L=Math.max(1,parseInt(document.getElementById('n-len').value,10)||4);

    var items=cu.map(function(x){return {id:x.id,ref:x.ref||'',title:x.title,cal:+x.cal,len:Math.max(1,+x.len||1)}}).sort(function(a,b){return a.cal-b.cal});
    var sb0=null;for(var i=0;i<items.length;i++){if(items[i].ref&&blk(items[i].ref)){sb0=blk(items[i].ref);break}}
    return {custom:true,from:items[0].cal,items:items,skipped:[],sb:sb0};
  }
  var sb=st.starts&&st.starts[rowId]?blk(st.starts[rowId]):null;
  if(!sb||sb.row!==rowId)return null;
  var from=ymParse((st.fromR&&st.fromR[rowId])||st.from);if(from==null)return null
  var shift=0,items=[],skipped=[];
  inRow(rowId).filter(function(b){return b.start>=sb.start}).forEach(function(b){
    if(b.id!==sb.id&&st.skips&&st.skips[b.id]){skipped.push({b:b});shift+=b.len;return}
    items.push({id:b.id,ref:b.id,title:b.title,cal:from+(b.start-sb.start-shift),len:b.len});
  });
  return {custom:false,from:from,items:items,skipped:skipped,sb:sb};
}
// ★ 완료 표시: 마지막으로 완료한 교재의 완료일부터 뒤 교재를 다시 이어 붙임 (완료한 교재까지는 실제 기록으로 고정)
function doneOf(st,rowId){return (st.done&&st.done[rowId])||{}}
function applyDone(st,rowId,R){
  var D=doneOf(st,rowId),L=R.items,j=-1;
  L.forEach(function(it,i){if(D[it.id])j=i});
  if(j<0)return;
  var oe=L[j].cal+L[j].len;
  for(var i=0;i<=j;i++){var it=L[i];it.fixed=true;if(D[it.id]){var e=dateIdx(D[it.id]);if(e!=null){if(e<=it.cal)it.cal=e-0.4;it.len=e-it.cal}}}
  var ne=dateIdx(D[L[j].id]),d=ne-oe;
  for(var k=j+1;k<L.length;k++)L[k].cal+=d;
  R.reFrom=ne;
}
// ---- 시험대비 기간만큼 밀기까지 적용한 계획 ----
function stuPlan(st,rowId,noDone){
  var R=rawItems(st,rowId,noDone);if(!R)return null;var from0=R.reFrom!=null?R.reFrom:R.from;
  var segs=R.items.map(function(it){return {item:it,cal:it.cal,len:it.len,done:0}}),exams=[];
  var row=rowOf(rowId);
  if(!row||row.pause!==false){
    stuExams(st).forEach(function(o){
      if(o.e+o.len<=from0)return;
      var out=[];
      segs.forEach(function(g){
        if(g.exam||g.item.fixed){if(g.exam&&g.cal>=o.e)g.cal+=o.len;out.push(g);return}
        var end=g.cal+g.len;
        if(end<=o.e)out.push(g);
        else if(g.cal>=o.e){g.cal+=o.len;out.push(g)}
        else{var a=o.e-g.cal; // 시험대비 직전·직후 반 주 미만 조각은 나누지 않음
          if(a<0.5)out.push({item:g.item,cal:o.e+o.len,len:g.len-a,done:g.done+a});
          else if(g.len-a<0.5)out.push({item:g.item,cal:g.cal,len:a,done:g.done});
          else{out.push({item:g.item,cal:g.cal,len:a,done:g.done,part:1});out.push({item:g.item,cal:o.e+o.len,len:g.len-a,done:g.done+a,part:2})}}
      });
      out.push({exam:o.x,cal:o.e,len:o.len});exams.push(o);
      segs=out.sort(function(a,b){return a.cal-b.cal});
    });
  }
  return {custom:R.custom,sb:R.sb,from:R.from,items:R.items,segs:segs,skipped:R.skipped,exams:exams};
}
// ★ 계획 대비: 완료일 − (완료 표시 전 원래 계획의 끝나는 날) → +면 늦음, −면 빠름 (주)
function planEnd(st,rowId,itemId){var P=stuPlan(st,rowId,true);if(!P)return null;var e=null;P.segs.forEach(function(g){if(!g.exam&&g.item.id===itemId)e=g.cal+g.len});return e}
function doneDiff(st,rowId,itemId){var d=doneOf(st,rowId)[itemId];if(!d)return null;var pe=planEnd(st,rowId,itemId),de=dateIdx(d);if(pe==null||de==null)return null;return Math.round(de-pe)}
function stuStatus(st,rowId){
  var P=stuPlan(st,rowId),now=nowIdx();
  var out={plan:P,cur:null,diff:null,exam:null,unconf:0,uncT:[],lastDone:null};
  if(!P||!P.items.length)return out;
  var books=P.segs.filter(function(g){return !g.exam});
  P.segs.forEach(function(g){if(now>=g.cal&&now<g.cal+g.len){if(g.exam){out.exam=g.exam;out.examEnd=g.cal+g.len}else out.cur={title:g.item.title,id:g.item.id,item:g.item}}});
  if(out.cur){var ce=0;books.forEach(function(g){if(g.item===out.cur.item)ce=Math.max(ce,g.cal+g.len)});out.curEnd=ce}
  if(!out.cur&&!out.exam){var next=null;books.forEach(function(g){if(!next&&g.cal>now)next=g});if(next)out.next={title:next.item.title}}
  var D=doneOf(st,rowId),last=null;Object.keys(D).forEach(function(k){if(P.items.some(function(it){return it.id===k})&&(!last||D[k]>D[last]))last=k});
  if(last){out.lastDone=last;out.diff=doneDiff(st,rowId,last)}
  // 계획상 이미 끝났는데 완료 표시를 안 한 교재 수
  var seen={};books.forEach(function(g){if(!g.item.fixed&&g.cal+g.len<=now&&!seen[g.item.id]){var more=books.some(function(h){return h.item===g.item&&h.cal+h.len>now});if(!more){seen[g.item.id]=1;out.unconf++;out.uncT.push(g.item.title)}}});
  var up=P.exams.filter(function(o){return o.e>now})[0];if(up)out.upExam=up;
  return out;
}

  if(miss.length||noDate.length)setTimeout(function(){alert((miss.length?'로드맵에서 찾지 못한 교재 (이름을 확인해 주세요):\n'+miss.slice(0,40).join('\n')+'\n\n':'')+(noDate.length?'시작일이 비어 있는 칸 '+noDate.length+'개 — 시작일을 넣어야 그 줄 로드맵이 그려져요:\n'+noDate.slice(0,30).join('\n')+(noDate.length>30?'\n… 외 '+(noDate.length-30)+'개':''):''))},300);
}

// ---------- 탭·휴대폰 손가락 밀기 (가로·세로) ----------
// 앱 안 액자 화면 등에서 브라우저 기본 스크롤이 막히는 경우가 있어, 손가락 움직임을 직접 받아 화면을 움직임
(function(){
  var T=null;
  function canScroll(el,ax){
    if(!el||el===document.body||el===document.documentElement)return false;
    var cs=getComputedStyle(el),ov=ax==='x'?cs.overflowX:cs.overflowY;
    if(ov!=='auto'&&ov!=='scroll')return false;
    return ax==='x'?el.scrollWidth>el.clientWidth+1:el.scrollHeight>el.clientHeight+1;
  }
  function chain(t,ax){var a=[];for(var el=t;el&&el.nodeType===1;el=el.parentElement)if(canScroll(el,ax))a.push(el);a.push(document.scrollingElement||document.documentElement);return a}
  function move(list,ax,d){ // d: 움직일 픽셀. 안쪽부터 움직이고, 끝에 닿으면 바깥으로 넘김
    for(var i=0;i<list.length&&Math.abs(d)>0.5;i++){
      var el=list[i],before=ax==='x'?el.scrollLeft:el.scrollTop;
      if(ax==='x')el.scrollLeft=before+d;else el.scrollTop=before+d;
      var moved=(ax==='x'?el.scrollLeft:el.scrollTop)-before;d-=moved;
    }
    if(Math.abs(d)>0.5){try{if(window.parent&&window.parent!==window)window.parent.scrollBy(ax==='x'?d:0,ax==='y'?d:0)}catch(e){}}
  }
  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){T=null;return}
    var tg=e.target;if(tg.closest&&tg.closest('input[type=range],select,textarea,input[type=month],input[type=date]')){T=null;return}
    var t=e.touches[0];T={t:tg,x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,axis:null,list:null};
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!T||e.touches.length!==1)return;
    var t=e.touches[0];
    if(!T.axis){var dx0=t.clientX-T.x,dy0=t.clientY-T.y;if(Math.abs(dx0)<6&&Math.abs(dy0)<6)return;
      T.axis=Math.abs(dx0)>Math.abs(dy0)?'x':'y';T.list=chain(T.t,T.axis);T.lx=T.x;T.ly=T.y}
    e.preventDefault();
    if(T.axis==='x'){move(T.list,'x',T.lx-t.clientX)}else{move(T.list,'y',T.ly-t.clientY)}
    T.lx=t.clientX;T.ly=t.clientY;
  },{passive:false});
  document.addEventListener('touchend',function(){T=null},{passive:true});
  document.addEventListener('touchcancel',function(){T=null},{passive:true});
})();

}
