/* ══════════════════════════════════════════════════════════════
   교재비 프로그램 (fee.html) v13 — 기획: claude/교재비_프로그램_기획.md (2판)

   v27: 🗂 지난 목록에 통통통 판매내역도 달별로 (10월까지 청구한 것)
   v26: 🗂 지난 목록에 예전 교재비 화면에서 청구 완료한 것도 달별로 보이기
   v25: 위 제목·탭을 한 덩어리로 고정 (숙제관리 탭 안에서 스크롤할 때 내용이 탭 사이로 비치던 것), 학생별 교재를 날짜순으로
   v24: 이번 달 목록 화면에 '예전 화면 청구 완료로 빠진 배부' 알림 + 한 번에 되돌리기
   v23: 예전 화면 "청구 완료" 중 잘못 표시된 것을 이 프로그램에서 "청구 전으로 되돌리기" (숙제관리 데이터는 그대로)
   v22: 예전 교재비 화면의 '청구 완료' 표시(feeLog.billed)를 이미 청구된 것으로 읽음
   v21: 디자인을 숙제관리 앱과 맞춤 (색·버튼·탭·표 모양)
   v20: 숙제관리 v551의 배부 취소 기록(feeCancel) 읽기, 숙제관리 탭 안에서는 제목 숨김
   v19: 배부 현황 숫자에 마우스를 올리면 받은 학생 이름
   v18: 취소 후 같은 교재 다시 배부 → 예전 목록 청구를 이어받음 ("새로 청구"로 바꿀 수 있음)
   v17: 교재별 권수를 교재 × 반 표로, 📊 배부 현황 페이지 (반별 이 달 · 달별 최근 6달)
   v16: 인쇄 때 반 이름이 쪽 끝에 홀로 남지 않게 (반 제목 + 첫 줄 같이)
   v15: 교재별 인쇄 — 교재마다 세로 칸 3줄 배치, 반 학생 모두 적고 청구 학생만 ■
   v14: 같은 반·같은 교재끼리 묶어 인쇄 (교재별 인쇄)
   v13: 2판으로 다시 만듦 (연결표·통통통 엑셀·가격·선생님 구분 없앰, 확인창, 인쇄)
   ══════════════════════════════════════════════════════════════ */
const VER = 'v29';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAh3zMoepbA38yFFEDQ210XWveBdf2HDN8",
  authDomain: "sotong-academy.firebaseapp.com",
  databaseURL: "https://sotong-academy-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sotong-academy",
  storageBucket: "sotong-academy.firebasestorage.app",
  messagingSenderId: "401247371093",
  appId: "1:401247371093:web:fb714d3f1348a9aa56b9dc"
};
const SRC_PATH = 'homework_v4';   // 숙제관리 — 읽기 전용
const STORE_PATHS = { test: 'homework_v4_fee_test', live: 'homework_v4_fee' };
const STORE_KEYS = ['settings', 'bills', 'billed', 'skip', 'ok', 'acks', 'seen', 'renew', 'unlegacy'];
const DEFAULT_START = '2026-10-26';   // 이 날 이후 배부분부터 챙김 (그 전은 정리 끝남)
const EXCLUDE = /전자교재/;
// ★ v29 판매내역에서 빼는 것: [교재 이름(띄어쓰기 무시), 이 날짜부터]
const SALES_DROP = [['스터디포스독해트레이닝', '2026-01-01']];
const salesDrop = (book, date) => SALES_DROP.some(([n, from]) => norm(book).includes(norm(n)) && date >= from);
const KIND = { main: '주교재', sub: '부교재', extra: '단기', word: '단어장', etc: '기타' };
const KIND_ORDER = ['main', 'sub', 'extra', 'word', 'etc'];

let storeMode = (() => { try { return localStorage.getItem('fee_store_mode') === 'live' ? 'live' : 'test'; } catch (e) { return 'test'; } })();
const STORE = () => STORE_PATHS[storeMode];

const D = { students: [], books: [], groups: [], from: '' };   // 숙제관리 (읽기 전용)
let F = emptyStore();
let SALES = null, SX = null;                                    // 판매내역 (참고용)
function emptyStore() { const o = {}; STORE_KEYS.forEach(k => o[k] = {}); return o; }
let db = null, fbOK = false, fbErr = '', storeOnline = false, seenReady = false;

/* ---------- 도구 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const nowStr = () => { const d = new Date(); return `${fmt(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function monthAdd(m, n) { let y = +m.slice(0, 4), mo = +m.slice(5, 7) + n; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${pad(mo)}`; }
function defaultMonth() { const t = today(); return +t.slice(8) > 25 ? monthAdd(t.slice(0, 7), 1) : t.slice(0, 7); }
const period = m => ({ from: monthAdd(m, -1) + '-26', to: m + '-25' });
const md = d => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : '';
const ymd = d => d ? `${d.slice(2, 4)}.${+d.slice(5, 7)}.${+d.slice(8, 10)}` : '';
const mL = m => m ? `${+m.slice(5, 7)}월` : '';
const mLY = m => m ? `${m.slice(0, 4)}년 ${+m.slice(5, 7)}월` : '';
const toArr = v => !v ? [] : Array.isArray(v) ? v.filter(x => x != null) : Object.values(v).filter(x => x != null);
const norm = s => String(s || '').toLowerCase().replace(/[^0-9a-z가-힣]/g, '');
const normName = s => String(s || '').replace(/\s+/g, '').replace(/\d+$/, '');
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function nid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
const byGN = (a, b) => (a.group || '').localeCompare(b.group || '', 'ko') || (a.name || '').localeCompare(b.name || '', 'ko');
const kTag = k => `<span class="k ${k}">${KIND[k] || k}</span>`;
const stamp = () => ({ at: nowStr() });
const atTxt = o => o && o.at ? esc(String(o.at).slice(5)) : '';
const UI = { tab: 'bill', month: defaultMonth(), group: '', kind: '', fStu: '', fBook: '', unsel: new Set(), hMonth: '', sid: '', dlgShown: false,
  view: (() => { try { return localStorage.getItem('fee_view') || 'stu'; } catch (e) { return 'stu'; } })(),
  legendOpen: (() => { try { return !!localStorage.getItem('fee_legend'); } catch (e) { return false; } })() };
const startFrom = () => (F.settings && F.settings.startFrom) || DEFAULT_START;

/* ---------- 비슷한 교재인지 ----------
   같다: 띄어쓰기·기호·대소문자 빼면 같은 이름
   비슷하다: 숫자(권·단계)가 같고, 글자 부분이 한쪽에 들어 있음 (예: Story 3 ↔ Beyond Story - 03) */
function bigrams(s) { const a = []; for (let i = 0; i < s.length - 1; i++) a.push(s.slice(i, i + 2)); return a; }
function dice(a, b) { const A = bigrams(a), B = bigrams(b); if (!A.length || !B.length) return 0; const m = new Map(); A.forEach(x => m.set(x, (m.get(x) || 0) + 1)); let n = 0; B.forEach(x => { if (m.get(x)) { n++; m.set(x, m.get(x) - 1); } }); return 2 * n / (A.length + B.length); }
function sameBook(a, b) {
  const na = norm(a), nb = norm(b); if (!na || !nb) return '';
  if (na === nb) return '같은 교재';
  const dg = s => (String(s).match(/\d+/g) || []).map(Number).join(',');
  if (dg(a) !== dg(b)) return '';
  const la = na.replace(/\d+/g, ''), lb = nb.replace(/\d+/g, '');
  if (la.length < 2 || lb.length < 2) return '';
  if (la.includes(lb) || lb.includes(la)) return '비슷한 교재';   // 예: story ⊂ beyondstory (E2 ↔ M2처럼 글자가 다르면 아님)
  return '';
}

/* ---------- 숙제관리 데이터 (읽기 전용) ---------- */
const studentById = id => D.students.find(s => String(s.id) === String(id));

function kindOf(b, name) {

function feeLogOf(st) { return toArr(st.feeLog).filter(f => f && f.date && f.id != null && !EXCLUDE.test(f.bookName || '')); }

/* ---------- 저장 (교재비 경로만) ---------- */
function _guard(p) { if (!/^homework_v4_fee(_test)?\//.test(p)) throw new Error('잘못된 저장 경로: ' + p); return p; }
const ck = k => `fee_${STORE()}_${k}`;

function setLocal(path, val) {

  for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }

  catch (e) { console.error('[교재비 저장 실패]', e); toast('⚠ 서버 저장 실패 — 이 기기에만 저장됐어요'); return false; }
}

/* ---------- Firebase ---------- */
function initFirebase() {
  if (typeof firebase === 'undefined') { fbErr = '서버 도구를 불러오지 못했어요 (인터넷 확인)'; return false; }
  try { const app = firebase.apps.find(a => a.name === 'fee_v13') || firebase.initializeApp(FIREBASE_CONFIG, 'fee_v13'); db = firebase.database(app); fbOK = true; return true; }
  catch (e) { fbErr = e.message; return false; }
}
let _subs = [];
function subscribe() {
  _subs.forEach(off => off()); _subs = []; seenReady = !fbOK;
  if (!fbOK) return;
  const src = {}, got = new Set();
  ['students', 'books', 'groups'].forEach(k => {
    const ref = db.ref(`${SRC_PATH}/${k}`);
    const cb = ref.on('value', sn => { src[k] = sn.val(); got.add(k); if (got.size === 3) setSource(src, 'firebase'); }, e => { fbErr = '숙제관리 데이터 읽기 실패: ' + e.message; render(); });
    _subs.push(() => ref.off('value', cb));
  });
  STORE_KEYS.forEach(k => {
    const ref = db.ref(`${STORE()}/${k}`);
    const cb = ref.on('value', sn => { storeOnline = true; F[k] = sn.val() || {}; cacheSave(); if (k === 'seen' && !seenReady) { seenReady = true; syncSeen(); } render(); },
      e => { storeOnline = false; seenReady = true; fbErr = '교재비 저장소 읽기 실패: ' + e.message; render(); });
    _subs.push(() => ref.off('value', cb));
  });
  const sref = db.ref(`${STORE()}/sales`);
  const scb = sref.child('meta').on('value', sn => {
    const m = sn.val(); if (!m || (SALES && SALES.meta && SALES.meta.at === m.at)) return;
    sref.once('value').then(s2 => { const v = s2.val(); if (v) { SALES = { meta: v.meta, rows: toArr(v.rows) }; try { localStorage.setItem(ck('sales'), JSON.stringify(SALES)); } catch (e) {} buildSX(); render(); } });
  });
  _subs.push(() => sref.child('meta').off('value', scb));
}

/* ---------- 배부 기록 지켜보기 (숙제관리는 배부 취소 시 기록을 지움 → 여기 따로 남김) ---------- */
function syncSeen() {
  if (!D.from || !seenReady || (fbOK && D.from !== 'firebase')) return;
  const now = {}, ch = {};
  D.students.forEach(st => feeLogOf(st).forEach(f => { now[`f:${st.id}:${f.id}`] = { st, f }; }));
  Object.entries(now).forEach(([k, { st, f }]) => {
    const s = F.seen[k];
    if (!s) ch[`seen/${k}`] = { sid: st.id, bookId: f.bookId, name: f.bookName || '', date: f.date, cohort: f.cohort || '', first: today() };
    else if (s.gone) ch[`seen/${k}/gone`] = null;
  });
  // ★ v20 숙제관리(v551~)가 남긴 배부 취소 기록(st.feeCancel) — 이 프로그램을 안 연 사이의 취소도 잡음
  const done = new Set();
  D.students.forEach(st => toArr(st.feeCancel).forEach(c => {
    if (!c || c.id == null || EXCLUDE.test(c.bookName || '')) return;
    const k = `f:${st.id}:${c.id}`; if (now[k]) return; done.add(k);
    const s = F.seen[k], when = c.cancelled || today();
    if (!s) ch[`seen/${k}`] = { sid: st.id, bookId: c.bookId, name: c.bookName || '', date: c.date || '', cohort: c.cohort || '', first: when, gone: when, from: '숙제관리 취소 기록' };
    else if (!s.gone) ch[`seen/${k}/gone`] = when;
  }));
  Object.entries(F.seen).forEach(([k, s]) => { if (s && !s.gone && !now[k] && !done.has(k)) ch[`seen/${k}/gone`] = today(); });
  if (Object.keys(ch).length) write(ch, true);
}

/* ---------- 통통통 판매내역 (참고용) ---------- */
function excelDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const m = String(v).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : '';
}
function parseSalesWorkbook(wb) {
  const rows = [], seen = new Set();
  wb.SheetNames.forEach(sn => {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    const h = aoa.findIndex(r => r.includes('판매일자') && r.includes('원생명') && r.includes('교재명'));
    if (h < 0) return;
    const ix = n => aoa[h].indexOf(n);
    const I = { d: ix('판매일자'), n: ix('원생명'), b: ix('교재명'), q: ix('판매수량'), code: ix('판매코드') };
    aoa.slice(h + 1).forEach(r => {
      const name = String(r[I.n] || '').trim(), book = String(r[I.b] || '').trim(), date = excelDate(r[I.d]);
      if (!name || !book || !date || EXCLUDE.test(book)) return;
      const sc = I.code >= 0 ? String(r[I.code]) : '';
      if (sc) { if (seen.has(sc)) return; seen.add(sc); }
      rows.push([name, book, date, Number(r[I.q]) || 0]);
    });
  });
  rows.sort((a, b) => a[2].localeCompare(b[2]));
  return { meta: { at: new Date().toISOString(), count: rows.length, from: rows.length ? rows[0][2] : '', to: rows.length ? rows[rows.length - 1][2] : '' }, rows };
}
function buildSX() {   // 학생(이름 띄어쓰기·뒤 숫자 무시) → [{book, date}] (환불 뺌)
  SX = new Map();
  if (!SALES || !SALES.rows) return;
  SALES.rows.forEach(r => {
    const [name, book, date, qty] = r.length >= 7 ? [r[0], r[2], r[3], r[4]] : r;   // 예전 형식도 읽음
    if (EXCLUDE.test(book) || salesDrop(book, date)) return;
    const k = normName(name); if (!SX.has(k)) SX.set(k, []);
    const L = SX.get(k);
    if (qty > 0) L.push({ book, date });
    else if (qty < 0) { let j = -1; L.forEach((x, i) => { if (x.book === book && x.date <= date) j = i; }); if (j >= 0) L.splice(j, 1); }
  });
}
const salesOf = st => (SX && SX.get(normName(st.name))) || [];

/* ══════════ 학생 한 명 분석 ══════════
   state: listed(목록 확정됨) · skip(목록에서 뺌) · old(시작일 전 — 정리 끝남) · next(다음 달) · open(이번 목록)
   표시: late(지난 기간인데 목록에 안 들어감) · dup(같은 기간 같은 교재 두 번 — 표시만) · redist(취소 후 다시 배부)
        prior(예전에 같거나 비슷한 교재를 받은 적 있음 — 숙제앱 지난 배부·판매내역) → need: 확인창에서 정할 때까지 목록에서 빠짐 */
function analyze(st, M) {
  const P = period(M), S0 = startFrom(), log = feeLogOf(st), sales = salesOf(st);
  const items = log.map(f => { const b = bookById(f.bookId);
    return { key: `f:${st.id}:${f.id}`, sid: st.id, bookId: f.bookId, name: f.bookName || (b && b.name) || '(이름 없음)', kind: kindOf(b, f.bookName), cohort: f.cohort || '', date: f.date, oldBilled: f.billed || '' }; })
    .sort((a, b) => a.date.localeCompare(b.date) || a.key.localeCompare(b.key));
  items.forEach(it => {
    const bid = F.billed[it.key];
    if (bid && F.bills[bid]) { it.state = 'listed'; it.bill = F.bills[bid]; }
    else if (it.oldBilled && !F.unlegacy[it.key]) it.state = 'legacy';   // ★ v22 예전 교재비 화면(숙제관리 v550 이전)에서 '청구 완료'로 표시한 배부 → 이미 청구된 것
    else if (F.skip[it.key]) it.state = 'skip';
    else if (it.date < S0) it.state = 'old';
    else if (it.date > P.to) it.state = 'next';
    else { it.state = 'open'; it.late = it.date < P.from; }
  });
  const openP = items.filter(i => i.state === 'open' && !i.late);
  openP.forEach(i => { const n = openP.filter(o => String(o.bookId) === String(i.bookId)).length; if (n > 1) i.dup = n; });
  const gone = Object.entries(F.seen).filter(([, s]) => s && s.gone && String(s.sid) === String(st.id)).map(([k, s]) => ({ ...s, key: k }));
  // 취소 후 같은 교재를 다시 배부 → 취소된 배부가 목록에 확정돼 있었으면 '이미 청구된 것'으로 이어받음 (한 번씩 짝, 날짜순)
  const usedGone = new Set();
  items.forEach(it => {
    const s = F.seen[it.key];
    const g = gone.filter(x => String(x.bookId) === String(it.bookId) && (!s || x.gone <= (s.first || it.date)));
    if (g.length) it.redist = g.map(x => ({ date: x.date, gone: x.gone }));
    if (['open', 'old', 'next'].includes(it.state) && !F.renew[it.key]) {
      const src = g.filter(x => !usedGone.has(x.key) && F.billed[x.key] && F.bills[F.billed[x.key]]).sort((a, b) => a.date.localeCompare(b.date))[0];
      if (src) { usedGone.add(src.key); it.state = 'inherit'; it.inherit = { key: src.key, date: src.date, gone: src.gone, month: F.bills[F.billed[src.key]].month }; }
    }
    if (it.state !== 'open') return;
    const pr = [];
    items.forEach(o => { if (o === it || o.date >= it.date || (it.dup && String(o.bookId) === String(it.bookId) && o.date >= period(M).from)) return;
      const how = String(o.bookId) === String(it.bookId) ? '같은 교재' : sameBook(o.name, it.name); if (how) pr.push({ date: o.date, name: o.name, src: '숙제앱 배부', how }); });
    sales.forEach(x => { if (x.date >= it.date) return; const how = sameBook(x.book, it.name); if (how) pr.push({ date: x.date, name: x.book, src: '판매내역', how }); });
    pr.sort((a, b) => b.date.localeCompare(a.date));
    if (pr.length) it.prior = pr;
    it.need = !!pr.length && !F.ok[it.key];
  });
  const pm = monthAdd(M, -1);
  const prev = toArr(F.bills).filter(b => b.month === pm).flatMap(b => toArr(b.items).filter(i => String(i.sid) === String(st.id)).map(i => i.name));
  return { st, items, prev };
}
const analyzeAll = M => D.students.map(st => analyze(st, M));
const selectable = it => it.state === 'open' && !it.need;
function fPass(st, i) { return UI.view === 'stu' ? (!UI.fStu || String(st.id) === UI.fStu) : (!UI.fBook || String(i.bookId) === UI.fBook); }

/* ---------- 확인 목록 데이터 ---------- */
function checkList(M) {
  const all = analyzeAll(M), out = { cancel: [], redist: [], need: [], dup: [], gone: [] };
  const inherited = new Set(); all.forEach(x => x.items.forEach(it => { if (it.inherit) inherited.add(it.inherit.key); }));
  const listed = new Map(); toArr(F.bills).forEach(b => toArr(b.items).forEach(i => listed.set(i.key, { ...i, month: b.month })));
  Object.entries(F.seen).forEach(([k, s]) => {
    if (!s || !s.gone) return; const st = studentById(s.sid);
    const base = { key: k, sid: s.sid, st, name: s.name, date: s.date, gone: s.gone, kind: kindOf(bookById(s.bookId), s.name) };
    if (listed.has(k)) { if (!F.acks[`cancel|${k}`] && !inherited.has(k)) out.cancel.push({ ...base, bill: listed.get(k) }); }
    else if (s.date >= startFrom() && !F.acks[`gone|${k}`]) out.gone.push(base);
  });
  all.forEach(x => x.items.forEach(it => {
    if (it.redist && ['open', 'listed', 'inherit'].includes(it.state) && !F.acks[`redist|${it.key}`]) out.redist.push({ x, it });
    if (it.need) out.need.push({ x, it });
    if (it.dup && it.state === 'open' && !F.acks[`dup|${it.key}`]) out.dup.push({ x, it });
  }));
  return out;
}
const checkCount = c => c.cancel.length + c.redist.length + c.need.length;

/* 교재 × 반 권수 표 (인쇄·배부 현황 같이 씀) — rows: {group, name, kind} */
function matrixHtml(rows, cls, lab, cols) {

    <tr class="tot"><td colspan="2">합계</td>${gs.map(g => `<td class="n">${gt(g)}</td>`).join('')}<td class="n">${rows.length}</td></tr></table>`;

/* ---------- 📊 배부 현황 — 이 기간 숙제앱에서 배부한 교재 전체 (교재 × 반) ---------- */
function statRows(M) {
  const P = period(M), out = [];
  D.students.forEach(st => feeLogOf(st).forEach(f => {
    if (f.date < P.from || f.date > P.to) return;
    const key = `f:${st.id}:${f.id}`; if (F.skip[key] && UI.statSkip !== 'all') return;
    const b = bookById(f.bookId); const kind = kindOf(b, f.bookName);
    if (UI.kind && kind !== UI.kind) return; if (UI.group && st.group !== UI.group) return;
    out.push({ key, sid: st.id, student: st.name, group: st.group || '', name: f.bookName || (b && b.name) || '', kind, date: f.date, listed: !!(F.billed[key] && F.bills[F.billed[key]]) || (!!f.billed && !F.unlegacy[key]) });
  }));
  return out;
}
function statMonthRows(M, n) {   // 최근 n달 (각 달 = 지난달 26일 ~ 그달 25일), group 칸에 달을 넣어 표로
  const ms = []; for (let i = n - 1; i >= 0; i--) ms.push(monthAdd(M, -i));
  return { ms, rows: ms.flatMap(m => statRows(m).map(x => ({ ...x, cls: x.group, group: m }))) };
}

      if (storeOnline) await db.ref(_guard(`${STORE()}/sales`)).set({ meta: S.meta, rows: S.rows });
      toast(`📂 판매내역 ${S.meta.count.toLocaleString()}건을 불러왔어요`);
    } catch (e) { alert('판매내역을 읽지 못했어요: ' + e.message); }
  };
  rd.readAsArrayBuffer(file);
}
function setMode(m) {
  if (m === 'live' && !confirm('실제 저장으로 바꿀까요?\n이제부터 목록·확인 기록이 실제 저장소(homework_v4_fee)에 남아요.')) return render();
  storeMode = m; try { localStorage.setItem('fee_store_mode', m); } catch (e) {}
  storeOnline = false; cacheLoad(); UI.unsel.clear(); subscribe(); syncSeen(); render();
  toast(m === 'live' ? '✅ 실제 저장으로 바꿨어요' : '🧪 테스트 저장으로 바꿨어요');
}
function loadBackup(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { const j = JSON.parse(rd.result); const data = j.data || j; if (!data.students) throw new Error('학생 데이터가 없는 파일');
      try { localStorage.setItem('fee_src_backup', JSON.stringify({ students: data.students, books: data.books, groups: data.groups })); } catch (e) {}
      setSource(data, 'file'); toast(`📂 백업 파일을 읽었어요 (학생 ${D.students.length}명)`);
    } catch (e) { alert('백업 파일을 읽지 못했어요: ' + e.message); } };
  rd.readAsText(file);
}
function backupStore() {
  const blob = new Blob([JSON.stringify({ _fee: { ver: VER, path: STORE(), at: new Date().toISOString() }, data: F })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `교재비_백업_${storeMode}_${today()}_${VER}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function restoreStore(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { const data = (JSON.parse(rd.result).data) || {};
      if (!confirm(`지금 저장소(${STORE()})를 이 백업으로 바꿀까요? (목록 ${Object.keys(data.bills || {}).length}개)`)) return;
      const ch = {}; STORE_KEYS.forEach(k => { ch[k] = data[k] || null; }); write(ch); toast('되살렸어요');
    } catch (e) { alert('파일을 읽지 못했어요: ' + e.message); } };
  rd.readAsText(file);
}
function clearTest() {
  if (storeMode !== 'test' || !confirm('테스트 저장소의 기록을 모두 지울까요? (판매내역은 그대로)')) return;
  const ch = {}; STORE_KEYS.forEach(k => { ch[k] = null; }); write(ch); syncSeen(); toast('테스트 데이터를 지웠어요');
}

/* ---------- 숫자에 마우스 → 받은 학생 이름 ---------- */
function showTip(el, x, y) {
  const t = $('tip'), [head, ...names] = el.getAttribute('data-tip').split('\n');
  t.innerHTML = `<b>${esc(head)}</b>\n${names.map(esc).join('\n')}`; t.style.display = 'block';
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(x + 14, window.innerWidth - w - 8) + 'px'; t.style.top = Math.min(y + 14, window.innerHeight - h - 8) + 'px';
}
document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else $('tip').style.display = 'none'; });
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); });   // 터치 화면용
document.addEventListener('scroll', () => { $('tip').style.display = 'none'; }, true);

/* ---------- 시작 ---------- */
(function start() {
  try { if (window.self !== window.top) document.body.classList.add('embed'); } catch (e) { document.body.classList.add('embed'); }   // 숙제관리 탭 안에서 열림
  cacheLoad();
  seenReady = true;
  if (initFirebase()) subscribe();
  try { const b = JSON.parse(localStorage.getItem('fee_src_backup') || 'null'); if (b && b.students && D.from !== 'firebase') setSource(b, 'file'); } catch (e) {}
  render();
  setTimeout(() => { if (D.from !== 'firebase' && fbOK && !fbErr) { fbErr = '서버 응답이 늦어요 (인터넷 확인)'; render(); } }, 8000);
})();
</script>
