<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="theme-color" content="#0b4972">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="교재 찾기">
<title>Sentence Build up 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* ★ 더퍼스트 교재 찾기 — student.html과 같은 색·글꼴을 쓴다.
   교재 내용은 이 파일 안(맨 아래 FIND_DATA)에 들어 있어서 Firebase를 읽지 않는다 = 학생 정보와 무관 */
:root { --brand-1:#0a4771; --brand-2:#1c6ca8; --brand:#0e5588; --mu:#6b7280; --bd:#e5e7eb; --hl:#fff1b8; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif; background:#f5f5f7; color:#1a1a18; -webkit-font-smoothing:antialiased; }
body { max-width:560px; margin:0 auto; background:#fff; min-height:100vh; box-shadow:0 0 40px rgba(0,0,0,.05); }

.f-header { background:linear-gradient(135deg,var(--brand-1) 0%,var(--brand-2) 100%); color:#fff; padding:1.2rem 1.1rem 1rem; position:relative; }
.f-back { display:none; background:rgba(255,255,255,.2); border:none; color:#fff; padding:.32rem .65rem; border-radius:18px; font-size:.74rem; font-family:inherit; cursor:pointer; margin-bottom:.6rem; }
.f-back.show { display:inline-block; }
.f-title { font-size:1.3rem; font-weight:800; line-height:1.2; }
.f-sub { font-size:.78rem; opacity:.85; margin-top:.3rem; }

.f-search { position:sticky; top:0; z-index:5; background:#fff; padding:.75rem 1.1rem .6rem; border-bottom:1px solid #f0f1f3; }
.f-box { display:flex; align-items:center; gap:.4rem; border:2px solid var(--brand-2); border-radius:12px; padding:.15rem .3rem .15rem .75rem; background:#fff; }
.f-box input { flex:1; border:none; outline:none; font-size:1rem; font-family:inherit; padding:.55rem 0; min-width:0; background:transparent; }
.f-clear { border:none; background:#eef0f2; color:#555; width:28px; height:28px; border-radius:50%; font-size:.9rem; cursor:pointer; display:none; }
.f-clear.show { display:block; }
.f-chips { display:flex; gap:.35rem; overflow-x:auto; padding-top:.55rem; scrollbar-width:none; }
.f-chips::-webkit-scrollbar { display:none; }
.f-chip { flex:0 0 auto; border:1px solid var(--bd); background:#f7f8fa; color:#374151; border-radius:16px; padding:.28rem .7rem; font-size:.76rem; font-family:inherit; cursor:pointer; white-space:nowrap; }
.f-chip.recent { background:#fff; color:var(--brand); border-color:#cfe0ee; }

.f-sec { padding:1rem 1.1rem .2rem; }
.f-sec-title { display:flex; justify-content:space-between; align-items:baseline; font-size:.86rem; font-weight:800; margin-bottom:.55rem; }
.f-sec-title span { font-size:.72rem; color:var(--mu); font-weight:600; }
.f-hint { font-size:.74rem; color:var(--mu); margin:-.3rem 0 .6rem; line-height:1.5; }

/* 단원 카드 */
.f-unit { display:flex; align-items:center; gap:.7rem; border:1.5px solid var(--bd); border-radius:12px; padding:.7rem .8rem; margin-bottom:.45rem; cursor:pointer; background:#fff; }
.f-unit.top { border-color:var(--brand-2); background:rgba(28,108,168,.04); }
.f-pg { flex:0 0 auto; min-width:64px; text-align:center; background:var(--brand-1); color:#fff; border-radius:9px; padding:.38rem .4rem; line-height:1.1; }
.f-pg b { display:block; font-size:1.05rem; font-weight:800; font-variant-numeric:tabular-nums; }
.f-pg small { font-size:.62rem; opacity:.85; }
.f-ub { flex:1; min-width:0; }
.f-part { font-size:.66rem; color:var(--mu); font-weight:700; }
.f-ut { font-size:.92rem; font-weight:700; margin-top:.1rem; line-height:1.3; }
.f-arrow { color:#b0b6bd; font-size:.9rem; transition:transform .2s; }
.f-unit.open .f-arrow { transform:rotate(90deg); }
.f-pages { margin:-.25rem 0 .55rem .6rem; border-left:2px solid #dbe7f1; padding-left:.65rem; display:none; }
.f-pages.open { display:block; }
.f-pline { display:flex; gap:.5rem; font-size:.8rem; padding:.28rem 0; color:#374151; }
.f-pline b { flex:0 0 42px; color:var(--brand); font-variant-numeric:tabular-nums; }

/* 본문 결과 */
.f-hit { border:1px solid var(--bd); border-radius:12px; padding:.6rem .75rem; margin-bottom:.45rem; }
.f-hit-top { display:flex; align-items:center; gap:.5rem; margin-bottom:.35rem; }
.f-hit-pg { flex:0 0 auto; background:var(--brand-1); color:#fff; font-weight:800; font-size:.82rem; border-radius:7px; padding:.18rem .5rem; font-variant-numeric:tabular-nums; }
.f-hit-u { font-size:.76rem; color:#4b5563; font-weight:600; min-width:0; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
input[type=search]::-webkit-search-cancel-button { display:none; }
.f-hit-n { margin-left:auto; flex:0 0 auto; font-size:.68rem; color:var(--mu); }
.f-snip { font-size:.82rem; color:#2a2a28; line-height:1.5; padding:.12rem 0; border-top:1px dashed #eef0f2; word-break:keep-all; overflow-wrap:anywhere; }
.f-snip:first-of-type { border-top:none; }
mark { background:var(--hl); color:inherit; border-radius:3px; padding:0 1px; }
.f-more { display:block; width:100%; border:1px solid var(--bd); background:#f7f8fa; border-radius:10px; padding:.6rem; font-size:.8rem; font-family:inherit; color:#374151; cursor:pointer; margin:.2rem 0 .6rem; }
.f-empty { text-align:center; color:#97948E; font-size:.85rem; padding:2.2rem .5rem; line-height:1.7; }

/* 목차 */
.f-partbox { border:1px solid var(--bd); border-radius:12px; margin-bottom:.5rem; overflow:hidden; }
.f-partbox summary { list-style:none; cursor:pointer; padding:.7rem .85rem; display:flex; align-items:center; gap:.5rem; font-weight:800; font-size:.88rem; background:#f7f8fa; }
.f-partbox summary::-webkit-details-marker { display:none; }
.f-partbox summary .n { color:var(--brand-2); font-size:.72rem; }
.f-partbox summary .c { margin-left:auto; color:var(--mu); font-size:.72rem; font-weight:600; }
.f-partbox[open] summary { border-bottom:1px solid var(--bd); }
.f-toc { padding:.35rem .5rem .5rem; }
.f-toc .f-unit { border:none; border-bottom:1px solid #f1f2f4; border-radius:0; margin:0; padding:.55rem .35rem; }
.f-toc .f-unit:last-child { border-bottom:none; }
.f-toc .f-pg { min-width:54px; padding:.28rem .3rem; }
.f-toc .f-pg b { font-size:.9rem; }
.f-toc .f-ut { font-size:.86rem; margin:0; }

.f-note { margin:.8rem 1.1rem 0; font-size:.76rem; color:#8a5a00; background:#fff7e6; border:1px solid #f5d9a8; border-radius:8px; padding:.45rem .6rem; }
.f-minor { border:1px solid var(--bd); border-radius:12px; padding:.2rem .7rem; margin-bottom:.45rem; }
.f-mrow { display:flex; gap:.6rem; padding:.5rem 0; border-top:1px solid #f1f2f4; }
.f-mrow:first-child { border-top:none; }
.f-mpg { flex:0 0 46px; font-weight:800; color:var(--brand); font-size:.84rem; font-variant-numeric:tabular-nums; padding-top:.05rem; }
.f-mtx { flex:1; min-width:0; }
.f-mu { display:block; font-size:.7rem; color:var(--mu); font-weight:600; }
.f-msnip { font-size:.8rem; color:#2a2a28; line-height:1.45; overflow-wrap:anywhere; }
.f-qhead { margin:.85rem 1.1rem 0; font-size:.78rem; color:#4b5563; font-weight:700; display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; }
.f-qterm { background:#e8f1f8; color:var(--brand-1); border-radius:6px; padding:.15rem .5rem; font-weight:800; }
.f-qkind { background:#fff1d6; color:#8a5a00; border-radius:6px; padding:.15rem .5rem; }
.f-best { border:2px solid var(--brand-2); background:rgba(28,108,168,.04); }
.f-qrow { cursor:pointer; align-items:center; }
.f-qt { flex:0 0 auto; max-width:45%; font-weight:800; color:var(--brand-1); font-size:.84rem; }
.f-qrow .f-mtx { font-size:.82rem; color:#374151; }
.f-qrow .f-mtx b { color:var(--brand); }
.f-footer { padding:1.4rem 1.1rem 2.4rem; text-align:center; font-size:.66rem; color:#b9b6b0; line-height:1.6; }
</style>
</head>
<body>

<div class="f-header">
  <button class="f-back" id="f-back" onclick="history.back()">← 내 숙제로</button>
  <div class="f-title">📚 Sentence Build up 찾기</div>
  <div class="f-sub">궁금한 문법을 검색하면 교재 몇 쪽에 있는지 알려줘요</div>
</div>

<div class="f-search">
  <div class="f-box">
    <span>🔎</span>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="예: 관계대명사, so that과 so~that 차이">
    <button class="f-clear" id="f-clear" aria-label="지우기">✕</button>
  </div>
  <div class="f-chips" id="f-chips"></div>
</div>

<div id="f-out"></div>

<div class="f-footer">THE FIRST · 책에 적힌 쪽번호 기준<br><span id="f-ver"></span></div>

eacher. → She = a teacher (O) 주격보어","She likes apples. → She = apples (✕) 목적어","다시 남아 있는 부분의 의미를 자른다","STEP","따라 해 보기","STEP 1","동사 →","★ 판단법 : 목적어 = 남은 말 이 말이 되면 목적","→ 간접목적어 직접목적어 형식","② 자른 부분이 목적어와 같으면 → 목적어 목적보어 형식","③ (전치사 + 명사)","→ 부사구","→ ① ② ③ 중에서 의미에 따라 하나를 고른다","① 자른 부분이 목적어와 다르면","They call him Tom. → him = Tom (O) 5형식","He gave me a book. → me = a book (✕) 4형식","They call him Tom (at school).","STEP 2","call","보어 형식 , 말이 안 되면 직접목적어 형식","주어 →","They","STEP 4","him ≠ They →","Tom = him →","그들은 (학교에서) 그를 Tom이","목적보어","라고 부른다.","목적어","(at school) → 부사구","∴ 형식","STEP 3"]},{"p":19,"h":"1형식 예문","l":["1형식 예문","1형식을 쓰세요","1 I am at the meeting.","나는 회의에 참석해 있다.","2 I am on my way home.","나는 집에 가는 도중이다.","3 I am on the third floor.","나는 3층에 있다.","4 I am with you.","나는 너와 함께 있다.","5 I am near the school.","나는 학교 근처에 있다.","6 She is in the kitchen.","그녀는 부엌에 있다.","7 The cat is under the table.","고양이는 탁자 아래에 있다.","8 My house is next to the bank.","우리 집은 은행 옆에 있다.","9 I am ahead of you.","나는 네 앞에 있다.","10 I am next to you.","나는 네 옆에 있다.","11 I am in front of the house.","나는 그 집 앞에 있다.","12 I am behind you.","나는 너의 뒤에 있다.","13 The bank is near there.","그 은행은 그 근처에 있다.","14 The classroom is not far away from here.","그 교실은 여기서 멀지 않다.","15 The keys are on the desk.","열쇠는 책상 위에 있다."]},{"p":20,"h":"2형식 예문","l":["2형식 예문","2형식을 쓰세요","1 This is my car.","이것은 내 자동차다.","2 He got married.","그는 결혼했다.","3 She turned red.","그녀는 얼굴을 붉혔다.","4 They are friends.","그들은 친구들이다.","5 Sugar tastes sweet.","설탕은 달콤한 맛이 난다.","6 The baby fell asleep.","그 아기는 잠들었다.","7 This paper feels smooth.","이 종이는 부드러운 느낌이 난다.","8 You look nice.","너는 멋져 보인다.","9 That sounds interesting.","그것은 흥미롭게 들린다.","10 It smells good.","그것은 좋은 냄새가 난다.","11 She became a teacher.","그녀는 선생님이 되었다.","12 My favorite time of the day is lunch time.","내가 하루 중 가장 좋아하는 시간은 점심시간이다.","13 The book is useful.","그 책은 유용하다.","14 She is a judge.","그녀는 판사다.","15 The weather has turned colder.","날씨가 더 추워졌다."]},{"p":21,"h":"3형식 예문","l":["3형식 예문","3형식을 쓰세요","1 I respect him.","나는 그를 존경한다.","2 She missed the plane.","그녀는 비행기를 놓쳤다.","3 I lost my bag.","나는 내 가방을 잃어버렸다.","4 He answered the phone fast.","그는 빠르게 전화를 받았다.","5 I have two brothers.","나는 남자 형제가 두 명 있다.","6 My father stopped smoking.","나의 아빠는 담배 피우는 것을 멈췄다.","7 I ate junk food.","나는 정크푸드(불량 식품)를 먹었다.","8 The chef served the dish.","요리사는 요리를 제공했다.","9 He always changes his plans.","그는 항상 그의 계획들을 바꾼다.","10 We stopped cleaning our room.","우리는 우리 방을 청소하는 것을 멈췄다.","11 A new discovery surprised many people.","새로운 발견은 많은 사람들을 놀라게 했다.","12 He hit his brother last night.","그는 어젯밤 그의 남동생을 때렸다.","13 Her mother always bakes cookies.","그녀의 엄마는 항상 쿠키를 굽는다.","14 He usually hesitates to speak his mind.","그는 대개 자기 생각을 말하는 것을 주저한다.","15 She refused to see any friends.","그녀는 어떤 친구도 만나려 하지 않았다."]},{"p":22,"h":"4형식 예문","l":["4형식 예문","4형식을 쓰세요","1 He bought his girlfriend beautiful roses.","그는 그의 여자 친구에게 아름다운 장미를 사 주었다.","2 She brought me a camera.","그녀는 나에게 카메라를 가져다주었다.","3 Our teacher taught us an English song.","우리 선생님은 우리에게 영어 노래를 가르쳐 주셨다.","4 My mother will buy me a red sweater.","우리 엄마는 나에게 빨간 스웨터를 사 줄 것이다.","5 I will make my baby a beautiful dress.","나는 내 아기에게 예쁜 드레스를 만들어 줄 것이다.","6 He buys me coffee all the time.","그는 나에게 항상 커피를 사준다.","7 Our mom reads us a funny story every night.","우리 엄마는 매일 밤 우리에게 재미있는 이야기를 읽","어 주신다.","8 I showed them my picture.","나는 그들에게 나의 사진을 보여 줬다.","9 The student told his teacher the truth.","그 학생은 그의 선생님에게 진실을 말했다.","10 The company offered me a job.","그 회사는 나에게 일자리를 제공했다.","11 He tells me every secret.","그는 나에게 모든 비밀을 말한다.","12 He always gives me advice.","그는 항상 나에게 조언을 해준다.","13 She lent me her umbrella.","그녀는 나에게 그녀의 우산을 빌려주었다.","14 He buys his son everything.","그는 그의 아들에게 모든 것을 사준다.","15 She sent me a present.","그녀는 나에게 선물을 보냈다."]},{"p":23,"h":"5형식 예문","l":["5형식 예문","5형식을 쓰세요","1 He makes his son read books every night.","그는 그의 아들에게 매일 밤 책을 읽게 한다.","2 The wind made his hat blow away.","바람이 그의 모자를 날아가게 했다.","3 I heard someone slam the door.","나는 누군가가 문을 쾅 닫는 소리를 들었다.","4 She had me do everything for her.","그녀는 내가 그녀를 위해 모든 것을 하게 했다.","5 Mom doesn't let me oversleep.","엄마는 내가 늦잠 자는 것을 허락하지 않으신다.","6 The movie was very sad. It made me cry.","그 영화는 매우 슬펐다. 그건 나를 울게 했다.","7 I consider her honest.","나는 그녀가 정직하다고 생각한다.","8 Glasses make him look older.","안경이 그를 나이 들어 보이게 한다.","9 You can't make me do anything.","너는 내가 무엇이든 하게 강요할 수는 없다.","10 I saw her study in the library.","나는 그녀가 도서관에서 공부하는 것을 보았다.","11 Mom doesn't let me have snacks very often.","엄마는 내가 간식을 자주 먹게 하지 않으신다.","12 Many people helped me finish this report.","많은 사람들이 내가 이 보고서를 끝내도록 도와주었","다.","13 Ann got her husband to take pictures of her.","Ann은 그녀의 남편이 그녀의 사진을 찍게 했다.","14 I saw him walking across the bridge.","나는 그가 다리를 건너고 있는 것을 보았다.","15 I felt the car warm.","나는 그 차가 따뜻하다고 느꼈다."]},{"p":24,"h":"4형식 ↔ 3형식 4형식 ↔ 3형식으로 바꿔도 의미는 변하지 않아요","l":["4형식 ↔ 3형식 4형식 ↔ 3형식으로 바꿔도 의미는 변하지 않아요","4 형식","주어","서술어","간접목적어","서술어","직접목적어","3 형식","주어","He gave me a book.","간접목적어를 뒤로","+ 전치사","to","for","of","간접목적어","전치사 + 간접목적어","He gave a book to me.","▼ 서술어 동사 의 종류에 따라 쓰이는 전치사가 정해진다","give, show, teach, send, bring, write, read,","pass, tell, lend, o er","to","buy, cook, get, nd, make, do, build","for","ask","of","주의 직접목적어가","it / them","에게 전달","She sent me a letter. → She sent a letter to me.","를 위해 대신 해 줌","He bought me a cake. → He bought a cake for me.","에게 묻다","He asked me a question. → He asked a question of me.","같은 대명사면 3형식으로만 쓴다. He gave it to me. (O) / He gave me it. (✕)","4형식은 3형식으로, 3형식은 4형식으로 바꾸세요","1 I showed customers many goods.","2 My boyfriend brings me a bouquet of flowers.","3 I brought my son a laptop.","4 I gave some chocolate to him.","5 I will tell the story to you.","fi","ff","6 I teach English to you.","7 I will send an e-mail to you.","8 Mom cooked us a delicious dinner.","9 He made a paper airplane for his brother.","10 May I ask you a favor?"]},{"p":25,"h":"명사 사람, 사물, 장소 등의 이름","l":["명사 사람, 사물, 장소 등의 이름","셀 수 있는 명사","셀 수 없는 명사" uth is that he lied to us.","⑦ 동격 (생략 ✕)","The news that the team won the game surprised everyone.","감정의 원인","사실은 그가 우리에게 거짓말을 했다는 것이다.","그 팀이 경기에서 이겼다는 소식은 모두를 놀라게 했다.","I'm glad that you came.","네가 와서 기쁘다. (glad · sorry · surprised + that)","C. 관계사 that 앞에 명사(선행사)가 있다","⑧ 관계대명사 (뒤 불완전)","⑨ 관계부사 대신 (뒤 완전)","The girl that sits next to me is friendly. / This is the camera that I bought ___ last week.","내 옆에 앉은 소녀는 친절하다. / 이것은 내가 지난주에 산 카메라이다.","I still remember the day that we first met. (= when)","나는 우리가 처음 만났던 그날을 여전히 기억한다.","D. 강조 구문의 that It is[was] + 강조할 말 + that ~","It ~ that 강조","It was Tom that broke the window yesterday.","어제 창문을 깬 사람은 바로 Tom이었다. → 자세히 118쪽","that이 붙어 만든 접속사 : so that (~하기 위해) · now that (~이니까) · in that (~라는 점에서) → 103쪽","주의 자주 하는 실수","This is the house in that I live. → … the house that I live in / in","which I live","전치사 + that ✕","The truth is he lied. → The truth is that he lied.","보어 that은 보통 생략 ✕","This is true that he won. → It is true that he won.","I'm glad what you came. → I'm glad that you came.","가주어는 It만","감정의 원인 → that"]},{"p":117,"h":"that 구별하기 · that의 생략 완전한가? 앞에 명사가 있나?","l":["that 구별하기 · that의 생략 완전한가? 앞에 명사가 있나?","1 여러 가지 의미의 that 한눈에 보기","해석","역할","대명사 that","접속사 that","동격 that","관계대명사 that","관계부사 대신 that","그것","~하는 것","~라는","~하는","반복되는 말 대신","주어 · 목적어 · 보어","앞 명사의 내용","선행사 수식","선행사 수식 (때·장소·이유·","방법)","완전","불완전","완전","뒤 문장","앞 명사","대명사","접속사","동격","관계대명사","관계부사 대신","Gina has long fingers. That is a big advantage for a pianist.","그것은 피아니스트에게 큰 이점이다. (That = Gina","has long fingers)","〈That the earth's climate is changing〉 is a scientific fact.","지구의 기후가 변하고 있다는 것은 과학적 사실이다.","The fact 〈that my best friend was crying〉 made me feel terrible.","내 가장 친한 친구가 울고 있었다는 사실에 나는 가슴","이 아팠다.","The pyramids 〈that the ancient Egyptians built〉 are still standing.","고대 이집트인들이 지은 피라미드는 지금도 서 있다.","Could you recommend somewhere 〈that I can print books〉?","책을 인쇄할 수 있는 곳을 추천해 줄래요?","2 that 구별 순서도","that","뒤가 완전한 문장인가","→ 관계대명사","앞에 명사가 있는가" <script>
'use strict';
// ★ 새 버전을 올릴 때 이 값을 함께 올린다 — 화면 맨 아래에 표시된다
const APP_VERSION = 'find-v3';
document.getElementById('f-ver').textContent = APP_VERSION;

const DATA  = JSON.parse(document.getElementById('FIND_DATA').textContent);
const UNITS = DATA.units;
const PAGES = DATA.pages;
const POPULAR = ['관계대명사','현재완료','to부정사','수동태','가정법','분사구문','비교급','불규칙동사','조동사','전치사'];
const RECENT_KEY = 'thefirst.find.recent';

// 학생 숙제 화면에서 넘어온 경우에만 "← 내 숙제로" 버튼을 보여준다
try { if (/student\.html/.test(document.referrer) && history.length > 1) document.getElementById('f-back').classList.add('show'); } catch (e) {}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 비교용 정규화 — 띄어쓰기·가운뎃점·괄호·마침표 등을 무시한다 (have p.p. = havepp, 관계 대명사 = 관계대명사)
const NZ_RE = /[\s·・\.,\/\(\)\[\]~\-–—:;'"‘’“”`!?<>「」『』]/g;
function nz(s) { return String(s).toLowerCase().replace(NZ_RE, ''); }

// 미리 정규화해 둔다
UNITS.forEach(u => {
  u.label = (u.no != null ? u.no + '. ' : '') + u.t;
  u.nzT = nz(u.t);
  u.nzA = nz(u.a + ' ' + u.pn);
});
PAGES.forEach(p => {
  p.nzL = p.l.map(nz);
  p.nzAll = p.nzL.join('');
  p.nzH = nz(p.h);
  p.unit = UNITS.find(u => p.p >= u.s && p.p <= u.e) || null;
});

function pgRange(u) { return u.s === u.e ? `${u.s}` : `${u.s}~${u.e}`; }

// 강조 표시 — re에 맞는 부분을 형광펜으로 칠한다
function hl(text, re) {
  if (!re) return esc(text);
  let out = '', last = 0;
  String(text).replace(re, (m, ...args) => { const idx = args[args.length - 2]; out += esc(text.slice(last, idx)) + '<mark>' + esc(m) + '</mark>'; last = idx + m.length; return m; });
  return out + esc(text.slice(last));
}

// ── 단원 카드 ──
function unitCard(u, open, re, top) {
  const pages = PAGES.filter(p => p.p >= u.s && p.p <= u.e);
  return `<div class="f-unit${top ? ' top' : ''}${open ? ' open' : ''}" data-u="${UNITS.indexOf(u)}">
      <div class="f-pg"><b>${pgRange(u)}</b><small>쪽</small></div>
      <div class="f-ub"><div class="f-part">${esc(u.part)} · ${esc(u.pn)}</div><div class="f-ut">${hl(u.label, re)}</div></div>
      <span class="f-arrow">›</span>
    </div>
    <div class="f-pages${open ? ' open' : ''}">${pages.map(p =>
      `<div class="f-pline"><b>${p.p}쪽</b><span>${esc(p.h || u.t)}</span></div>`).join('')}</div>`;
}

// ── 검색 ──
// 검색어를 "구절 정규식"으로 만든다.
//  - 글자 사이에 띄어쓰기·점·가운뎃점이 있어도 찾는다 (have pp = have p.p., 관계대명사 = 관계 대명사)
//  - 영어 낱말은 낱말 경계를 지킨다 (so that 이 also that / now that 에 걸리지 않게)
const SEP = '[\\s·.\\-~/()]*';
function charsRe(t) { return [...t].map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join(SEP); }
function phraseRe(tokens) {
  if (!tokens.length) return null;
  let body = tokens.map(charsRe).join(SEP);
  if (/^[a-z]/.test(tokens[0])) body = '(?<![a-z])' + body;
  if (/[a-z]$/.test(tokens[tokens.length - 1])) body += '(?![a-z])';
  try { return new RegExp(body, 'gi'); } catch (e) { return null; }
}
function countIn(re, s) { re.lastIndex = 0; const m = s.match(re); return m ? m.length : 0; }
function testIn(re, s) { re.lastIndex = 0; return re.test(s); }

// ── 질문형 검색 ──
// "so that과 so~that의 차이가 뭐야?" 같은 문장에서 문법 용어만 골라내서,
// 그 용어들이 함께 나오는(= 같이 설명한) 쪽을 먼저 보여준다. AI 없이 교재 글자만으로 찾는다.
const ALLTEXT = PAGES.map(p => p.l.join(' ')).join('\n') + '\n' + UNITS.map(u => u.t + ' ' + u.a).join('\n');
// 질문할 때 붙는 말 — 지운다 (긴 것부터)
const FILLERS = ['무엇인가요','무엇인지','뭐가 달라요','뭐가 달라','어떻게 달라요','어떻게 달라','어떻게 써요','어떻게 쓰나요','어떻게 쓰는지',
  '알려 주세요','알려주세요','알려 줘','알려줘','가르쳐 주세요','가르쳐주세요','가르쳐줘','설명해 주세요','설명해주세요','설명해 줘','설명해줘',
  '어디에 있어요','어디에 있어','어디 있어요','어디 있어','어디에 나와요','어디 나와요','어디에','어디',
  '몇 페이지','몇페이지','몇 쪽','몇쪽','궁금해요','궁금해','뭐예요','뭐에요','뭔가요','뭐야','뭐지','무엇','뭐',
  '차이점','차이','구별법','구별','구분법','구분','비교','다른 점','다른점','달라요','달라','다른가요','같은가요',
  '뜻','의미','쓰임','쓰는 법','쓰는법','만드는 법','만드는법','해석','인가요','이에요','예요','입니다','할까요','하나요','해요','주세요','요'];
const CMP_RE = /차이|구별|구분|비교|다른\s*점|달라|다른가|같은가|\bvs\b|versus|↔/i;
const STOPS = new Set(['그','이','것','거','문법','영어','문장','단어','예문','책','교재','선생님','쌤','좀','더','잘','왜','언제','어떻게','그리고','및','랑','과','와','하고','vs','versus','the','a','an']);
const PARTICLES = ['이랑','에서','으로','하고','과','와','랑','의','은','는','이','가','을','를','에','로','도','만'];

function wordsRe(term) {
  // 영어 낱말 구절: 낱말 사이는 띄어쓰기만 (so that ≠ so ~ that)
  return term.trim().split(/\s+/).map(w => charsRe(nz(w))).join('\\s+');
}
function termRe(term, loose) {
  let body;
  if (/[~…∼]/.test(term)) {
    body = term.split(/\s*[~…∼]+\s*/).filter(Boolean).map(w => wordsRe(w)).join('\\s*[~…∼]+\\s*');
  } else if (!loose && /^[a-z][a-z\s'.]*$/i.test(term.trim())) {
    body = wordsRe(term);
  } else {
    const r = phraseRe(term.trim().split(/\s+/).map(nz).filter(Boolean));
    return r;
  }
  const t = term.trim().toLowerCase();
  if (/^[a-z]/.test(t)) body = '(?<![a-z])' + body;
  if (/[a-z.]$/.test(t)) body += '(?![a-z])';
  try { return new RegExp(body, 'gi'); } catch (e) { return null; }
}
function inBook(re) { return !!re && testIn(re, ALLTEXT); }
function stripParticle(w) {
  for (const p of PARTICLES) {
    if (w.length > p.length && w.endsWith(p)) {
      const rest = w.slice(0, -p.length);
      if ([...nz(rest)].length >= 2 && inBook(termRe(rest, true))) return rest;
    }
  }
  return w;
}
function parseQuestion(raw) {
  let s = ' ' + raw.replace(/[?？!！"“”'‘’]/g, ' ') + ' ';
  const compare = CMP_RE.test(s);
  FILLERS.forEach(f => { s = s.split(f).join(' '); });
  s = s.replace(/\s(vs\.?|versus)\s/gi, ' ').replace(/[,/]/g, ' ');
  const words = s.split(/\s+/).filter(Boolean);
  const terms = [];
  for (let i = 0; i < words.length;) {
    let taken = 0;
    for (let n = Math.min(4, words.length - i); n >= 1; n--) {
      let ph = words.slice(i, i + n).join(' ');
      const st = stripParticle(ph);
      for (const cand of (st !== ph ? [st, ph] : [ph])) {
        const key = nz(cand);
        if (!key || STOPS.has(cand.toLowerCase()) || STOPS.has(key)) continue;
        if (n === 1 && [...key].length < 2 && !/^[a-z]+$/i.test(key)) continue;
        const strict = termRe(cand, false), loose = termRe(cand, true);
        const re = inBook(strict) ? strict : (inBook(loose) ? loose : null);
        if (re) { terms.push({ text: cand.trim(), re }); taken = n; break; }
      }
      if (taken) break;
    }
    i += taken || 1;
  }
  // 같은 말이 두 번 나오면 하나만
  const seen = new Set();
  const uniq = terms.filter(t => { const k = t.text.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  return { terms: uniq, compare, changed: nz(raw) !== nz(uniq.map(t => t.text).join(' ')) };
}

function renderQuestion(qx, raw) {
  const terms = qx.terms;
  let hre = null;
  try { hre = new RegExp(terms.map(t => '(?:' + t.re.source + ')').concat(qx.compare ? ['차이|구별|구분|비교'] : []).join('|'), 'gi'); } catch (e) {}
  const scored = [];
  PAGES.forEach(p => {
    const joined = p.l.join(' ');
    const counts = terms.map(t => countIn(t.re, joined));
    if (!counts.some(Boolean)) return;
    const all = counts.every(Boolean);
    const both = [], some = [];
    p.l.forEach((l, i) => {
      const k = terms.filter(t => testIn(t.re, l)).length;
      if (!k) return;
      if (k >= 2 || (qx.compare && CMP_RE.test(l))) both.push(i); else some.push(i);
    });
    const head = terms.some(t => p.h && testIn(t.re, p.h)) ? 1 : 0;
    scored.push({ p, all, both, some, counts,
      score: (all ? 1000 : 0) + both.length * 60 + head * 40 + counts.reduce((a, c) => a + Math.min(c, 6), 0) });
  });
  scored.sort((a, b) => b.score - a.score || a.p.p - b.p.p);
  const together = scored.filter(s => s.all);

  const chips = terms.map(t => `<span class="f-qterm">${esc(t.text)}</span>`).join('');
  let html = `<div class="f-qhead">질문에서 찾은 말 ${chips}${qx.compare ? '<span class="f-qkind">차이·비교</span>' : ''}</div>`;

  const card = (s, top) => {
    const u = s.p.unit;
    // 제목 줄은 빼고, 용어만 달랑 있는 짧은 줄보다 설명·예문이 있는 줄을 먼저
    const rich = i => s.p.l[i] !== s.p.h && terms.every(t => nz(s.p.l[i]) !== nz(t.text));
    const order = [...s.both.filter(rich), ...s.some.filter(rich)];
    const pick = (order.length ? order : [...s.both, ...s.some]).slice(0, top ? 3 : 2);
    return `<div class="f-hit${top ? ' f-best' : ''}">
      <div class="f-hit-top"><span class="f-hit-pg">${s.p.p}쪽</span>
        <span class="f-hit-u">${u ? esc(u.label) : ''}${s.p.h && u && s.p.h !== u.t ? ' · ' + hl(s.p.h, hre) : ''}</span></div>
      ${pick.map(i => `<div class="f-snip">${hl(s.p.l[i], hre)}</div>`).join('')}</div>`;
  };

  if (together.length) {
    html += `<div class="f-sec"><div class="f-sec-title">${qx.compare ? '함께 비교해 놓은 쪽' : '함께 나오는 쪽'}<span>${together.length}쪽</span></div>
      <div class="f-hint">${qx.compare ? '두 내용을 같은 쪽에서 설명한 곳이 위에 있어요' : '찾은 말이 모두 나오는 쪽이에요'}</div>
      ${together.slice(0, 4).map((s, i) => card(s, i === 0)).join('')}</div>`;
  } else {
    html += `<div class="f-note">찾은 말이 한 쪽에 함께 나오지는 않아요. 아래에서 따로 찾아보세요</div>`;
  }

  // 낱말마다 따로 — 주로 다루는 쪽 몇 개
  html += `<div class="f-sec"><div class="f-sec-title">따로 찾아보기</div><div class="f-minor">${terms.map(t => {
    const pages = PAGES.map(p => {
      const n = countIn(t.re, p.l.join(' '));
      const head = p.h && testIn(t.re, p.h) ? 1 : 0;
      return { p, n, s: head * 100 + n };
    }).filter(x => x.n).sort((a, b) => b.s - a.s || a.p.p - b.p.p).slice(0, 5);
    return `<div class="f-mrow f-qrow" data-q="${esc(t.text)}"><span class="f-qt">${esc(t.text)}</span>
      <span class="f-mtx">${pages.map(x => `<b>${x.p.p}</b>`).join(' · ')}쪽</span><span class="f-arrow">›</span></div>`;
  }).join('')}</div><div class="f-hint" style="margin-top:.3rem">줄을 누르면 그 말만 자세히 찾아줘요</div></div>`;
  return html;
}

let minorLimit = 12;
function search(q, opts = {}) {
  const raw = q.trim();
  const out = document.getElementById('f-out');
  document.getElementById('f-clear').classList.toggle('show', !!raw);
  if (!raw) { renderToc(); return; }

  const tokens = raw.split(/\s+/).map(nz).filter(Boolean);
  const full = nz(raw);
  if (!full) { renderToc(); return; }

  // 쪽번호로 찾기 — "108쪽", "p108", "p.108", "108페이지"
  const pm = raw.match(/^(?:p\.?\s*(\d{1,3})|(\d{1,3})\s*(?:쪽|p|페이지|page))$/i);
  // 단원 번호로 찾기 — "72", "72번", "72단원"
  const um = raw.match(/^(\d{1,3})\s*(번|단원)?$/);

  let html = '';
  if (pm) {
    const n = Number(pm[1] || pm[2]);
    const pg = PAGES.find(p => p.p === n);
    out.innerHTML = (pg && pg.unit)
      ? `<div class="f-sec"><div class="f-sec-title">${n}쪽은 이 단원이에요</div>${unitCard(pg.unit, true, null, true)}</div>`
      : `<div class="f-empty">${n}쪽은 없어요<br>책은 3쪽부터 145쪽까지예요</div>`;
    return;
  }
  if (um) {
    const n = Number(um[1]);
    const byNo = UNITS.find(u => u.no === n);
    const pg = PAGES.find(p => p.p === n);
    if (byNo) html += `<div class="f-sec"><div class="f-sec-title">${n}번 단원</div>${unitCard(byNo, false, null, true)}</div>`;
    if (pg && pg.unit && um[2] !== '번' && um[2] !== '단원') html += `<div class="f-sec"><div class="f-sec-title">${n}쪽이 들어 있는 단원</div>${unitCard(pg.unit, false, null, false)}</div>`;
    out.innerHTML = html || `<div class="f-empty">${n}번 단원이나 ${n}쪽은 없어요<br>단원은 1~81번, 책은 3~145쪽이에요</div>`;
    return;
  }

  // 질문 문장이면 — 용어만 골라서 찾는다
  if (!opts.plain) {
    const qx = parseQuestion(raw);
    if (qx.terms.length >= 2) { out.innerHTML = renderQuestion(qx, raw); return; }
    if (qx.terms.length === 1 && qx.changed) { search(qx.terms[0].text, { plain: true, note: `‘${qx.terms[0].text}’(으)로 찾았어요` }); return; }
  }

  // 1) 단원 — 제목·별칭에서 찾기
  // (별칭을 이어 붙인 글자에서 찾으면 who+which → "how"처럼 엉뚱하게 걸려서, 낱말 경계를 지키는 정규식으로 찾는다)
  const ure = phraseRe(tokens);
  const unitHits = [];
  UNITS.forEach(u => {
    let s = 0;
    if (u.nzT === full) s = 4;
    else if (ure && testIn(ure, u.t)) s = 3;
    else if (ure && testIn(ure, u.a + ' ' + u.pn)) s = 2;
    if (s) unitHits.push({ u, s });
  });
  unitHits.sort((a, b) => b.s - a.s || a.u.s - b.u.s);

  // 2) 본문 — 먼저 "구절 그대로" 찾고, 없을 때만 낱말을 나눠서 찾는다
  let re = phraseRe(tokens);
  let split = false;
  let bodyHits = collect(re, null);
  if (!bodyHits.length && tokens.length > 1) {
    split = true;
    const res = tokens.map(t => phraseRe([t]));
    bodyHits = collect(res[0], res.slice(1));
    re = hlAny(tokens);
  }

  function collect(main, extra) {
    if (!main) return [];
    const hits = [];
    PAGES.forEach(p => {
      const joined = p.l.join(' ');
      if (!testIn(main, joined)) return;
      if (extra && !extra.every(r => testIn(r, joined))) return;
      const idx = [];
      p.l.forEach((l, i) => { if (testIn(main, l) || (extra && extra.some(r => testIn(r, l)))) idx.push(i); });
      const n = countIn(main, joined);
      const head = p.h && testIn(main, p.h) ? 1 : 0;
      const inUnit = p.unit && unitHits.some(h => h.u === p.unit) ? 1 : 0;
      hits.push({ p, idx, n, head, main: head || inUnit || n >= 3, score: head * 1000 + inUnit * 100 + n });
    });
    hits.sort((a, b) => b.score - a.score || a.p.p - b.p.p);
    return hits;
  }

  // 미리보기 문장 고르기 — 검색어만 달랑 있는 짧은 줄보다 설명·예문이 있는 줄을 먼저
  function snipsOf(h, k) {
    const lines = h.idx.map(i => h.p.l[i]).filter(l => l !== h.p.h);
    const rich = lines.filter(l => nz(l).length > full.length + 4);
    const pick = (rich.length ? rich : lines).slice(0, k);
    return pick.map(l => `<div class="f-snip">${hl(l, re)}</div>`).join('');
  }
  const pageTitle = h => {
    const u = h.p.unit;
    return (u ? esc(u.label) : '') + (h.p.h && u && h.p.h !== u.t ? ' · ' + hl(h.p.h, re) : '');
  };

  // 단원 카드 — 본문 주요 쪽과 같은 단원이면 중복이라 생략하지 않고 맨 위에 한 번만
  if (unitHits.length) {
    html += `<div class="f-sec"><div class="f-sec-title">단원<span>${unitHits.length}개</span></div>
      ${unitHits.length > 1 ? '<div class="f-hint">단원을 누르면 쪽마다 무슨 내용인지 보여요</div>' : ''}
      ${unitHits.slice(0, 4).map((h, i) => unitCard(h.u, unitHits.length === 1, re, i === 0)).join('')}</div>`;
  }

  const mains = bodyHits.filter(h => h.main);
  const minors = bodyHits.filter(h => !h.main);
  if (split && bodyHits.length) {
    html += `<div class="f-note">‘${esc(raw)}’ 그대로는 없어서, 낱말이 모두 들어 있는 쪽을 보여줘요</div>`;
  }
  if (mains.length) {
    html += `<div class="f-sec"><div class="f-sec-title">${unitHits.length ? '이 내용이 나오는 쪽' : '주로 다루는 쪽'}<span>${mains.length}쪽</span></div>
      ${mains.slice(0, 8).map(h => `<div class="f-hit">
          <div class="f-hit-top"><span class="f-hit-pg">${h.p.p}쪽</span><span class="f-hit-u">${pageTitle(h)}</span></div>
          ${snipsOf(h, 2)}</div>`).join('')}</div>`;
  }
  const restMains = mains.slice(8);
  const minorAll = [...restMains, ...minors];
  if (minorAll.length) {
    const shown = minorAll.slice(0, minorLimit);
    html += `<div class="f-sec"><div class="f-sec-title">${mains.length ? '짧게 나오는 곳' : '나오는 곳'}<span>${minorAll.length}쪽</span></div>
      <div class="f-minor">${shown.map(h => `<div class="f-mrow"><span class="f-mpg">${h.p.p}쪽</span>
        <span class="f-mtx"><span class="f-mu">${h.p.unit ? esc(h.p.unit.label) : ''}</span>${snipsOf(h, 1).replace(/class="f-snip"/, 'class="f-msnip"')}</span></div>`).join('')}</div>
      ${minorAll.length > minorLimit ? `<button class="f-more" id="f-more">${minorAll.length - minorLimit}쪽 더 보기</button>` : ''}</div>`;
  }

  if (!unitHits.length && !bodyHits.length) {
    html = `<div class="f-empty">‘${esc(raw)}’은(는) 교재에서 찾지 못했어요<br>띄어쓰기를 바꾸거나 더 짧게 검색해 보세요</div>`;
  }
  if (opts.note && html.indexOf('f-empty') < 0) html = `<div class="f-note">${esc(opts.note)}</div>` + html;
  out.innerHTML = html;
  const more = document.getElementById('f-more');
  if (more) more.onclick = () => { minorLimit += 30; search(document.getElementById('q').value); };
}
// 낱말을 나눠 찾을 때의 강조 — 각 낱말을 따로 칠한다
function hlAny(tokens) {
  const parts = tokens.map(t => { let b = charsRe(t); if (/^[a-z]/.test(t)) b = '(?<![a-z])' + b; if (/[a-z]$/.test(t)) b += '(?![a-z])'; return b; });
  try { return new RegExp('(?:' + parts.join('|') + ')', 'gi'); } catch (e) { return null; }
}

// ── 검색어가 없을 때: 목차 ──
function renderToc() {
  const parts = [];
  UNITS.forEach(u => { let g = parts.find(x => x.part === u.part); if (!g) parts.push(g = { part: u.part, pn: u.pn, list: [] }); g.list.push(u); });
  document.getElementById('f-out').innerHTML = `<div class="f-sec">
    <div class="f-sec-title">목차<span>책에 적힌 쪽번호</span></div>
    ${parts.map(g => `<details class="f-partbox"><summary><span class="n">${esc(g.part)}</span>${g.part === '부록' ? '' : esc(g.pn)}
      <span class="c">${g.list[0].s}~${g.list[g.list.length - 1].e}쪽</span></summary>
      <div class="f-toc">${g.list.map(u => unitCard(u, false, null, false)).join('')}</div></details>`).join('')}</div>`;
}

// 단원 카드 펼치기/접기
document.getElementById('f-out').addEventListener('click', e => {
  const qrow = e.target.closest('.f-qrow');
  if (qrow) { const i = document.getElementById('q'); i.value = qrow.dataset.q; minorLimit = 12; search(i.value); window.scrollTo({ top: 0 }); return; }
  const card = e.target.closest('.f-unit');
  if (!card) return;
  card.classList.toggle('open');
  const list = card.nextElementSibling;
  if (list && list.classList.contains('f-pages')) list.classList.toggle('open');
});

// ── 최근 검색어 (이 기기에만 저장) ──
function getRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; } }
function addRecent(q) {
  q = q.trim(); if (!q) return;
  const list = [q, ...getRecent().filter(x => x !== q)].slice(0, 5);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
  renderChips();
}
function renderChips() {
  const recent = getRecent();
  const pop = POPULAR.filter(p => !recent.includes(p));
  document.getElementById('f-chips').innerHTML =
    recent.map(r => `<button class="f-chip recent" data-q="${esc(r)}">🕘 ${esc(r)}</button>`).join('') +
    pop.map(p => `<button class="f-chip" data-q="${esc(p)}">${esc(p)}</button>`).join('');
}
document.getElementById('f-chips').addEventListener('click', e => {
  const b = e.target.closest('.f-chip'); if (!b) return;
  const input = document.getElementById('q');
  input.value = b.dataset.q; minorLimit = 12; search(input.value); addRecent(input.value);
  window.scrollTo({ top: 0 });
});

const input = document.getElementById('q');
let timer = null, saveTimer = null;
input.addEventListener('input', () => {
  clearTimeout(timer); clearTimeout(saveTimer);
  timer = setTimeout(() => { minorLimit = 12; search(input.value); }, 150);
  saveTimer = setTimeout(() => addRecent(input.value), 1500); // 1.5초 동안 그대로 두면 최근 검색어로 저장
});
input.addEventListener('keydown', e => { if (e.key === 'Enter') { addRecent(input.value); input.blur(); } });
document.getElementById('f-clear').onclick = () => { input.value = ''; search(''); input.focus(); };

renderChips();
// 주소에 ?q=관계대명사 를 붙이면 바로 그 검색 결과로 열린다
const q0 = new URLSearchParams(location.search).get('q');
if (q0) { input.value = q0; search(q0); } else renderToc();
</script>

<!-- 서비스워커 — 같은 저장소의 sw.js (캐시를 쓰지 않아 항상 최신본이 열린다) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
