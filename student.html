<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a4771">
<title>내 숙제</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css');
:root {
  --brand-1: #0a4771;   /* 로고와 동일한 남색 */
  --brand-2: #1c6ca8;   /* 그라데이션용 밝은 남색 */
  --brand: #0e5588;     /* 텍스트/아이콘용 남색 */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
  background: #f5f5f7;
  color: #1a1a18;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body {
  padding: 0;
  max-width: 560px;
  margin: 0 auto;
  background: #fff;
  min-height: 100vh;
  box-shadow: 0 0 40px rgba(0,0,0,.05);
  position: relative;
  overflow-x: hidden;
}
.s-watermark {
  position: absolute;
  inset: 0;
  background-repeat: no-repeat;
  background-position: center 38%;
  background-size: 135% auto;
  opacity: .055;
  pointer-events: none;
  z-index: 0;
}
#s-content { position: relative; z-index: 1; }

/* ── 헤더 ── */
.s-header {
  background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
  color: #fff;
  padding: 1.5rem 1.1rem 1.3rem;
  position: relative;
}
.s-header-title {
  font-size: .75rem;
  opacity: .82;
  letter-spacing: .05em;
  margin-bottom: .35rem;
}
.s-header-name {
  font-size: 1.55rem;
  font-weight: 800;
  line-height: 1.1;
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}
.s-header-group {
  display: inline-block;
  background: rgba(255,255,255,.22);
  padding: .18rem .55rem;
  border-radius: 14px;
  font-size: .72rem;
  font-weight: 600;
}
.s-header-date {
  font-size: .78rem;
  opacity: .85;
  margin-top: .5rem;
}
.s-streak {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  margin-left: .5rem;
  vertical-align: middle;
  background: rgba(255,255,255,.18);
  padding: .18rem .55rem;
  border-radius: 14px;
  font-size: .74rem;
  font-weight: 700;
}
.s-refresh-btn {
  position: absolute; top: 1rem; right: 1rem;
  background: rgba(255,255,255,.2);
  border: none; color: #fff;
  padding: .35rem .6rem;
  border-radius: 18px;
  font-size: .72rem;
  cursor: pointer;
  font-family: inherit;
}
.s-refresh-btn:active { background: rgba(255,255,255,.35); }
.s-header-mark {
  position: absolute;
  right: 1.1rem;
  bottom: 1.15rem;
  width: 110px;
  height: auto;
  opacity: .95;
  pointer-events: none;
}

/* ── 로딩·에러 ── */
.s-loading, .s-error {
  padding: 4rem 1.5rem;
  text-align: center;
  color: #6b7280;
}
.s-loading-spinner {
  width: 34px; height: 34px;
  border: 3px solid #e5e7eb;
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.s-hw-card, .s-book-card {
  animation: cardIn .4s cubic-bezier(.16,1,.3,1) both;
  animation-delay: calc(var(--i, 0) * .06s);
}
.s-error {
  color: #b83224;
}
.s-error-icon { font-size: 2.5rem; margin-bottom: .7rem; }
.s-error-title { font-size: 1rem; font-weight: 700; margin-bottom: .4rem; color: #1a1a18; }
.s-error-sub { font-size: .8rem; color: #6b7280; line-height: 1.6; }

/* ── 섹션 ── */
.s-section {
  padding: 1.2rem 1.1rem .3rem;
}
.s-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .65rem;
}
.s-section-title-left {
  display: flex; align-items: center; gap: .35rem;
  font-size: .88rem; font-weight: 800;
}
.s-section-count {
  font-size: .72rem;
  color: #6b7280;
  font-weight: 600;
}
.s-section-count.hot { color: #b83224; }
.s-donut {
  position: relative;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
}
.s-donut svg circle { transition: stroke-dashoffset .6s cubic-bezier(.16,1,.3,1); }
.s-donut-pct {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .56rem;
  font-weight: 800;
  color: var(--brand);
}

/* ── 숙제 카드 ── */
.s-hw-list {
  display: flex;
  flex-direction: column;
  gap: .45rem;
}
.s-hw-card {
  background: #fff;
  border: 1.5px solid #e5e7eb;
  border-radius: 10px;
  padding: .7rem .9rem;
  display: flex;
  align-items: center;
  gap: .65rem;
  transition: background .15s;
}
.s-hw-card.today {
  border-color: var(--brand);
  background: rgba(10,71,113,.04);
}
.s-hw-card.overdue {
  border-color: #dc2626;
  background: rgba(220,38,38,.03);
}
.s-hw-card.done {
  background: #f9f9f9;
  border-color: #e5e7eb;
}

/* ── 받은 교재 진행률 카드 ── */
.s-book-list {
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.s-book-card {
  background: #fff;
  border: 1.5px solid #e5e7eb;
  border-radius: 10px;
  padding: .65rem .85rem;
}
.s-book-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  margin-bottom: .5rem;
}
.s-book-top-left {
  display: flex;
  align-items: center;
  gap: .4rem;
  min-width: 0;
  flex: 1 1 auto;
}
.s-book-pct {
  font-size: .82rem;
  font-weight: 800;
  color: #1a1a18;
  flex: 0 0 auto;
}
.s-book-name {
  font-size: .84rem;
  font-weight: 700;
  color: #1a1a18;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.s-book-bar-wrap {
  background: #eef0f2;
  border-radius: 6px;
  height: 7px;
  overflow: hidden;
}
.s-book-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--brand-1), var(--brand-2));
  border-radius: 6px;
  transition: width .2s;
}
.s-book-count {
  font-size: .72rem;
  color: #6b7280;
  margin-top: .3rem;
}
.s-hw-icon {
  flex: 0 0 auto;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.s-hw-body {
  flex: 1 1 auto;
  min-width: 0;
}
.s-hw-title-row {
  display: flex;
  align-items: baseline;
  gap: .4rem;
  min-width: 0;
}
.s-hw-book {
  font-size: .84rem;
  font-weight: 700;
  color: #1a1a18;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 0 1 auto;
}
.s-hw-cat {
  display: inline-block;
  font-size: .62rem;
  font-weight: 700;
  color: #fff;
  padding: .08rem .4rem;
  border-radius: 20px;
  margin-bottom: .25rem;
  letter-spacing: -.1px;
}
.s-hw-detail {
  font-size: .82rem;
  color: #3a3a38;
  line-height: 1.4;
  font-weight: 500;
  letter-spacing: -.1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1 1 auto;
  min-width: 0;
}
.s-hw-meta {
  flex: 0 0 auto;
  font-size: .7rem;
  color: #97948E;
  text-align: right;
  line-height: 1.3;
}
.s-hw-result {
  display: inline-block;
  padding: .18rem .45rem;
  border-radius: 8px;
  font-size: .72rem;
  font-weight: 700;
  font-family: 'Space Mono', monospace;
}
.s-hw-result.pass { background: rgba(5,150,105,.1); color: #065f46; }
.s-hw-result.fail { background: rgba(220,38,38,.08); color: #b83224; }
.s-hw-result.score { background: rgba(10,71,113,.08); color: var(--brand); }

/* ── 빈 상태 ── */
.s-empty {
  text-align: center;
  padding: 1.8rem .5rem;
  color: #97948E;
  font-size: .82rem;
}
.s-empty-icon {
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto .6rem;
  font-size: 1.7rem;
  background: linear-gradient(135deg, rgba(10,71,113,.07), rgba(28,108,168,.1));
  border-radius: 50%;
}

/* ── 푸터 ── */
.s-footer {
  padding: 1.5rem 1.1rem 2.5rem;
  text-align: center;
  font-size: .68rem;
  color: #97948E;
  line-height: 1.6;
}
.s-footer-logo { color: var(--brand); font-weight: 700; }

/* ── 오늘 자동 스크롤 앵커 ── */
#today-anchor { scroll-margin-top: 20px; }
</style>
</head>

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function _toArray(val) {
  if (!val) return [];
  if (Array.isArray(val)) return val.filter(v => v !== null && v !== undefined);
  if (typeof val !== 'object') return [];
  return Object.keys(val).sort((a,b)=>Number(a)-Number(b))
                          .map(k => val[k])
                          .filter(v => v !== null && v !== undefined);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fmtDateKor(ds) {
  if (!ds) return '';
  const [y,m,d] = ds.split('-');
  const dow = new Date(ds).getDay();
  const dowNames = ['일','월','화','수','목','금','토'];
  return `${+m}월 ${+d}일 (${dowNames[dow]})`;
}

function fmtDateShort(ds) {
  if (!ds) return '';
  const [,m,d] = ds.split('-');
  return `${+m}/${+d}`;
}

  '2025-08-15','2025-10-03','2025-10-05','2025-10-06','2025-10-07','2025-10-08','2025-10-09','2025-12-25',
  '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-05','2026-05-24','2026-05-25','2026-06-06',
  '2026-08-15','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09','2026-12-25',
  '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-06-06','2027-06-07',
  '2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25'
]);

/* 방학/휴무/공휴일인지 판정 */
function isNonClassDay(ds, vacations) {
  if (!ds) return false;
  if (HOLIDAYS.has(ds)) return true;
  if (Array.isArray(vacations) && vacations.includes(ds)) return true;
  const d = new Date(ds);
  const dow = d.getDay();
  return dow === 0 || dow === 6; // 일·토
}

/* 레이블 그대로 반환 — 사용자 입력 그대로 보존 */
function prettifyLabel(s) {
  return String(s);
}

/* bookId로 교재 찾기 */
function getBookById(books, bookId) {
  return books.find(b => b && b.id === bookId) || null;
}

/* ★ 선생님용 앱(index.html)과 동일한 원칙: 보카형은 "01"과 "1"처럼 표기가 섞인 같은 회차
   배정이 중복으로 존재할 수 있음 — 회차별로 "가장 최신 날짜" 한 건만 대표로 남김
   (안 그러면 이미 정리된 예전 중복 기록이 학생 화면에 "지난 미완료"로 계속 떠서 헷갈릴 수 있음) */
function dedupeVocaAssigns(assigns, books) {
  const normUnit = v => String(Number(v));
  const latestByKey = new Map();
  const others = [];
  assigns.forEach(a => {
    const book = getBookById(books, a.bookId);
    const isVoca = (book && book.mode) === 'voca' || a.type === 'voca';
    if (!isVoca) { others.push(a); return; }
    // ★ 차수(cohort)까지 키에 포함 — 선생님용 앱과 동일한 원칙
    const key = `${a.bookId}:${normUnit(a.unitFrom)}:${a.cohort||''}`;
    const ex = latestByKey.get(key);
    if (!ex || a.date > ex.date) latestByKey.set(key, a);
  });
  return [...others, ...latestByKey.values()];
}

/* ★ 선생님용 앱과 동일한 기준으로 "미완료 사유" 판정 (반마다 기준점수가 다를 수 있음)
   - 결과 없음 → 미수행
   - 통과/미통과형인데 미통과 → 미통과
   - 완료/미수행형인데 미수행 → 미수행
   - 점수형이고 "이 반"에 대해 재도전 설정이 켜진 교재면 기준점수 미만일 때 → "OO점 (미달)"
   - 그 외(정상적으로 값이 있음) → null (완료로 인정) */
/* ★ 선생님용 앱과 동일한 기준으로 "미완료 사유" 판정 (반마다 기준점수가 다를 수 있음)
   - 결과 없음 + 그 날짜가 이미 지났으면 → 미수행 (오늘·미래 배정은 아직 할 기회가 남아있어 미수행이라 안 부름)
   - 통과/미통과형인데 미통과 → 미통과
   - 완료/미수행형인데 미수행 → 미수행
   - 점수형이고 "이 반"에 대해 재도전 설정이 켜진 교재면 기준점수 미만일 때 → "OO점 (미달)"
   - 그 외(정상적으로 값이 있음) → null (완료로 인정) */
function incompleteReason(book, result, group, assignDate) {
  const hasResult = result !== '' && result !== null && result !== undefined;
  if (!hasResult) {
    const today = todayStr();
    if (assignDate && assignDate >= today) return null; // 오늘·미래 배정 → 아직 미수행 아님
    return '미수행';
  }
  if (!book) return null;
  // ★ '미수행'은 채점방식과 무관하게 항상 미완료다.
  //   점수형 교재는 아래에서 Number(result)로만 판정하는데, '미수행'은 숫자가 아니라 NaN이 되어
  //   조용히 "완료로 인정됨"으로 빠져나갔음 → 선생님이 미수행으로 표시해도 학생 화면엔 안 보였던 원인.
  if (result === '미수행') return '미수행';
  if (book.score === '통과' && result !== '통과') return '미통과';
  if (book.score === '완료' && result !== '완료') return '미수행';
  if (book.score === '점수') {
    const classCfg = book.classThresholds?.[group];
    if (classCfg?.enabled) {
      const n = Number(result);
      const threshold = (classCfg.threshold != null) ? Number(classCfg.threshold) : 80;
      if (!isNaN(n) && n < threshold) return `${n}점 (미달)`;
    }
  }
  return null;
}

function renderHwCard(a, type, reason, idx) {
  const isVoca = a.type === 'voca';
  const book  = escHtml(a.bookName || '');
  // 보카형: 회차 번호만 / 교재형: 레이블
  let detail = '';
  if (isVoca) {
    const unit = a.unitFrom === a.unitTo
      ? a.unitFrom
      : `${a.unitFrom}~${a.unitTo}`;
    detail = `${escHtml(unit)}회차`;
  } else {
    detail = (a.probLabels || [])
      .map(l => escHtml(prettifyLabel(l)))
      .join(' · ');
  }
  const icon = isVoca ? '📝' : '📖';
  const dateShort = fmtDateShort(a.date);

  // ★ 홈보카/수업보카/교재 구분 배지 — 배정 시 선택한 카테고리를 그대로 보여줌
  const category = isVoca ? (a.category || '수업보카') : '교재';
  const catMeta = {
    '수업보카': { bg: '#3b4a7a', label: '🏫 수업보카' },
    '홈보카':   { bg: '#92600f', label: '🏠 홈보카' },
    '교재':     { bg: '#1c6ca8', label: '📖 교재' }
  }[category];
  const catBadge = `<span class="s-hw-cat" style="background:${catMeta.bg}">${catMeta.label}</span>`;

  let right = '';
  let cls = '';
  if (type === 'today') {
    cls = 'today';
    right = reason
      ? `<div class="s-hw-meta" style="color:var(--brand)">오늘<br><span class="s-hw-result fail" style="margin-top:.15rem">${escHtml(reason)}</span></div>`
      : `<div class="s-hw-meta" style="color:var(--brand);font-weight:700">오늘</div>`;
  } else if (type === 'overdue') {
    cls = 'overdue';
    right = `<div class="s-hw-meta" style="color:#b83224">${dateShort}<br><span class="s-hw-result fail" style="margin-top:.15rem">${escHtml(reason || '미완료')}</span></div>`;
  } else if (type === 'done') {
    cls = 'done';
    const resultStr = formatResult(a.result);
    const resultCls = getResultClass(a.result);
    right = `
      <div class="s-hw-meta">
        <div style="margin-bottom:.2rem">${dateShort}</div>
        ${resultStr ? `<span class="s-hw-result ${resultCls}">${escHtml(resultStr)}</span>` : ''}
      </div>`;
  }

  return `
    <div class="s-hw-card ${cls}" style="--i:${idx || 0}">
      <div class="s-hw-icon">${icon}</div>
      <div class="s-hw-body">
        ${catBadge}
        <div class="s-hw-title-row">
          <div class="s-hw-book">${book}</div>
          <div class="s-hw-detail">${detail || '-'}</div>
        </div>
      </div>
      ${right}
    </div>
  `;
}

function formatResult(r) {
  if (r === '' || r === null || r === undefined) return '';
  if (typeof r === 'number') return String(r);
  return String(r);
}

function getResultClass(r) {
  if (r === '완료' || r === '통과') return 'pass';
  if (r === '미수행' || r === '미통과') return 'fail';
  if (typeof r === 'number' || /^\d+$/.test(String(r))) return 'score';
  return 'score';
}

function renderMainView(student, assigns, vacations, books) {
  const today = todayStr();

  // 이 학생의 배정 전체
  // ★ 보카형 "01"/"1" 표기 중복은 선생님 앱과 동일하게 최신 것만 대표로 사용
  const myAssigns = dedupeVocaAssigns(assigns.filter(a => a.studentId === student.id), books);

  // ★ "완료"의 기준을 선생님 앱과 동일하게: 미수행·미통과·(반별 기준 설정된) 점수 미달은 모두 미완료로 취급
  const reasonOf = (a) => incompleteReason(getBookById(books, a.bookId), a.result, student.group, a.date);
  const hasResultOf = (a) => a.result !== '' && a.result !== null && a.result !== undefined;

  // ★ 받은 교재(지금 배부 목록에 있는 것) + 교재별 진행률
  //   교재형: 전체 레이블(book.rows) 기준 — 아직 배정 안 된 부분도 "남은 분량"이므로 분모에 넣는다.
  //           (예전엔 배정된 것만 분모로 써서, 171개짜리 교재를 11개만 배정받아 다 하면 100%로 보였음)
  //   보카형: 배정된 회차가 곧 전체 분량이라 그대로 배정 기준
  const myBookNames = Array.isArray(student.books) ? student.books : [];
  const bookProgressList = myBookNames.map(bn => {
    const book = books.find(b => b && b.name === bn);
    if (!book) return null;
    const bAssigns = myAssigns.filter(a => a.bookId === book.id);
    const isVoca = book.mode === 'voca';
    let total, done;
    if (isVoca) {
      const norm = v => String(Number(v));
      const units = new Set(bAssigns.map(a => norm(a.unitFrom)));
      const doneUnits = new Set(bAssigns.filter(hasResultOf).map(a => norm(a.unitFrom)));
      total = units.size;
      done = doneUnits.size;
    } else {
      const allRows = Array.isArray(book.rows) ? book.rows : [];
      const doneLabels = new Set();
      bAssigns.filter(hasResultOf).forEach(a => (a.probLabels || []).forEach(l => doneLabels.add(l)));
      // rows 정보가 없는 옛 교재는 예전 방식(배정 기준)으로 물러남
      total = allRows.length || bAssigns.length;
      done = allRows.length ? doneLabels.size : bAssigns.filter(hasResultOf).length;
    }
    const category = isVoca ? (bAssigns[0]?.category || '수업보카') : '교재';
    return { name: bn, total, done, category };
  }).filter(Boolean);

  // ★ 전체 평균 진행률(도넛 그래프용) — 단순 평균이 아니라 "전체 배정 중 전체 완료" 비율로 계산
  const totalAssignedAll = bookProgressList.reduce((s, b) => s + b.total, 0);
  const totalDoneAll = bookProgressList.reduce((s, b) => s + b.done, 0);
  const avgPct = totalAssignedAll > 0 ? Math.round((totalDoneAll / totalAssignedAll) * 100) : null;

  // ★ 연속 완료 스트릭 — 오늘(이미 했으면)부터, 아니면 어제부터 거슬러 올라가며
  //   "그날 완료한 게 하나라도 있는지" 확인. 학원 쉬는 날은 스트릭이 끊기지 않도록 건너뜀
  const doneDateSet = new Set(myAssigns.filter(hasResultOf).map(a => a.date));
  let streak = 0;
  {
    const d = new Date(today);
    if (!doneDateSet.has(today)) d.setDate(d.getDate() - 1);
    for (let i = 0; i < 60; i++) {
      const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (isNonClassDay(ds, vacations)) { d.setDate(d.getDate() - 1); continue; }
      if (doneDateSet.has(ds)) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
  }

  // 오늘 숙제: 오늘이 수업일이고 + 아직 결과가 없는 것 (오늘 배정은 "미수행" 딱지 없이도 항상 목록엔 나와야 함 —
  // reasonOf는 "날짜가 지나야 미수행"이라 오늘 것엔 null을 주는데, 그건 배지 표시용이지 목록 포함 여부완 별개)
  // (오늘이 방학/공휴일이면 오늘 카드 비워둠 - 빈 상태)
  const isTodayClassDay = !isNonClassDay(today, vacations);
  const todays = isTodayClassDay
    ? myAssigns.filter(a => a.date === today && !hasResultOf(a))
    : [];

  // 지난 미완료: 미완료 + 과거 + 방학/공휴일에 배정된 것은 제외
  const overdue = myAssigns
    .filter(a => a.date < today && reasonOf(a))
    .filter(a => !isNonClassDay(a.date, vacations))
    .sort((a,b) => b.date.localeCompare(a.date)); // 최근 미완료부터

  // 최근 완료: 결과가 있고 + 미완료 사유가 없는 것 (진짜로 통과/완료/기준 이상인 것만)
  // ★ 오늘 + 어제, 이 이틀치만 (최대 10개) — 그 이전 기록은 안 보여줌
  const yestStr = (() => {
    const d = new Date(today);
    d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();
  const recentDone = myAssigns
    .filter(a => {
      const hasResult = a.result !== '' && a.result !== null && a.result !== undefined;
      return hasResult && !reasonOf(a) && (a.date === today || a.date === yestStr);
    })
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0, 5); // ★ 최신순 5개만 — 완료 목록이 길어지면 정작 중요한 "오늘/지난 미완료"가 아래로 밀림

  // 헤더
  const todayKor = fmtDateKor(today);

  const html = `
    <div class="s-header">
      <div class="s-header-title">오늘의 숙제</div>
      <div class="s-header-name">
        ${escHtml(student.name)}
        <span class="s-header-group">${escHtml(student.group || '')}</span>
      </div>

// ══════════════════════════════════════════════════════════
// 초기화 + Firebase 데이터 로드
// ══════════════════════════════════════════════════════════
async function main() {
  const key = getAccessKey();
  if (!key) {
    renderError('접근 키가 없습니다',
      'URL에 접근 키가 포함되어 있지 않습니다.\n선생님께 다시 URL을 받아주세요.');
    return;
  }

  try {
    // Firebase 초기화 (별도 앱 이름)
    const app = firebase.initializeApp(FIREBASE_CONFIG, 'student-view');
    const db  = firebase.database(app);

    // 데이터 읽기 (한 번만)
    const snap = await db.ref(FB_PATH).once('value');
    const val  = snap.val();

    if (!val) {
      renderError('숙제 데이터를 찾을 수 없습니다',
        '아직 아무 데이터가 등록되지 않았거나,\n선생님께서 설정 중일 수 있어요.\n잠시 후 다시 접속해주세요.');
      return;
    }

    const students  = Array.isArray(val.students)  ? val.students  : _toArray(val.students);
    const assigns   = Array.isArray(val.assigns)   ? val.assigns   : _toArray(val.assigns);
    const vacations = Array.isArray(val.vacations) ? val.vacations : _toArray(val.vacations);
    const books     = Array.isArray(val.books)     ? val.books     : _toArray(val.books); // ★ 미완료 판정에 필요 (채점 방식·기준점수)

    // 내 accessKey에 매칭되는 학생 찾기
    const me = students.find(s => s.accessKey === key);
    if (!me) {
      renderError('숙제 정보를 찾을 수 없습니다',
        '접근 키가 유효하지 않습니다.\n학생 탈퇴로 인해 URL이 무효화되었을 수 있어요.\n선생님께 문의해주세요.');
      return;
    }

    // 메인 뷰 렌더링
    renderMainView(me, assigns, vacations, books);

  } catch (err) {
    console.error(err);
    renderError('연결 오류',
      '인터넷 연결을 확인하고 다시 시도해주세요.\n\n' + (err.message || err));
  }
}

main();
</script>
