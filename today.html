<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 수업 · 수업 패턴</title>
<style>
:root{
  --bg:#f7f6f3;--surface:#fff;--s2:#f1f0ed;--bd:#e2e1dd;
  --acc:#4f46e5;--acc-soft:#eef0fd;--grn:#059669;--grn-soft:#e7f6ef;
  --amb:#b45309;--amb-soft:#fdf3e2;--red:#dc2626;--red-soft:#fdecec;
  --tx:#1a1a1a;--mu:#6b7280;--r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* 상단 */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--bd)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em}
.date{display:flex;align-items:center;gap:4px;margin-left:auto}
.date button{border:1px solid var(--bd);background:var(--surface);border-radius:8px;width:32px;height:32px}
.date .d{font-weight:700;min-width:118px;text-align:center}
.date .today{width:auto;padding:0 10px;font-size:12px}
.icon-btn{border:1px solid var(--bd);background:var(--surface);border-radius:8px;height:32px;padding:0 10px;font-size:13px}
.icon-btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.sync{font-size:12px;color:var(--mu);width:100%;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.dot.ok{background:var(--grn)}.dot.err{background:var(--red)}.dot.load{background:var(--amb)}

main{max-width:980px;margin:0 auto;padding:14px 16px 60px}

/* 시간표 슬롯 */
.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.slot{flex:0 0 auto;min-width:132px;border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left}
.slot .t{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.slot .n{font-weight:700;margin-top:1px}
.slot .k{font-size:11px;margin-top:3px;display:inline-block;padding:1px 6px;border-radius:99px}
.k-main{background:var(--acc-soft);color:var(--acc)}
.k-rv{background:var(--grn-soft);color:var(--grn)}
.k-word{background:var(--amb-soft);color:var(--amb)}
.k-el{background:#fce7f3;color:#be185d}
.chip.lv-el{background:#fce7f3;color:#be185d}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.tabs button.on{background:var(--tx);border-color:var(--tx);color:#fff}
.slot.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.slot.past{opacity:.55}
.slot[disabled]{cursor:default;opacity:.5}
.empty-day{padding:22px;text-align:center;color:var(--mu);background:var(--surface);border:1px dashed var(--bd);border-radius:var(--r)}

/* 요약 */
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.head h2{font-size:18px;margin:0;letter-spacing:-.02em}
.head .sub{color:var(--mu);font-size:13px}
.guide{background:var(--surface);border:1px solid var(--bd);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:8px 12px;font-size:13px;margin-bottom:10px}
.guide b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--mu)}
.stat.red .v{color:var(--red)}.stat.amb .v{color:var(--amb)}

/* 학생 카드 */
.list{display:grid;gap:8px}
.st{background:var(--surface);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:4px 14px;align-items:start}
.st.absent{opacity:.5}
.st.flag-red{border-left:4px solid var(--red)}
.st.flag-amb{border-left:4px solid var(--amb)}
.st.flag-exam{border-left:4px solid var(--acc)}
.nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--s2);color:var(--tx);white-space:nowrap}
.chip.lv-5{background:#f3e8ff;color:#7e22ce}
.chip.lv-in{background:#e0f2fe;color:#0369a1}
.chip.lv-ba{background:#dcfce7;color:#15803d}
.chip.lv-wa{background:#fef9c3;color:#a16207}
.chip.van{background:#fff7ed;color:#c2410c}
.chip.abs{background:var(--red-soft);color:var(--red)}
.rows{display:grid;gap:3px;font-size:13px}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .lb{color:var(--mu);font-size:12px;min-width:44px}
.due{font-weight:800;font-variant-numeric:tabular-nums}
.due.red{color:var(--red)}.due.amb{color:var(--amb)}.due.ok{color:var(--grn)}
.exam{color:var(--acc);font-weight:700}
.muted{color:var(--mu)}
.miss{font-size:12px;color:var(--mu)}
.sec{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--tx)}
.sec span{color:var(--mu);font-weight:400}
.nostu{padding:24px;text-align:center;color:var(--mu);background:var(--surface);border-radius:var(--r);border:1px dashed var(--bd)}
.warn{background:var(--amb-soft);color:#7c4a03;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}

/* 설정 */
dialog{border:none;border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-h{position:sticky;top:0;background:var(--surface);padding:14px 16px 10px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-h h3{margin:0;font-size:16px;flex:1}
.dlg-b{padding:10px 16px 18px}
.dlg-b p{margin:0 0 10px;color:var(--mu);font-size:13px}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.set-row .nm2{font-weight:700;min-width:70px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 9px;font-size:12px;border-right:1px solid var(--bd)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--acc);color:#fff}
.van-t{border:1px solid var(--bd);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;margin-left:auto}
.van-t.on{background:#fff7ed;border-color:#fdba74;color:#c2410c;font-weight:700}
/* 수업 패턴 설계 */
.k-38{background:#ede9fe;color:#6d28d9}
.pl-head{margin:4px 0 12px}
.pl-head h2{font-size:18px;margin:0 0 2px;letter-spacing:-.02em}
.pl-head p{margin:0;color:var(--mu);font-size:13px}
.pl-groups{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pl-groups button{border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700}
.pl-groups button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pl-groups button small{font-weight:400;opacity:.8;margin-left:4px}
.pl-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.pl-card h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-card h3 .hint{font-weight:400;color:var(--mu);font-size:12px}
.wk{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:4px;font-size:12px}
.wk .h{font-weight:700;text-align:center;color:var(--mu);padding:2px 0}
.wk .rl{color:var(--mu);display:flex;align-items:center;font-size:12px}
.wk .c{min-height:40px;border-radius:8px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;gap:1px;line-height:1.25}
.wk .c.none{background:transparent;color:#c9c8c4}
.wk button.c{border:2px solid transparent;font-weight:800;font-size:13px}
.wk button.c small{font-weight:400;font-size:11px;opacity:.8}
.wk button.c.chun{background:var(--acc-soft);color:var(--acc)}
.wk button.c.d3800{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
.wk .c.rv{background:var(--grn-soft);color:var(--grn)}
.wk .c.word{background:var(--amb-soft);color:var(--amb)}
.notes{display:grid;gap:5px;font-size:13px;margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:7px;align-items:baseline}
.notes li i{font-style:normal;flex:0 0 18px;text-align:center;font-weight:800}
.notes li.n-good i{color:var(--grn)}.notes li.n-warn i{color:var(--amb)}.notes li.n-info i{color:var(--mu)}
.notes li.n-warn span{color:#92400e}
.verdict{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.verdict .rank{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px}
.rank.r1{background:var(--grn-soft);color:var(--grn)}.rank.r2{background:var(--amb-soft);color:var(--amb)}.rank.r3{background:var(--red-soft);color:var(--red)}
.opts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;margin-bottom:10px}
.opts label{display:flex;gap:5px;align-items:center}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.cand:first-of-type{border-top:none}
.cand .no{font-weight:800;font-size:13px;color:var(--mu);min-width:44px}
.cand .no.best{color:var(--grn)}
.strip{display:flex;gap:3px}
.strip{flex-wrap:wrap}
.strip span{white-space:nowrap;text-align:center;font-size:11px;border-radius:6px;padding:2px 6px;background:var(--s2);color:#c9c8c4}
.strip span.chun{background:var(--acc-soft);color:var(--acc);font-weight:700}
.strip span.d3800{background:#ede9fe;color:#6d28d9;font-weight:800}
.cand .why{grid-column:2 / 4;font-size:12px;color:var(--mu)}
.cand .cur{font-size:11px;color:var(--grn);font-weight:700}
.savebar{position:sticky;bottom:12px;display:flex;align-items:center;gap:10px;background:#1f2937;color:#fff;border-radius:12px;padding:10px 14px;margin-top:8px}
.savebar span{flex:1;font-size:13px}
.savebar button{border:none;border-radius:8px;padding:7px 14px;font-weight:700}
.savebar .sv{background:#fff;color:#111}.savebar .rs{background:transparent;color:#d1d5db}
.load-tb{width:100%;border-collapse:collapse;font-size:13px}
.load-tb th,.load-tb td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top}
.load-tb th{color:var(--mu);font-weight:600;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;margin:1px 2px 1px 0}
.tag.chun{background:var(--acc-soft);color:var(--acc)}.tag.d3800{background:#ede9fe;color:#6d28d9}
@media (max-width:640px){.wk{grid-template-columns:40px repeat(5,minmax(0,1fr))}.cand{grid-template-columns:auto 1fr}.cand .act{grid-column:1 / 3}.cand .why{grid-column:1 / 3}}
.wk .c.sel{border:1.5px solid;padding:2px}
.wk .c.sel select{border:none;background:transparent;font-weight:800;font-size:13px;text-align:center;width:100%;cursor:pointer;-webkit-appearance:none;appearance:none;text-align-last:center}
.wk .c.sel small{font-size:11px;opacity:.75}
.ty{border-top:1px solid var(--bd);padding:10px 0}
.ty:first-of-type{border-top:none;padding-top:2px}
.ty-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ty-h input[type=color]{width:28px;height:28px;border:none;padding:0;background:none}
.ty-n{font-weight:800;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;width:140px}
.ty-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.st-chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--bd);border-radius:8px;padding:2px 4px 2px 6px;font-size:12px;background:var(--s2)}
.st-chip input{border:none;background:transparent;width:96px;font-size:12px}
.st-chip input[type=number]{width:34px;text-align:right}
.st-chip button{border:none;background:none;color:var(--mu);padding:0 2px}
.tt-card .sec{margin-top:4px}
.tt-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.tt-row.bad{background:var(--red-soft);margin:0 -14px;padding:8px 14px}
.tt-days{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tt-days button{border:none;border-right:1px solid var(--bd);background:var(--surface);padding:4px 7px;font-size:12px;color:var(--mu)}
.tt-days button:last-child{border-right:none}
.tt-days button.on{background:var(--tx);color:#fff;font-weight:700}
.tt-f{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.tt-f input,.tt-f select{border:1px solid var(--bd);border-radius:8px;padding:4px 6px;background:var(--surface);font-size:13px}
.tt-f input.tm{width:56px;text-align:center;font-variant-numeric:tabular-nums}
.tt-f input.lb{width:110px}
.tt-g{flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:2px;background:var(--acc-soft);color:var(--acc);border-radius:99px;padding:2px 4px 2px 9px;font-size:12px;font-weight:700}
.gchip.miss{background:var(--red);color:#fff}
.gchip button{border:none;background:none;color:inherit;opacity:.7;padding:0 3px}
.tt-del{margin-left:auto;border:1px solid var(--bd);background:var(--surface);border-radius:8px;width:28px;height:28px;color:var(--mu)}
.pl-head p b{color:var(--acc)}
.num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:800}
.rq{display:grid;grid-template-columns:150px auto 1fr;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.rq:first-of-type{border-top:none}
.rq-n b{font-size:15px;display:block}.rq-n small{color:var(--mu);font-size:12px}
.rq-f{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rq-l{font-size:12px;color:var(--mu)}
.rq-auto{font-weight:800;font-size:13px}
.rq-warn{grid-column:1 / -1;color:var(--red);font-size:12px}
.rq{grid-template-columns:150px 1fr !important}
.rq-st{grid-column:2;font-size:12px;font-weight:700;color:var(--mu)}
.rq-st.ok{color:var(--grn)}.rq-st.under{color:var(--amb)}.rq-st.over{color:var(--red)}
.step.on b{min-width:30px}
.step .x{background:none !important;color:inherit;opacity:.6;width:20px !important}
@media (max-width:640px){.rq{grid-template-columns:1fr !important}.rq-st{grid-column:1}}
.step{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--bd);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;font-weight:700;color:var(--mu)}
.step button{border:none;background:var(--s2);border-radius:50%;width:24px;height:24px;font-weight:800;color:var(--tx)}
.step button:disabled{opacity:.3;cursor:default}
.step b{min-width:12px;text-align:center}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:800;padding:13px}
.big-btn .num{background:#fff;color:var(--acc)}
.rc-wrap{overflow-x:auto}
.rc-tb{width:100%;border-collapse:separate;border-spacing:4px;min-width:560px}
.rc-tb thead th{font-size:12px;color:var(--mu);font-weight:700}
.rc-tb tbody th{text-align:left;font-size:14px;white-space:nowrap;vertical-align:middle;padding-right:4px}
.rc-tb .alt{display:block;margin-top:3px;border:1px solid var(--bd);background:var(--surface);border-radius:99px;font-size:11px;padding:1px 8px;color:var(--mu);font-weight:400}
.rc{border:1.5px solid;border-radius:9px;text-align:center;padding:3px 2px;min-height:42px;display:flex;flex-direction:column;justify-content:center}
.rc.chg{border-style:dashed;border-width:2px}
.rc select{border:none;background:transparent;font-weight:800;font-size:13px;width:100%;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;cursor:pointer}
.rc small{font-size:11px;opacity:.75}
.rc-tb tr.why td{font-size:12px;padding:0 0 8px}
.rc-tb tr.why span{margin-right:12px;display:inline-block}
.w-good{color:var(--grn)}.w-warn{color:#b45309}.w-info{color:var(--mu)}
details.pl-card summary{cursor:pointer;list-style:none}
details.pl-card summary .hint{font-weight:400;color:var(--mu);font-size:12px;margin-left:6px}
@media (max-width:640px){.rq{grid-template-columns:1fr}}
.rt{border-top:1px solid var(--bd);padding:12px 0}
.rt:first-of-type{border-top:none;padding-top:4px}
.rt-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-h input[type=color]{width:28px;height:28px;border:none;padding:0;background:none}
.rt-used{font-size:12px;color:var(--mu)}
.rt-tot{margin-left:auto;font-size:12px;font-weight:700;color:var(--mu)}
.rt-tot.ok{color:var(--grn)}.rt-tot.over{color:var(--red)}.rt-tot.under{color:var(--amb)}
.rt-bar{display:flex;gap:2px;margin:8px 0;height:40px;border-radius:9px;overflow:hidden}
.rt-bar div{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0;padding:0 2px}
.rt-bar div small{font-weight:400;opacity:.8;font-size:10px}
.rt-bar .rest{background:repeating-linear-gradient(45deg,#f1f0ed,#f1f0ed 6px,#e7e5e0 6px,#e7e5e0 12px);color:var(--mu);font-weight:400}
.rt-list{display:grid;gap:4px}
.rt-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-no{width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rt-n{border:1px solid var(--bd);border-radius:8px;padding:5px 8px;width:150px;font-size:13px}
.rt-m{display:inline-flex;align-items:center;gap:3px;font-size:13px}
.rt-m button{border:none;background:var(--s2);border-radius:50%;width:24px;height:24px;font-weight:800}
.rt-m input{width:44px;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:4px 2px;font-size:13px}
.rt-act{display:inline-flex;gap:3px}
.rt-act button{border:1px solid var(--bd);background:var(--surface);border-radius:7px;width:26px;height:26px;color:var(--mu);font-size:12px}
.rt-act button:disabled{opacity:.3;cursor:default}
.rt-add{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.rt-add button{border:1px dashed #c9c8c4;background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--tx)}
.today-rt{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.tr-bar{position:relative;display:flex;gap:2px;height:30px;border-radius:8px;overflow:hidden}
.tr-bar div{display:flex;align-items:center;justify-content:center;font-size:11px;white-space:nowrap;overflow:hidden;min-width:0;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-weight:700;padding:0 2px}
.tr-bar div.done{background:#ecebe7;color:#a8a6a0;font-weight:400}
.tr-bar div.cur{background:var(--c);color:#fff}
.tr-bar div.rest{background:#f1f0ed}
.tr-bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
.tr-info{font-size:13px;margin-top:5px;color:var(--mu)}
.tr-info b{color:var(--tx)}
@media (max-width:640px){.rt-n{width:120px}.rt-tot{margin-left:0;width:100%}}

<script>
/* ══════════════════════════════════════════════════════════
   오늘 수업 화면 — 더퍼스트학원
   · LMS(숙제관리 v456~)의 Firebase 데이터를 "읽기만" 한다.
   · 학교·반·시험대비 기간은 LMS가 기준 — 학교는 LMS 👥 학생 관리, 시험대비 기간은 LMS 📅 학원 일정 → 🏫 학교 시험대비 기간.
   · 이 화면에서 저장하는 것은 차량·수업 패턴·시간표 반 연결뿐이고,
     LMS가 쓰지 않는 별도 경로 homework_v4/todayView 에만 저장한다.
   ══════════════════════════════════════════════════════════ */
const DB_URL  = 'https://sotong-academy-default-rtdb.asia-southeast1.firebasedatabase.app';
const FB_PATH = 'homework_v4';
const VIEW_PATH = FB_PATH + '/todayView/students';
const READ_KEYS = ['students', 'books', 'assigns', 'schoolEvents', 'classDaysByGroup', 'attendance', '_tomb', 'groups', 'classPauses'];
const MAP_PATH = FB_PATH + '/todayView/groupMap';   // 시간표 반 이름 → LMS 반 이름

/* 시간표의 school 값('신탄'·'대청'·'중앙')은 LMS 학교 이름에 들어 있는 글자로 맞춘다 (예: '대청' → LMS '대청중') */
const schoolHit = (stSchool, key) => !!stSchool && !!key && String(stSchool).replace(/\s+/g, '').includes(key);
const DUE_RED = 3;         // 밀린 홈보카 이 개수 이상이면 원장님 보고

/* ══ 시간표 ══
   시간표는 앱의 '시간표' 탭에서 고치고 homework_v4/todayView/timetable 에 저장한다.
   반 칸은 숙제관리 앱의 반 목록에서만 고르므로 반 이름이 항상 숙제관리 앱과 같다.
   항목: { id, days:[1~6], t:'6:10', e:'6:55', room:'1강', kind:'class'|'rv'|'word', g:[반…], school:'', label:'' }
   시간은 오후 기준 h:mm. SEED_TT는 저장된 시간표가 없을 때 한 번만 쓰는 처음 값(종이 시간표). */
const TT_PATH = FB_PATH + '/todayView/timetable';
const SEED_TT = [
  // 초등 (월~금 매일)
  { days:[1,2,3,4,5], t:'2:15', e:'3:00', room:'1강',   kind:'class', g:['초2'],   label:'P' },
  { days:[1,2,3,4,5], t:'3:05', e:'3:25', room:'2강',   kind:'word',  g:['초6'] },
  { days:[1,2,3,4,5], t:'3:05', e:'3:50', room:'1강',   kind:'class', g:['초124'] },
  { days:[1,2,3,4,5], t:'3:25', e:'4:10', room:'1강',   kind:'class', g:['초23'],  label:'P4' },
  { days:[1,2,3,4,5], t:'3:25', e:'4:10', room:'2강',   kind:'class', g:['초456'], label:'B' },
  { days:[1,2,3,4,5], t:'4:10', e:'4:30', room:'1·2강', kind:'word',  g:['초23','초456','초56'] },
  { days:[1,2,3,4,5], t:'4:30', e:'5:15', room:'1강',   kind:'class', g:['초56'] },
  { days:[1,2,3,4,5], t:'4:30', e:'5:15', room:'2강',   kind:'class', g:['초6'] },
  // 중등 본수업
  { days:[1,2,3,5], t:'6:10', e:'6:55', room:'1강', kind:'class', g:['중1'] },
  { days:[1,3,5],   t:'7:00', e:'7:45', room:'1강', kind:'class', g:['중2'] },
  { days:[4],       t:'6:10', e:'6:55', room:'1강', kind:'class', g:['중2'] },
  { days:[2],       t:'7:00', e:'7:45', room:'1강', kind:'class', g:['중3'] },
  { days:[3,4,5],   t:'5:20', e:'6:05', room:'1강', kind:'class', g:['중3'] },
  // 중등 RV (school '' = 학년 전체)
  { days:[1], t:'5:20', e:'6:05', room:'2강', kind:'rv', g:['중1'] },
  { days:[5], t:'7:00', e:'7:45', room:'2강', kind:'rv', g:['중1'] },
  { days:[2], t:'5:20', e:'6:05', room:'2강', kind:'rv', g:['중2'], school:'중앙' },
  { days:[4], t:'7:00', e:'7:45', room:'2강', kind:'rv', g:['중2'] },
  { days:[5], t:'5:20', e:'6:05', room:'2강', kind:'rv', g:['중2'], school:'신탄' },
  { days:[5], t:'6:10', e:'6:55', room:'2강', kind:'rv', g:['중2'], school:'대청' },
  { days:[1], t:'7:00', e:'7:45', room:'2강', kind:'rv', g:['중3'] },
  { days:[2], t:'5:20', e:'6:05', room:'2강', kind:'rv', g:['중3'] },
  { days:[4], t:'7:00', e:'7:45', room:'2강', kind:'rv', g:['중3'], school:'대청' },
  { days:[5], t:'8:25', e:'9:10', room:'2강', kind:'rv', g:['중3'] },
  // 중등 단어
  { days:[1], t:'6:10', e:'6:55', room:'2강', kind:'word', g:['중2'], school:'대청' },
  { days:[2], t:'6:10', e:'6:55', room:'2강', kind:'word', g:['중2'], school:'중앙' },
  { days:[5], t:'6:10', e:'6:55', room:'2강', kind:'word', g:['중2'], school:'신탄' },
  { days:[3], t:'8:25', e:'9:10', room:'2강', kind:'word', g:['중3'], school:'대청' },
  { days:[4], t:'7:00', e:'7:45', room:'2강', kind:'word', g:['중3'], school:'신탄' },
].map((x, i) => ({ id:'tt' + (i + 1), school:'', label:'', ...x }));
let TTL = null;          // 저장된 시간표 (없으면 종이 시간표를 옮겨 온 것)
let ttSaved = false;     // Firebase에 시간표가 저장돼 있는지
let ttEdit = null;       // 시간표 탭에서 고치는 중인 것
let ttSel = null;        // 시간표 그림에서 고르고 있는 칸
let ttDay = 1;           // 휴대폰에서 보이는 요일
let TT = {};             // 요일별로 펼친 시간표 (화면용)
function normTT(x, i) {
  return { id: x.id || 'tt' + Date.now().toString(36) + i, days: toArr(x.days).map(Number).filter(d => d >= 1 && d <= 6).sort(),
    t: String(x.t || ''), e: String(x.e || ''), room: String(x.room || ''), kind: x.kind === 'main' || x.kind === 'el' ? 'class' : (x.kind || 'class'),
    g: toArr(x.g).map(String), school: String(x.school || ''), label: String(x.label || '') };
}
/* 종이 시간표 → 숙제관리 앱 반 이름 (예전에 '연결'해 둔 것도 반영) */
function seedFromPaper() {
  const lms = D ? D.lmsGroups : [];
  const schools = D ? [...new Set(D.students.map(st => st.school).filter(Boolean))] : [];
  const fullSchool = key => key ? (schools.filter(sc => schoolHit(sc, key)).length === 1 ? schools.find(sc => schoolHit(sc, key)) : key) : '';
  return SEED_TT.map((x, i) => normTT({ ...x, school: fullSchool(x.school), g: [...new Set(x.g.flatMap(n => lms.includes(n) ? [n] : Array.isArray(GMAP[n]) ? GMAP[n] : GMAP[n] ? [GMAP[n]] : [n]))] }, i));
}
function buildTT() {
  TT = {};
  (TTL || []).forEach(x => x.days.forEach(d => {
    const kind = x.kind === 'class' ? (x.g.length && x.g.every(isEl) ? 'el' : 'main') : x.kind;
    (TT[d] = TT[d] || []).push({ ...x, kind });
  }));
  Object.values(TT).forEach(a => a.sort((p, q) => (minutesOf(p.t) - minutesOf(q.t)) || p.room.localeCompare(q.room)));
}

const KIND = {
  el:   { label:'초등수업', cls:'k-el' },
  main: { label:'본수업', cls:'k-main' },
  rv:   { label:'RV',     cls:'k-rv' },
  word: { label:'단어',   cls:'k-word' },
};

/* ── 수업 패턴 (반별 요일별 본수업 종류) ──
   저장 위치: homework_v4/todayView/patterns/<반> = { d1:'chun', d3:'3800', … }  (d+요일번호, 1=월) */
const PAT_PATH = FB_PATH + '/todayView/patterns';
const DEFAULT_PAT = { '중1': { d3:'3800' }, '중2': { d3:'3800' } };   // 2026-11-10 정한 것

/* ── 수업 종류 ── homework_v4/todayView/lessonTypes = { id: { name, lv:'mid'|'el', color, steps:[{ n:단계, m:분 }] } }
   천문장(chun)·3800은 평가 규칙이 따로 있고, 나머지는 앱에서 만든 이름·순서대로 쓴다. */
const TYPES_PATH = FB_PATH + '/todayView/lessonTypes';
const DEFAULT_TYPES = {
  chun:    { name:'천문장', lv:'mid', color:'#4f46e5', steps:[{n:'수업보카',m:5},{n:'테스트',m:10},{n:'채점',m:3},{n:'대표문장 입문',m:5},{n:'대표문장 기본',m:5},{n:'오답 첨삭',m:14},{n:'숙제 안내',m:3}] },
  '3800':  { name:'3800', lv:'mid', color:'#7c3aed', steps:[{n:'포스트잇·보카 복습',m:5},{n:'3800 단계별 설명·풀기',m:30},{n:'질문·반복 확인',m:7},{n:'숙제 안내',m:3}] },
  phonics: { name:'파닉스', lv:'el', color:'#db2777', steps:[] },
  basic:   { name:'베이직', lv:'el', color:'#059669', steps:[] },
  t3800:   { name:'3800제 해석', lv:'el', color:'#d97706', steps:[] },
  // RV · 단어 시간
  rv3800:  { name:'3800 연습', lv:'mid', kind:'rv', color:'#059669', steps:[{n:'밀린 홈보카',m:10},{n:'3800 풀기·질문',m:30},{n:'반복 확인',m:5}] },
  rvhw:    { name:'숙제·재시험', lv:'mid', kind:'rv', color:'#b45309', steps:[{n:'밀린 홈보카',m:20},{n:'수업보카 재시험',m:10},{n:'천문장 고치기',m:15}] },
  wvoca:   { name:'단어장 시험', lv:'mid', kind:'word', color:'#d97706', steps:[{n:'홈보카 범위 단어장 시험',m:20},{n:'틀린 단어 다시',m:10}] },
  ewvoca:  { name:'단어장 시험', lv:'el', kind:'word', color:'#d97706', steps:[] },
};
const KIND_NAME = { class:'수업', rv:'RV', word:'단어 시간' };
let TYPES = JSON.parse(JSON.stringify(DEFAULT_TYPES));
let typesDraft = null;
const typesNow = () => typesDraft || TYPES;
const typeList = (lv, kind = 'class') => Object.keys(typesNow()).filter(id => typesNow()[id] && typesNow()[id].lv === lv && (typesNow()[id].kind || 'class') === kind).map(id => ({ id, ...typesNow()[id] }));
const typesDirty = () => !!typesDraft && JSON.stringify(typesDraft) !== JSON.stringify(TYPES);
function normTypes(raw) {
  const o = {};
  Object.keys(raw || {}).forEach(id => { const t = raw[id]; if (!t || !t.name) return;
    o[id] = { name: String(t.name), lv: t.lv === 'el' ? 'el' : 'mid', kind: t.kind || 'class', color: t.color || '#6b7280', steps: toArr(t.steps).map(x => ({ n: String(x.n || ''), m: +x.m || 0 })) }; });
  if (!Object.keys(o).length) return JSON.parse(JSON.stringify(DEFAULT_TYPES));
  // 예전에 저장한 목록에 RV·단어 종류가 없으면 기본값을 넣어 준다
  Object.keys(DEFAULT_TYPES).forEach(id => { const t = DEFAULT_TYPES[id], kd = t.kind || 'class';
    if (kd !== 'class' && !o[id] && !Object.values(o).some(x => x.lv === t.lv && x.kind === kd)) o[id] = JSON.parse(JSON.stringify(t)); });
  return o;
}

let PAT = {};                 // Firebase에 저장된 패턴
let draft = {};               // 화면에서 고치는 중인 패턴
let mode = 'today';           // 'today' | 'plan' | 'tt'
let planGroup = '중1';
let planLv = 'mid';
let planKind = 'class';       // 'class' 수업 | 'rv' RV | 'word' 단어 시간
let planOpt = { avoid90: true, align: true };
let planCounts = {};          // { 반: { 수업종류: 일수 } } — 추천 받기에서 정하는 것

/* ── 상태 ── */
let D = null;            // LMS 데이터
let VIEW = {};           // { studentId: { van } }  (예전 school 값은 쓰지 않음 — LMS 학교가 기준)
let GMAP = {};           // { 시간표 반 이름: [LMS 반 이름…] }
let curDate = todayStr();
let curSlot = null;      // index in TT[dow]
let dlgGroup = '중1';

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayStr(d) { const t = d || new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return todayStr(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function dowOf(s) { return new Date(s + 'T00:00:00').getDay(); }
function toArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v.filter(x => x != null);
  if (typeof v !== 'object') return [];
  return Object.keys(v).map(k => v[k]).filter(x => x != null);
}
function minutesOf(t) { const [h, m] = t.split(':').map(Number); return (h < 12 ? h + 12 : h) * 60 + m; }   // 오후 시간표
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800); }
function setSync(state, txt) { $('sync-dot').className = 'dot ' + state; $('sync-txt').textContent = txt; }

/* ── Firebase REST (읽기) ── */
async function getJSON(path) {
  const r = await fetch(`${DB_URL}/${path}.json`, { cache:'no-store' });
  if (!r.ok) throw new Error(`${path} ${r.status}`);
  return r.json();
}
async function load() {

/* ══ LMS 판정 로직 (index_v451의 미완료 확인과 같은 규칙) ══ */
const getBook = id => D.bookById.get(Number(id)) || null;
function sameCategory(recCat, cat) { if (cat == null) return true; if (!recCat) return true; return recCat === cat; }
function cohortDone(st, a) {
  const list = st.completedBooks; if (!Array.isArray(list) || !list.length) return false;
  const book = getBook(a.bookId), cohort = a.cohort || '';
  const isVoca = book && book.mode === 'voca';
  const cat = isVoca ? (a.category || '수업보카') : null;
  return list.some(c => c
    && ((c.bookId != null) ? c.bookId === a.bookId : (book ? c.bookName === book.name : c.bookName === a.bookName))
    && (c.cohort || '') === cohort && (!isVoca || sameCategory(c.category, cat)));
}
function incompleteReason(book, result, group, assignDate, until) {
  const has = result !== '' && result !== null && result !== undefined;
  if (!has) return (assignDate && assignDate >= until) ? null : '미수행';
  if (!book) return null;
  if (result === '미수행') return '미수행';
  if (book.score === '통과' && result !== '통과') return '미통과';
  if (book.score === '완료' && result !== '완료') return '미수행';
  if (book.score === '점수') {
    const cfg = book.classThresholds && book.classThresholds[group];
    if (cfg && cfg.enabled) {
      const n = Number(result), th = cfg.threshold != null ? Number(cfg.threshold) : 80;
      if (!isNaN(n) && n < th) return `${n}점`;
    }
  }
  return null;
}
function dedupeVoca(list) {
  const latest = new Map(), others = [];
  list.forEach(a => {
    const book = getBook(a.bookId);
    if ((book ? book.mode : a.type) !== 'voca') { others.push(a); return; }
    const key = `${a.bookId}:${String(Number(a.unitFrom))}:${a.cohort||''}:${a.category||''}`;
    const ex = latest.get(key);
    if (!ex || a.date > ex.date) latest.set(key, a);
  });
  return [...others, ...latest.values()];
}
/* 학생의 보카 숙제: 밀린 것(기준일 전날까지) + 지금 하는 것 */
function vocaInfo(st, until) {
  const mine = D.assigns.filter(a => a.studentId === st.id && a.date && a.date <= until);
  const out = { home: { due: [], cur: null }, cls: { due: [], cur: null } };
  dedupeVoca(mine).forEach(a => {
    const book = getBook(a.bookId);
    if ((book ? book.mode : a.type) !== 'voca') return;
    const slot = (a.category || '수업보카') === '홈보카' ? out.home : out.cls;
    if (!slot.cur || a.date > slot.cur.date || (a.date === slot.cur.date && Number(a.unitFrom) > Number(slot.cur.unitFrom))) slot.cur = a;
    if (cohortDone(st, a)) return;
    const r = incompleteReason(book, a.result, st.group, a.date, until);
    if (r) slot.due.push({ ...a, _r: r });
  });
  out.home.due.sort((x, y) => x.date.localeCompare(y.date));
  out.cls.due.sort((x, y) => x.date.localeCompare(y.date));
  return out;
}
/* 지금 배부된 교재로 레벨·3800·시험대비 교재 판단 */
function bookInfo(st) {
  const names = (st.books || []).map(String);
  const done = new Set((st.completedBooks || []).filter(c => c && !c.cohort).map(c => c.bookName));
  const active = names.filter(n => !done.has(n));
  const n = s => s.replace(/\s+/g, '');
  let level = null;
  const lv = [
    { re:/천문장완성/, key:'wa', label:'완성' },
    { re:/천문장기본/, key:'ba', label:'기본' },
    { re:/천문장입문/, key:'in', label:'입문' },
    { re:/^5형식/,     key:'5',  label:'5형식' },
  ];
  for (const L of lv) {
    const hit = active.find(x => L.re.test(n(x)) && !/home|단어/i.test(n(x)));
    if (hit) { level = { ...L, book: hit }; break; }
  }
  const drill = active.find(x => /3800\s*드릴/.test(x));
  const examBooks = active.filter(x => {
    const b = D.books.find(bb => bb.name === x);
    return (b && b.extra) || /(중간|기말)/.test(x);
  });
  // 초등: 지금 하는 교재(보카·단기 교재 제외)
  const elBooks = active.filter(x => { const b = D.books.find(bb => bb.name === x); return b && b.mode !== 'voca' && !b.extra; });
  const mainRe = /^(alphabet|phonics|story|basic)\s*\d+$/i;
  const elMain = elBooks.find(x => mainRe.test(x.trim())) || null;
  return { level, drill, examBooks, elBooks, elMain };
}
/* 시험대비 기간: LMS 📅 학원 일정 → 🏫 학교 시험대비 기간에 등록한 것 (그 학생 학교 + 반) */

}

  const stats = s.kind === 'main'

    : (s.kind === 'el' || gList(s).every(isEl)) ? [[rows.length, '명'], [nDue, '밀린 홈보카 학생', nDue ? 'amb' : ''], [nRed, `${DUE_RED}세트 이상 · 원장님 보고`, nRed ? 'red' : ''], [nVan, '🚐 차량']]
    : [[nDue, '밀린 홈보카 학생', nDue ? 'amb' : ''], [nRed, `${DUE_RED}세트 이상 · 원장님 보고`, nRed ? 'red' : ''], [nVan, '🚐 차량'], [nExam, '시험대비']];

  return `
    <div class="head"><h2>${esc(title)} ${KIND[s.kind].label}${s.dayType ? ' · ' + esc(tName(s.dayType)) : ''}</h2>
      <span class="sub">${s.t}~${s.e} · ${s.room} · ${rows.length}명${daysNote ? ' · ' + daysNote : ''}</span></div>
    ${routineBar(s)}
    <div class="guide">${guide}</div>
    ${warn}
    <div class="stats">${stats.map(([v, l, c]) => `<div class="stat ${c || ''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    ${rows.length ? listHtml(rows, s) : `<div class="nostu">이 시간 명단이 비어 있어요.${s.school ? ' 숙제관리 앱 👥 학생 관리에서 학교를 넣어 주세요.' : ''}</div>`}`;
}

/* 오늘 수업: 루틴 진행 막대 (지금 진행 중이면 현재 단계와 남은 시간) */
function routineBar(s) {
  const t = s.dayType && TYPES[s.dayType]; if (!t || !t.steps || !t.steps.length) return '';
  const tot = t.steps.reduce((a, x) => a + (+x.m || 0), 0), L = Math.max(slotLen(s), tot);
  const now = new Date(), nm = now.getHours() * 60 + now.getMinutes(), el = nm - minutesOf(s.t);
  const live = curDate === todayStr() && el >= 0 && el < slotLen(s);
  let acc = 0, cur = null;
  const segs = t.steps.map(x => { const a = acc; acc += +x.m || 0; const st = live ? (el >= acc ? 'done' : el >= a ? 'cur' : '') : ''; if (st === 'cur') cur = { x, left: acc - el }; return `<div class="${st}" style="flex:${Math.max(+x.m || 0, 1)}">${esc(x.n)}</div>`; }).join('');
  const rest = L > tot ? `<div class="rest" style="flex:${L - tot}"></div>` : '';
  const info = live ? (cur ? `지금 <b>${esc(cur.x.n)}</b> · ${cur.left}분 남음 · ${el}분째` : `루틴 끝 · 수업 ${slotLen(s) - el}분 남음`) : `${esc(t.name)} 루틴 · ${t.steps.length}단계 · ${tot}분`;
  return `<div class="today-rt" style="--c:${t.color}"><div class="tr-bar">${segs}${rest}${live ? `<i style="left:${Math.min(el / L, 1) * 100}%"></i>` : ''}</div><div class="tr-info">${info}</div></div>`;
}
/* 본수업은 하는 일이 다른 묶음별로 나눠 보여 준다 (5형식 → 입문 → 기본 → 시험 기간) */
function listHtml(rows, s) {
  if (s.kind !== 'main') return `<div class="list">${rows.map(r => card(r, s)).join('')}</div>`;
  if (s.dayType === '3800') {   // 3800 날: 단계별로 묶어서, 설명 순서대로
    const stages = [...new Set(rows.filter(r => !r.examMode && r.bk.drill).map(r => r.bk.drill))].sort((a, b) => a.localeCompare(b, 'ko'));
    const gs = stages.map((d, i) => ({ t:`${d} — 설명 ${5 + i * 10}~${15 + i * 10}분`, f:r => !r.examMode && r.bk.drill === d }));
    gs.push({ t:'3800 배부 없음', f:r => !r.examMode && !r.bk.drill }, { t:'시험대비 — 시험대비 교재', f:r => r.examMode });
    return gs.map(g => { const rs = rows.filter(g.f); return rs.length
      ? `<div class="sec">${esc(g.t)} <span>${rs.length}명</span></div><div class="list">${rs.map(r => card(r, s)).join('')}</div>` : ''; }).join('');
  }
  const groups = [
    { t:'5형식 — 테스트 없이 진도 수업', f:r => !r.examMode && r.bk.level && r.bk.level.key === '5' },
    { t:'입문 — 테스트 7분 · 대표문장 18~23분', f:r => !r.examMode && r.bk.level && r.bk.level.key === 'in' },
    { t:'기본·완성 — 테스트 10분 · 대표문장 23~28분', f:r => !r.examMode && r.bk.level && (r.bk.level.key === 'ba' || r.bk.level.key === 'wa') },
    { t:'레벨 미정 — 천문장·5형식 교재 배부 없음', f:r => !r.examMode && !r.bk.level },
    { t:'시험대비 — 시험대비 교재 풀기 · 자기 채점 · 모르는 문제 표시', f:r => r.examMode },
  ];
  return groups.map(g => { const rs = rows.filter(g.f); return rs.length
    ? `<div class="sec">${g.t} <span>${rs.length}명</span></div><div class="list">${rs.map(r => card(r, s)).join('')}</div>` : ''; }).join('');
}

function card(r, s) {
  const { st, vc, bk, sv, ex, examMode, att, due } = r;
  const flag = due >= DUE_RED ? 'flag-red' : due > 0 ? 'flag-amb' : examMode ? 'flag-exam' : '';
  const chips = [];
  if (isEl(st.group)) { if (bk.elMain) chips.push(`<span class="chip lv-el">${esc(bk.elMain)}</span>`); if (gList(s).length > 1) chips.push(`<span class="chip">${esc(st.group)}</span>`); }
  else if (bk.level) chips.push(`<span class="chip lv-${bk.level.key}">${bk.level.label}</span>`);
  if (st.school) chips.push(`<span class="chip">${esc(st.school)}</span>`);
  if (att === 'absent') chips.push('<span class="chip abs">결석</span>');
  if (att === 'late') chips.push('<span class="chip abs">지각</span>');

  const vLabel = a => a ? `${esc(a.bookName || (getBook(a.bookId) || {}).name || '')} ${esc(String(a.unitFrom ?? ''))}회` : '<span class="muted">배정 없음</span>';
  const dueTxt = due === 0 ? '<span class="due ok">밀린 것 없음</span>'
    : `<span class="due ${due >= DUE_RED ? 'red' : 'amb'}">밀린 ${due}세트</span> <span class="miss">${vc.home.due.slice(0, 4).map(a => `${esc(String(a.unitFrom ?? ''))}회 ${esc(a._r)}`).join(' · ')}${due > 4 ? ' …' : ''}</span>`;
  const clsDue = vc.cls.due.length;

  const lines = [];
  if (examMode) {
    const exTxt = `${esc(ex.p.label || '시험대비')} · ~${+ex.p.end.slice(5, 7)}/${+ex.p.end.slice(8)}${ex.left > 0 ? ` (${ex.left}일 남음)` : ' (마지막 날)'}`;
    lines.push(`<div class="row"><span class="lb">시험</span><span class="exam">${exTxt}</span>${bk.examBooks.length ? `<span>${bk.examBooks.map(esc).join(', ')}</span>` : '<span class="muted">시험대비 교재 아직 배부 안 됨</span>'}</div>`);
  }
  if (s.kind === 'el') {
    lines.push(`<div class="row"><span class="lb">교재</span><span>${bk.elBooks.length ? bk.elBooks.map(esc).join(' · ') : '<span class="muted">배부 없음</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">수업보카</span><span>${vLabel(vc.cls.cur)}</span>${clsDue ? `<span class="due amb">미통과 ${clsDue}</span>` : ''}</div>`);
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
  } else if (s.kind === 'main' && s.dayType === '3800') {
    lines.push(`<div class="row"><span class="lb">3800</span><span>${examMode ? '<span class="muted">시험대비 기간이라 쉬어요</span>' : bk.drill ? esc(bk.drill) : '<span class="muted">배부 없음</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">천문장</span><span>${bk.level ? esc(bk.level.book) : '<span class="muted">—</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
  } else if (s.kind === 'main') {
    lines.push(`<div class="row"><span class="lb">교재</span><span>${bk.level ? esc(bk.level.book) : '<span class="muted">천문장·5형식 배부 없음</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">수업보카</span><span>${vLabel(vc.cls.cur)}</span>${clsDue ? `<span class="due amb">미통과 ${clsDue}</span>` : ''}</div>`);
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
  } else if (s.kind === 'rv') {
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
    if (clsDue) lines.push(`<div class="row"><span class="lb">수업보카</span><span class="due amb">재시험 ${clsDue}</span><span class="miss">${vc.cls.due.slice(0, 3).map(a => `${esc(String(a.unitFrom ?? ''))}회`).join(' · ')}</span></div>`);
    lines.push(`<div class="row"><span class="lb">3800</span><span>${examMode ? '<span class="muted">시험대비 기간이라 쉬어요</span>' : bk.drill ? esc(bk.drill) : '<span class="muted">배부 없음</span>'}</span></div>`);
  } else {
    lines.push(`<div class="row"><span class="lb">홈보카</span><span>${vLabel(vc.home.cur)}</span></div>`);
    lines.push(`<div class="row"><span class="lb">밀린</span>${dueTxt}</div>`);
  }
  return `<div class="st ${flag} ${att === 'absent' ? 'absent' : ''}">
    <div><div class="nm">${esc(st.name)}${sv.van ? ' <span class="chip van">🚐 차량</span>' : ''}</div><div class="chips">${chips.join('')}</div></div>
    <div class="rows">${lines.join('')}</div>
  </div>`;
}

/* ══════════ 수업 패턴 설계 ══════════
   반(=시간표의 수업 칸에 들어 있는 숙제관리 앱 반, 여러 반이면 '초23+초456')마다
   요일별로 어떤 수업 종류를 할지 정한다. */
const DN = '일월화수목금토';
const isClassSlot = x => x.kind === 'main' || x.kind === 'el';
const keyOf = x => [...ttList(x)].sort((a, b) => a.localeCompare(b, 'ko', { numeric:true })).join('+');
const slotKind = x => isClassSlot(x) ? 'class' : x.kind;
const unitKey = x => isClassSlot(x) ? keyOf(x) : `${x.kind}:${keyOf(x)}${x.school ? '@' + x.school : ''}`;
const kindOfKey = k => /^(rv|word):/.test(k) ? k.split(':')[0] : 'class';
const groupsOfKey = k => k.replace(/^(rv|word):/, '').split('@')[0].split('+');
const schoolOfKey = k => k.includes('@') ? k.slice(k.indexOf('@') + 1) : '';
const keyName = k => groupsOfKey(k).join('·') + (kindOfKey(k) === 'class' ? '' : schoolOfKey(k) ? `(${schoolOfKey(k)})` : '(전체)');
const lvOfKey = k => groupsOfKey(k).every(isEl) ? 'el' : 'mid';
const tName = id => (typesNow()[id] || {}).name || '미정';
const tColor = id => (typesNow()[id] || {}).color || '#9ca3af';
function typeBadge(id, kind) {
  const c = tColor(id);
  return `<span class="k" style="background:${c}1f;color:${c}">${esc(tName(id))}${kind === 'main' && id === '3800' ? ' 날' : ''}</span>`;
}
function stepsLine(id) {
  const t = TYPES[id]; if (!t || !t.steps || !t.steps.length) return '';
  let m = 0;
  return t.steps.map(x => { const a = m; m += +x.m || 0; return `${a}~${m}분 ${esc(x.n)}`; }).join(' → ');
}
function planKeys(lv, kind) {
  const all = Object.values(TT).flat();
  const ks = new Set(all.filter(x => !kind || slotKind(x) === kind).map(unitKey));
  const first = k => Math.min(...all.filter(x => unitKey(x) === k).map(x => minutesOf(x.t)));
  return [...ks].filter(k => !lv || lvOfKey(k) === lv).sort((a, b) => (first(a) - first(b)) || a.localeCompare(b, 'ko', { numeric:true }));
}
function defType(k) {
  const kd = kindOfKey(k), lv = lvOfKey(k);
  if (kd === 'class') return lv === 'mid' ? 'chun' : '';
  const t = typeList(lv, kd)[0]; return t ? t.id : '';
}
function patOf(k) { return draft[k] || PAT[k] || DEFAULT_PAT[k] || {}; }
const effType = (k, p, d) => { const v = p['d' + d]; return v && typesNow()[v] ? v : defType(k); };
function typeOf(k, dow) { const v = (PAT[k] || DEFAULT_PAT[k] || {})['d' + dow]; return v && TYPES[v] ? v : defType(k); }   // 오늘 수업은 저장된 것만
function mainDays(k) { return [1,2,3,4,5,6].filter(d => (TT[d] || []).some(x => unitKey(x) === k)); }
function mainSlot(k, d) { return (TT[d] || []).find(x => unitKey(x) === k); }
function otherSlots(k, d, kind) { const gs = groupsOfKey(k); return (TT[d] || []).filter(x => x.kind === kind && ttList(x).some(g => gs.includes(g))); }
function normPat(k, p) { const o = {}; mainDays(k).forEach(d => { o['d' + d] = effType(k, p || {}, d); }); return o; }
function dirty(k) { return !!draft[k] && JSON.stringify(normPat(k, draft[k])) !== JSON.stringify(normPat(k, PAT[k] || DEFAULT_PAT[k] || {})); }
function gaps(days) {   // 한 주를 돌아가며 수업 사이에 비는 날 수 (주말 포함)
  const d = [...new Set(days)].sort((a, b) => a - b);
  if (!d.length) return [];
  return d.map((x, i) => ({ from:x, to: i < d.length - 1 ? d[i + 1] : d[0], n: i < d.length - 1 ? d[i + 1] - x - 1 : d[0] + 7 - x - 1 }));
}
const near = (a, b) => Math.abs(minutesOf(a) - minutesOf(b)) <= 10;
const josa = w => { const c = w.charCodeAt(w.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) || /[0-9]$/.test(w) && /[0136789]$/.test(w) ? '이' : '가'; };

/* 패턴 하나를 평가: 벌점이 낮을수록 좋음 + 이유 목록 */
function evalPattern(k, pat, opt) {
  const days = mainDays(k), notes = [], lv = lvOfKey(k), kd = kindOfKey(k);
  let pen = 0;
  const und = days.filter(d => !effType(k, pat, d));
  if (und.length) { pen += 5 * und.length; notes.push(['warn', `${und.map(d => DN[d]).join('·')}요일 수업 종류가 정해지지 않았어요`]); }
  const byType = {}; days.forEach(d => { const t = effType(k, pat, d); if (t) (byType[t] = byType[t] || []).push(d); });
  const ids = Object.keys(byType).sort((a, b) => (byType[b].length - byType[a].length) || (a === 'chun' ? -1 : b === 'chun' ? 1 : 0));
  const major = ids[0];

  // 1) 수업 종류별 간격
  ids.forEach(t => {
    const ds = byType[t], nm = tName(t);
    if (t === major && kd !== 'class') {
      notes.push(['info', `주로 ${nm} (${ds.map(d => DN[d]).join('·')})`]);
    } else if (t === major) {
      const gp = gaps(ds), mx = gp.reduce((a, b) => b.n > a.n ? b : a);
      pen += mx.n * 3 + gp.reduce((a, b) => a + b.n * b.n, 0) * 0.5;
      const pair = `${DN[mx.from]}→${DN[mx.to]}`;
      if (mx.n <= 2) notes.push(['good', `${nm} 사이 가장 긴 공백 ${mx.n}일 (${pair}) — 배운 걸 잊기 전에 다음 수업`]);
      else notes.push(['warn', `${nm}${josa(nm)} ${mx.n}일 비어요 (${pair}) — 다음 수업 때 앞 내용을 많이 잊어요`]);
    } else if (ds.length >= 2) {
      const gp = gaps(ds);
      if (gp.some(x => x.n === 0)) { pen += 2; notes.push(['warn', `${nm} 수업이 이틀 연달아 있어요 — 사이를 띄우면 복습 간격이 생겨요`]); }
      else { pen += Math.max(...gp.map(x => x.n)) * 0.5; notes.push(['good', `${nm} 주 ${ds.length}번 (${ds.map(d => DN[d]).join('·')}) — 사이를 띄워 배치`]); }
    }
    if (t === 'chun') notes.push(['info', `천문장 주 ${ds.length}번 → 88p 한 권 약 ${Math.ceil(88 / ds.length)}주`]);
  });
  if (kd === 'class' && lv === 'mid' && !byType.chun) { pen += 30; notes.push(['warn', '천문장 수업이 하루도 없어요. 테스트북 진도가 멈춰요.']); }

  // 2) 중등 3800: RV와의 관계
  const t38 = byType['3800'] || [];
  const isDrillRV = (x, d) => /3800/.test(tName(effType(unitKey(x), (peerPat && peerPat[unitKey(x)]) || patOf(unitKey(x)), d)));
  if (kd === 'class' && lv === 'mid') {
    const rvDays = [1,2,3,4,5].filter(d => otherSlots(k, d, 'rv').some(x => isDrillRV(x, d)));
    const touch = [...new Set([...t38, ...rvDays])].sort((a, b) => a - b);
    if (touch.length) {
      const gp = gaps(touch), mx = gp.reduce((a, b) => b.n > a.n ? b : a);
      pen += mx.n + gp.reduce((a, b) => a + b.n * b.n, 0) * 0.25;
      notes.push([mx.n <= 2 ? 'good' : 'info', `3800 만나는 날 ${touch.map(d => DN[d] + (t38.includes(d) ? '(수업)' : '(RV)')).join('·')} — 가장 긴 공백 ${mx.n}일`]);
    }
    if (!t38.length) notes.push(['info', '3800은 RV에서만 해요']);
    if (t38.length && !rvDays.length) { pen += 2; notes.push(['warn', 'RV에 3800 연습이 하나도 없어요 — 수업에서 배운 3800을 연습할 시간이 없어요']); }
    t38.forEach(d => {
      const m = mainSlot(k, d);
      otherSlots(k, d, 'rv').forEach(rv => {
        if (near(rv.t, m.e) || near(m.t, rv.e)) {
          if (opt.avoid90) pen += rv.school ? 2 : 4;
          notes.push(['warn', `${DN[d]} ${m.t} 3800 수업과 ${rv.t} RV가 이어져 ${rv.school ? rv.school + ' 학생은 ' : ''}3800만 90분 연속`]);
        }
      });
      const nx = otherSlots(k, d + 1, 'rv').filter(x => isDrillRV(x, d + 1));
      if (nx.length) {
        const full = nx.some(x => !x.school);
        pen -= full ? 2 : 1;
        notes.push(['good', `${DN[d]}에 배운 3800을 다음 날 ${DN[d + 1]} RV${full ? '(전체)' : `(${nx.map(x => x.school).join('·')})`}에서 바로 연습`]);
      }
    });
  }

  // RV: 3800 연습이 그 학년 3800 수업 당일·다음 날이면 연결
  if (kd === 'rv') {
    days.forEach(d => { const t = effType(k, pat, d); if (!/3800/.test(tName(t))) return;
      const cls = groupsOfKey(k).map(g => g).filter(g => [d, d - 1].some(dd => { const m = mainSlot(g, dd); return m && effType(g, (peerPat && peerPat[g]) || patOf(g), dd) === '3800' && (dd < d || minutesOf(m.t) < minutesOf(mainSlot(k, d).t)); }));
      if (cls.length) { pen -= 1; notes.push(['good', `${DN[d]} RV 3800 연습 — 바로 앞 3800 수업에서 배운 걸 연습`]); }
    });
  }
  // 3) 주 수업이 아닌 종류: 다른 반과 같은 요일이면 준비 한 번 / 너무 몰리면 경고
  ids.filter(t => t !== major).forEach(t => byType[t].forEach(d => {
    const others = planKeys().filter(x => x !== k && mainSlot(x, d) && effType(x, (peerPat && peerPat[x]) || patOf(x), d) === t);
    if (others.length) { if (opt.align) pen -= 1; notes.push(['good', `${others.map(keyName).join('·')}과 같은 ${DN[d]}요일 ${tName(t)} — 준비 한 번으로 이어서`]); }
    const load = 1 + others.length;
    if (load >= 3) { pen += 1; notes.push(['warn', `${DN[d]}요일 ${tName(t)} 수업 ${load}반 연속`]); }
  }));
  return { pen: Math.round(pen * 10) / 10, notes };
}

/* 추천: 정한 일수대로 가능한 배치를 모두 만들어 평가 */
function countsOf(k) {
  if (planCounts[k]) return planCounts[k];
  const c = {}; mainDays(k).forEach(d => { const t = effType(k, patOf(k), d); if (t) c[t] = (c[t] || 0) + 1; });
  return c;
}
function assignments(days, counts) {
  const out = [], left = { ...counts }, cur = {};
  const rec = i => {
    if (i === days.length) { if (Object.values(left).every(n => n === 0)) out.push({ ...cur }); return; }
    Object.keys(left).forEach(t => { if (left[t] > 0) { left[t]--; cur['d' + days[i]] = t; rec(i + 1); left[t]++; } });
  };
  rec(0); return out;
}
function candidates(k, opt) {
  const days = mainDays(k), counts = countsOf(k);
  if (Object.values(counts).reduce((a, b) => a + b, 0) !== days.length) return null;
  return assignments(days, counts).map(pat => ({ pat, ...evalPattern(k, pat, opt) })).sort((a, b) => a.pen - b.pen);
}
const samePat = (k, a, b) => JSON.stringify(normPat(k, a)) === JSON.stringify(normPat(k, b));

/* ══ 수업 패턴 추천 — 필요사항 입력 → 계산 → 추천 시간표 ══
   필요사항: homework_v4/todayView/planReq/<반> = { main: 주로 하는 수업, extra: { 수업종류: 주 몇 번 } } */
const REQ_PATH = FB_PATH + '/todayView/planReq';
let REQ = {};            // 저장된 필요사항
let reqDraft = {};       // 고치는 중
let recs = {};           // 추천 결과 { mid|el: { picks: { 반: { cands, i } } } }

const reqDirty = k => !!reqDraft[k] && JSON.stringify(reqDraft[k]) !== JSON.stringify(REQ[k] || null);

/* 이 반이 주로 하는 수업 추측: 저장된 패턴 → 학생 교재(Phonics/Basic) → 첫 종류 */
function guessMain(k) {
  const lv = lvOfKey(k), kd = kindOfKey(k), types = typeList(lv, kd).map(t => t.id);
  if (kd !== 'class') { const saved0 = PAT[k]; if (saved0) { const c = {}; mainDays(k).forEach(d => { const t = effType(k, saved0, d); if (t) c[t] = (c[t] || 0) + 1; }); const top = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; if (top) return top; } return defType(k); }
  const saved = PAT[k] || DEFAULT_PAT[k];
  if (saved) { const c = {}; mainDays(k).forEach(d => { const t = effType(k, saved, d); if (t) c[t] = (c[t] || 0) + 1; }); const top = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; if (top) return top; }
  if (lv === 'mid') return 'chun';
  const gs = k.split('+'), cnt = { phonics:0, basic:0 };
  D.students.filter(s => gs.includes(s.group)).forEach(s => { const m = (bookInfo(s).elMain || '').toLowerCase(); if (/^(phonics|alphabet)/.test(m)) cnt.phonics++; else if (/^(basic|story)/.test(m)) cnt.basic++; });
  const g = cnt.phonics || cnt.basic ? (cnt.phonics >= cnt.basic ? 'phonics' : 'basic') : '';

}
/* 필요사항 = { items: { 수업종류: 주 몇 번 } } — 처음엔 비어 있고 선생님이 직접 넣는다
   (예전 형식 { main, extra }는 읽을 때 items로 바꾼다) */

  if (!r) return { items:{} };
  if (r.items) return { items: { ...r.items } };
  const items = { ...(r.extra || {}) }, n = mainDays(k).length;
  const used = Object.values(items).reduce((a, b) => a + (+b || 0), 0);
  if (r.main && n - used > 0) items[r.main] = n - used;

}
const reqUsed = k => Object.entries(reqOf(k).items).filter(([t, v]) => typesNow()[t] && v > 0).reduce((a, [, v]) => a + v, 0);
function countsFromReq(k) {
  const c = {}; Object.entries(reqOf(k).items).forEach(([t, v]) => { if (typesNow()[t] && v > 0) c[t] = v; });
  return reqUsed(k) === mainDays(k).length && Object.keys(c).length ? c : null;
}

/* 모든 반을 함께 계산: 다른 반의 선택을 보면서 두 번 돌려 요일을 맞춘다 */

      picks[k] = { cands, i: 0 };

    </div>`;
  }).join('') || '<p>학생이 없어요.</p>';
  $('dlg-list').querySelectorAll('[data-van]').forEach(b => b.onclick = () => {
    const sid = b.dataset.van; saveView(sid, { van: !(VIEW[sid] || {}).van });
  });
}
