<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 수업 · 수업 패턴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --bg:#f7f6f3;--surface:#fff;--s2:#f1f0ed;--bd:#e2e1dd;
  --acc:#4f46e5;--acc-soft:#eef0fd;--grn:#059669;--grn-soft:#e7f6ef;
  --amb:#b45309;--amb-soft:#fdf3e2;--red:#dc2626;--red-soft:#fdecec;
  --tx:#1a1a1a;--mu:#6b7280;--r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* 상단 */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--bd)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.02em}
.date{display:flex;align-items:center;gap:4px;margin-left:auto}
.date button{border:1px solid var(--bd);background:var(--surface);border-radius:8px;width:32px;height:32px}
.date .d{font-weight:700;min-width:118px;text-align:center}
.date .today{width:auto;padding:0 10px;font-size:12px}
.icon-btn{border:1px solid var(--bd);background:var(--surface);border-radius:8px;height:32px;padding:0 10px;font-size:13px}
.icon-btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.sync{font-size:12px;color:var(--mu);width:100%;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.dot.ok{background:var(--grn)}.dot.err{background:var(--red)}.dot.load{background:var(--amb)}

main{max-width:980px;margin:0 auto;padding:14px 16px 60px}

/* 시간표 슬롯 */
.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.slot{flex:0 0 auto;min-width:132px;border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left}
.slot .t{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.slot .n{font-weight:700;margin-top:1px}
.slot .k{font-size:11px;margin-top:3px;display:inline-block;padding:1px 6px;border-radius:99px}
.k-main{background:var(--acc-soft);color:var(--acc)}
.k-rv{background:var(--grn-soft);color:var(--grn)}
.k-word{background:var(--amb-soft);color:var(--amb)}
.k-el{background:#fce7f3;color:#be185d}
.chip.lv-el{background:#fce7f3;color:#be185d}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px}
.tabs button.on{background:var(--tx);border-color:var(--tx);color:#fff}
.slot.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.slot.past{opacity:.55}
.slot[disabled]{cursor:default;opacity:.5}
.empty-day{padding:22px;text-align:center;color:var(--mu);background:var(--surface);border:1px dashed var(--bd);border-radius:var(--r)}

/* 요약 */
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.head h2{font-size:18px;margin:0;letter-spacing:-.02em}
.head .sub{color:var(--mu);font-size:13px}
.guide{background:var(--surface);border:1px solid var(--bd);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:8px 12px;font-size:13px;margin-bottom:10px}
.guide b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--mu)}
.stat.red .v{color:var(--red)}.stat.amb .v{color:var(--amb)}

/* 학생 카드 */
.list{display:grid;gap:8px}
.st{background:var(--surface);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:4px 14px;align-items:start}
.st.absent{opacity:.5}
.st.flag-red{border-left:4px solid var(--red)}
.st.flag-amb{border-left:4px solid var(--amb)}
.st.flag-exam{border-left:4px solid var(--acc)}
.nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--s2);color:var(--tx);white-space:nowrap}
.chip.lv-5{background:#f3e8ff;color:#7e22ce}
.chip.lv-in{background:#e0f2fe;color:#0369a1}
.chip.lv-ba{background:#dcfce7;color:#15803d}
.chip.lv-wa{background:#fef9c3;color:#a16207}
.chip.van{background:#fff7ed;color:#c2410c}
.chip.abs{background:var(--red-soft);color:var(--red)}
.rows{display:grid;gap:3px;font-size:13px}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .lb{color:var(--mu);font-size:12px;min-width:44px}
.due{font-weight:800;font-variant-numeric:tabular-nums}
.due.red{color:var(--red)}.due.amb{color:var(--amb)}.due.ok{color:var(--grn)}
.exam{color:var(--acc);font-weight:700}
.muted{color:var(--mu)}
.miss{font-size:12px;color:var(--mu)}
.sec{font-size:13px;font-weight:700;margin:16px 0 6px;color:var(--tx)}
.sec span{color:var(--mu);font-weight:400}
.nostu{padding:24px;text-align:center;color:var(--mu);background:var(--surface);border-radius:var(--r);border:1px dashed var(--bd)}
.warn{background:var(--amb-soft);color:#7c4a03;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}

/* 설정 */
dialog{border:none;border-radius:16px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-h{position:sticky;top:0;background:var(--surface);padding:14px 16px 10px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-h h3{margin:0;font-size:16px;flex:1}
.dlg-b{padding:10px 16px 18px}
.dlg-b p{margin:0 0 10px;color:var(--mu);font-size:13px}
.set-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.set-row .nm2{font-weight:700;min-width:70px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:5px 9px;font-size:12px;border-right:1px solid var(--bd)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--acc);color:#fff}
.van-t{border:1px solid var(--bd);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12px;margin-left:auto}
.van-t.on{background:#fff7ed;border-color:#fdba74;color:#c2410c;font-weight:700}
/* 수업 패턴 설계 */
.k-38{background:#ede9fe;color:#6d28d9}
.pl-head{margin:4px 0 12px}
.pl-head h2{font-size:18px;margin:0 0 2px;letter-spacing:-.02em}
.pl-head p{margin:0;color:var(--mu);font-size:13px}
.pl-groups{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pl-groups button{border:1px solid var(--bd);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:700}
.pl-groups button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pl-groups button small{font-weight:400;opacity:.8;margin-left:4px}
.pl-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.pl-card h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-card h3 .hint{font-weight:400;color:var(--mu);font-size:12px}
.wk{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:4px;font-size:12px}
.wk .h{font-weight:700;text-align:center;color:var(--mu);padding:2px 0}
.wk .rl{color:var(--mu);display:flex;align-items:center;font-size:12px}
.wk .c{min-height:40px;border-radius:8px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;gap:1px;line-height:1.25}
.wk .c.none{background:transparent;color:#c9c8c4}
.wk button.c{border:2px solid transparent;font-weight:800;font-size:13px}
.wk button.c small{font-weight:400;font-size:11px;opacity:.8}
.wk button.c.chun{background:var(--acc-soft);color:var(--acc)}
.wk button.c.d3800{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}
.wk .c.rv{background:var(--grn-soft);color:var(--grn)}
.wk .c.word{background:var(--amb-soft);color:var(--amb)}
.notes{display:grid;gap:5px;font-size:13px;margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:7px;align-items:baseline}
.notes li i{font-style:normal;flex:0 0 18px;text-align:center;font-weight:800}
.notes li.n-good i{color:var(--grn)}.notes li.n-warn i{color:var(--amb)}.notes li.n-info i{color:var(--mu)}
.notes li.n-warn span{color:#92400e}
.verdict{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.verdict .rank{font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px}
.rank.r1{background:var(--grn-soft);color:var(--grn)}.rank.r2{background:var(--amb-soft);color:var(--amb)}.rank.r3{background:var(--red-soft);color:var(--red)}
.opts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;margin-bottom:10px}
.opts label{display:flex;gap:5px;align-items:center}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.cand:first-of-type{border-top:none}
.cand .no{font-weight:800;font-size:13px;color:var(--mu);min-width:44px}
.cand .no.best{color:var(--grn)}
.strip{display:flex;gap:3px}
.strip span{width:30px;text-align:center;font-size:11px;border-radius:6px;padding:2px 0;background:var(--s2);color:#c9c8c4}
.strip span.chun{background:var(--acc-soft);color:var(--acc);font-weight:700}
.strip span.d3800{background:#ede9fe;color:#6d28d9;font-weight:800}
.cand .why{grid-column:2 / 4;font-size:12px;color:var(--mu)}
.cand .cur{font-size:11px;color:var(--grn);font-weight:700}
.savebar{position:sticky;bottom:12px;display:flex;align-items:center;gap:10px;background:#1f2937;color:#fff;border-radius:12px;padding:10px 14px;margin-top:8px}
.savebar span{flex:1;font-size:13px}
.savebar button{border:none;border-radius:8px;padding:7px 14px;font-weight:700}
.savebar .sv{background:#fff;color:#111}.savebar .rs{background:transparent;color:#d1d5db}
.load-tb{width:100%;border-collapse:collapse;font-size:13px}
.load-tb th,.load-tb td{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:top}
.load-tb th{color:var(--mu);font-weight:600;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;margin:1px 2px 1px 0}
.tag.chun{background:var(--acc-soft);color:var(--acc)}.tag.d3800{background:#ede9fe;color:#6d28d9}
@media (max-width:640px){.wk{grid-template-columns:40px repeat(5,minmax(0,1fr))}.cand{grid-template-columns:auto 1fr}.cand .act{grid-column:1 / 3}.cand .why{grid-column:1 / 3}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .st{grid-template-columns:1fr}
  .date .d{min-width:96px}
  .date{margin-left:0;width:100%;justify-content:space-between}
}
@media print{.top,.slots,.icon-btn{display:none}.st{break-inside:avoid}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <h1>더퍼스트</h1>
  <div class="tabs" id="modetabs" style="margin:0"></div>
  <div class="tabs" id="lvtabs" style="margin:0"></div>
  <button class="icon-btn" id="btn-set">차량</button>
  <button class="icon-btn" id="btn-reload" title="LMS에서 다시 불러오기">새로고침</button>
  <div class="date">
    <button id="d-prev" aria-label="전날">‹</button>
    <span class="d" id="d-label"></span>
    <button id="d-next" aria-label="다음날">›</button>
    <button class="today" id="d-today">오늘</button>
  </div>
  <div class="sync"><span class="dot load" id="sync-dot"></span><span id="sync-txt">LMS 불러오는 중…</span></div>
</div></div>

<main>
  <div class="slots" id="slots"></div>
  <div id="view"></div>
</main>

<dialog id="dlg">
  <div class="dlg-h">
    <h3>차량 설정</h3>
    <select id="dlg-group" class="icon-btn"></select>
    <button class="icon-btn pri" id="dlg-close">닫기</button>
  </div>
  <div class="dlg-b">
    <p>🚐는 밀린 숙제 처리 순서에 쓰여요. 바꾸는 즉시 저장되고 모든 기기에서 같이 보여요. 학교는 숙제관리 앱 👥 학생 관리에서 넣으면 여기·RV·단어 시간 명단·시험대비 기간에 모두 쓰여요.</p>
    <div id="dlg-list"></div>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   오늘 수업 화면 — 더퍼스트학원
   · LMS(숙제관리 v456~)의 Firebase 데이터를 "읽기만" 한다.
   · 학교·반·시험대비 기간은 LMS가 기준 — 학교는 LMS 👥 학생 관리, 시험대비 기간은 LMS 📅 학원 일정 → 🏫 학교 시험대비 기간.
   · 이 화면에서 저장하는 것은 차량·수업 패턴·시간표 반 연결뿐이고,
     LMS가 쓰지 않는 별도 경로 homework_v4/todayView 에만 저장한다.
   ══════════════════════════════════════════════════════════ */
const DB_URL  = 'https://sotong-academy-default-rtdb.asia-southeast1.firebasedatabase.app';
const FB_PATH = 'homework_v4';
const VIEW_PATH = FB_PATH + '/todayView/students';
const READ_KEYS = ['students', 'books', 'assigns', 'schoolEvents', 'classDaysByGroup', 'attendance', '_tomb', 'groups', 'classPauses'];
const MAP_PATH = FB_PATH + '/todayView/groupMap';   // 시간표 반 이름 → LMS 반 이름

/* 시간표의 school 값('신탄'·'대청'·'중앙')은 LMS 학교 이름에 들어 있는 글자로 맞춘다 (예: '대청' → LMS '대청중') */
const schoolHit = (stSchool, key) => !!stSchool && !!key && String(stSchool).replace(/\s+/g, '').includes(key);
const DUE_RED = 3;         // 밀린 홈보카 이 개수 이상이면 원장님 보고

/* 영어 시간표 (중등) — 시간표가 바뀌면 여기만 고치면 됩니다.
   kind: main 본수업 · rv RV 자습 · word 단어 시간 / school: '' = 학년 전체 */
const TT = {
  1: [ // 월
    { t:'5:20', e:'6:05', room:'2강', kind:'rv',   g:'중1', school:'' },
    { t:'6:10', e:'6:55', room:'1강', kind:'main', g:'중1' },
    { t:'6:10', e:'6:55', room:'2강', kind:'word', g:'중2', school:'대청' },
    { t:'7:00', e:'7:45', room:'1강', kind:'main', g:'중2' },
    { t:'7:00', e:'7:45', room:'2강', kind:'rv',   g:'중3', school:'' },
  ],
  2: [ // 화
    { t:'5:20', e:'6:05', room:'2강', kind:'rv',   g:'중2', school:'중앙' },
    { t:'5:20', e:'6:05', room:'2강', kind:'rv',   g:'중3', school:'' },
    { t:'6:10', e:'6:55', room:'1강', kind:'main', g:'중1' },
    { t:'6:10', e:'6:55', room:'2강', kind:'word', g:'중2', school:'중앙' },
    { t:'7:00', e:'7:45', room:'1강', kind:'main', g:'중3' },
  ],
  3: [ // 수
    { t:'5:20', e:'6:05', room:'1강', kind:'main', g:'중3' },
    { t:'6:10', e:'6:55', room:'1강', kind:'main', g:'중1' },
    { t:'7:00', e:'7:45', room:'1강', kind:'main', g:'중2' },
    { t:'8:25', e:'9:10', room:'2강', kind:'word', g:'중3', school:'대청' },
  ],
  4: [ // 목
    { t:'5:20', e:'6:05', room:'1강', kind:'main', g:'중3' },
    { t:'6:10', e:'6:55', room:'1강', kind:'main', g:'중2' },
    { t:'7:00', e:'7:45', room:'2강', kind:'rv',   g:'중2', school:'' },
    { t:'7:00', e:'7:45', room:'2강', kind:'rv',   g:'중3', school:'대청' },
    { t:'7:00', e:'7:45', room:'2강', kind:'word', g:'중3', school:'신탄' },
  ],
  5: [ // 금
    { t:'5:20', e:'6:05', room:'1강', kind:'main', g:'중3' },
    { t:'5:20', e:'6:05', room:'2강', kind:'rv',   g:'중2', school:'신탄' },
    { t:'6:10', e:'6:55', room:'1강', kind:'main', g:'중1' },
    { t:'6:10', e:'6:55', room:'2강', kind:'rv',   g:'중2', school:'대청' },
    { t:'6:10', e:'6:55', room:'2강', kind:'word', g:'중2', school:'신탄' },
    { t:'7:00', e:'7:45', room:'1강', kind:'main', g:'중2' },
    { t:'7:00', e:'7:45', room:'2강', kind:'rv',   g:'중1', school:'' },
    { t:'8:25', e:'9:10', room:'2강', kind:'rv',   g:'중3', school:'' },
  ],
};
/* 초등 (월~금 매일 같음) — g: 시간표 반 이름(여러 반이면 배열), label: 시간표 표기
   ※ 시간표 반 이름이 LMS에 없으면 화면에서 LMS 반을 골라 연결한다(GMAP) */
const TT_EL = [
  { t:'2:15', e:'3:00', room:'1강', kind:'el',   g:['초2'],                 label:'초2(P)' },
  { t:'3:05', e:'3:25', room:'2강', kind:'word', g:['초6'],                 label:'영단어(초6)' },
  { t:'3:05', e:'3:50', room:'1강', kind:'el',   g:['초124'],               label:'초124' },
  { t:'3:25', e:'4:10', room:'1강', kind:'el',   g:['초23'],                label:'초2,3(P4)' },
  { t:'3:25', e:'4:10', room:'2강', kind:'el',   g:['초456'],               label:'초4,5,6(B)' },
  { t:'4:10', e:'4:30', room:'1·2강', kind:'word', g:['초23','초456','초56'], label:'영단어(초2,3,4,5)' },
  { t:'4:30', e:'5:15', room:'1강', kind:'el',   g:['초56'],                label:'초5' },
  { t:'4:30', e:'5:15', room:'2강', kind:'el',   g:['초6'],                 label:'초6' },
];
[1,2,3,4,5].forEach(d => { TT[d] = [...TT_EL, ...TT[d]]; });

const KIND = {
  el:   { label:'초등수업', cls:'k-el' },

   저장 위치: homework_v4/todayView/patterns/<반> = { d1:'chun', d3:'3800', … }  (d+요일번호, 1=월) */

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayStr(d) { const t = d || new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return todayStr(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function dowOf(s) { return new Date(s + 'T00:00:00').getDay(); }
function toArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v.filter(x => x != null);
  if (typeof v !== 'object') return [];
  return Object.keys(v).map(k => v[k]).filter(x => x != null);
}
function minutesOf(t) { const [h, m] = t.split(':').map(Number); return (h < 12 ? h + 12 : h) * 60 + m; }   // 오후 시간표
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800); }
function setSync(state, txt) { $('sync-dot').className = 'dot ' + state; $('sync-txt').textContent = txt; }

/* ── Firebase REST (읽기) ── */
async function getJSON(path) {
  const r = await fetch(`${DB_URL}/${path}.json`, { cache:'no-store' });
  if (!r.ok) throw new Error(`${path} ${r.status}`);
  return r.json();
}
async function load() {
  setSync('load', 'LMS 불러오는 중…');
  try {
    const vals = await Promise.all([...READ_KEYS.map(k => getJSON(`${FB_PATH}/${k}`)), getJSON(VIEW_PATH), getJSON(PAT_PATH), getJSON(MAP_PATH)]);
    PAT = vals[READ_KEYS.length + 1] || {};
    GMAP = vals[READ_KEYS.length + 2] || {};
    Object.keys(PAT).forEach(g => { if (!dirty(g)) draft[g] = { ...PAT[g] }; });
    const raw = {}; READ_KEYS.forEach((k, i) => raw[k] = vals[i]);
    const tomb = new Set(Object.keys((raw._tomb && raw._tomb.students) || {}).map(String));
    const students = toArr(raw.students).filter(s => s && s.id != null && !tomb.has(String(s.id)));
    D = {
      students,
      books: toArr(raw.books).filter(b => b && b.id != null),
      assigns: toArr(raw.assigns).filter(a => a && a.id != null && !tomb.has(String(a.studentId))),
      schoolEvents: toArr(raw.schoolEvents),
      classDaysByGroup: toArr(raw.classDaysByGroup),
      attendance: toArr(raw.attendance),
      // LMS 학교 시험대비 기간 (classPauses 중 school 이 있는 것)
      prep: toArr(raw.classPauses).filter(p => p && p.school && p.start && p.end),
    };
    D.lmsGroups = [...new Set([...toArr(raw.groups).map(String), ...students.map(s => s.group).filter(Boolean)])];
    D.bookById = new Map(D.books.map(b => [Number(b.id), b]));
    VIEW = vals[READ_KEYS.length] || {};
    const t = new Date();
    setSync('ok', `LMS 연결됨 · ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')} 기준 · 학생 ${students.length}명`);
  } catch (e) {
    console.error(e);
    setSync('err', 'LMS에 연결하지 못했어요 — 인터넷 연결을 확인하고 새로고침을 눌러 주세요');
  }
  render();
}

/* ══ LMS 판정 로직 (index_v451의 미완료 확인과 같은 규칙) ══ */
const getBook = id => D.bookById.get(Number(id)) || null;
function sameCategory(recCat, cat) { if (cat == null) return true; if (!recCat) return true; return recCat === cat; }
function cohortDone(st, a) {
  const list = st.completedBooks; if (!Array.isArray(list) || !list.length) return false;
  const book = getBook(a.bookId), cohort = a.cohort || '';
  const isVoca = book && book.mode === 'voca';
  const cat = isVoca ? (a.category || '수업보카') : null;
  return list.some(c => c
    && ((c.bookId != null) ? c.bookId === a.bookId : (book ? c.bookName === book.name : c.bookName === a.bookName))
    && (c.cohort || '') === cohort && (!isVoca || sameCategory(c.category, cat)));
}
function incompleteReason(book, result, group, assignDate, until) {
  const has = result !== '' && result !== null && result !== undefined;
  if (!has) return (assignDate && assignDate >= until) ? null : '미수행';
  if (!book) return null;
  if (result === '미수행') return '미수행';
  if (book.score === '통과' && result !== '통과') return '미통과';
  if (book.score === '완료' && result !== '완료') return '미수행';
  if (book.score === '점수') {
    const cfg = book.classThresholds && book.classThresholds[group];
    if (cfg && cfg.enabled) {
      const n = Number(result), th = cfg.threshold != null ? Number(cfg.threshold) : 80;
      if (!isNaN(n) && n < th) return `${n}점`;
    }
  }
  return null;
}
function dedupeVoca(list) {
  const latest = new Map(), others = [];
  list.forEach(a => {
    const book = getBook(a.bookId);
    if ((book ? book.mode : a.type) !== 'voca') { others.push(a); return; }
    const key = `${a.bookId}:${String(Number(a.unitFrom))}:${a.cohort||''}:${a.category||''}`;
    const ex = latest.get(key);
    if (!ex || a.date > ex.date) latest.set(key, a);
  });
  return [...others, ...latest.values()];
}
/* 학생의 보카 숙제: 밀린 것(기준일 전날까지) + 지금 하는 것 */
function vocaInfo(st, until) {
  const mine = D.assigns.filter(a => a.studentId === st.id && a.date && a.date <= until);
  const out = { home: { due: [], cur: null }, cls: { due: [], cur: null } };
  dedupeVoca(mine).forEach(a => {
    const book = getBook(a.bookId);
    if ((book ? book.mode : a.type) !== 'voca') return;
    const slot = (a.category || '수업보카') === '홈보카' ? out.home : out.cls;
    if (!slot.cur || a.date > slot.cur.date || (a.date === slot.cur.date && Number(a.unitFrom) > Number(slot.cur.unitFrom))) slot.cur = a;
    if (cohortDone(st, a)) return;
    const r = incompleteReason(book, a.result, st.group, a.date, until);
    if (r) slot.due.push({ ...a, _r: r });
  });
  out.home.due.sort((x, y) => x.date.localeCompare(y.date));
  out.cls.due.sort((x, y) => x.date.localeCompare(y.date));
  return out;
}
/* 지금 배부된 교재로 레벨·3800·시험대비 교재 판단 */
function bookInfo(st) {
  const names = (st.books || []).map(String);
  const done = new Set((st.completedBooks || []).filter(c => c && !c.cohort).map(c => c.bookName));
  const active = names.filter(n => !done.has(n));
  const n = s => s.replace(/\s+/g, '');
  let level = null;
  const lv = [
    { re:/천문장완성/, key:'wa', label:'완성' },
    { re:/천문장기본/, key:'ba', label:'기본' },
    { re:/천문장입문/, key:'in', label:'입문' },
    { re:/^5형식/,     key:'5',  label:'5형식' },
  ];
  for (const L of lv) {
    const hit = active.find(x => L.re.test(n(x)) && !/home|단어/i.test(n(x)));
    if (hit) { level = { ...L, book: hit }; break; }
  }
  const drill = active.find(x => /3800\s*드릴/.test(x));
  const examBooks = active.filter(x => {
    const b = D.books.find(bb => bb.name === x);
    return (b && b.extra) || /(중간|기말)/.test(x);
  });
  // 초등: 지금 하는 교재(보카·단기 교재 제외)
  const elBooks = active.filter(x => { const b = D.books.find(bb => bb.name === x); return b && b.mode !== 'voca' && !b.extra; });
  const mainRe = /^(alphabet|phonics|story|basic)\s*\d+$/i;
  const elMain = elBooks.find(x => mainRe.test(x.trim())) || null;
  return { level, drill, examBooks, elBooks, elMain };
}
/* 시험대비 기간: LMS 📅 학원 일정 → 🏫 학교 시험대비 기간에 등록한 것 (그 학생 학교 + 반) */
function examFor(st, date) {
  if (!st || !st.school) return null;
  const p = D.prep.find(p => p.school === st.school && (!Array.isArray(p.groups) || !p.groups.length || p.groups.includes(st.group)) && date >= p.start && date <= p.end);
  return p ? { p, left: daysBetween(date, p.end) } : null;
}
function attendOf(sid, date) {
  const r = D.attendance.find(x => x && x.studentId === sid && x.date === date);
  return r ? r.status : 'present';
}
function groupDays(g) {
  const r = D.classDaysByGroup.find(x => x && x.g === g);
  return r && r.d && r.d.length ? r.d : null;
}

/* ══ 화면 ══ */
const isEl = g => /^초/.test(String(g));
const ttList = s => Array.isArray(s.g) ? s.g : [s.g];
/* 시간표 반 → LMS 반 (LMS에 같은 이름이 있으면 그대로, 없으면 연결해 둔 반) */
const gMap = g => (D && D.lmsGroups.includes(g)) ? [g] : (Array.isArray(GMAP[g]) ? GMAP[g] : GMAP[g] ? [GMAP[g]] : []);
const gList = s => [...new Set(ttList(s).flatMap(g => D ? gMap(g) : [g]))];
const missingTT = s => D ? ttList(s).filter(g => !gMap(g).length) : [];
const slotName = s => s.label || (ttList(s).join('·') + (s.school ? `(${s.school})` : (s.kind === 'main' ? '' : '(전체)')));
let level = 'mid';   // 'el' 초등 | 'mid' 중등
function slotsOf(date) { return (TT[dowOf(date)] || []).map((s, i) => ({ ...s, i })).filter(s => (s.kind === 'el' || ttList(s).every(isEl)) === (level === 'el')); }
function slotStudents(s) {
  const gs = gList(s);
  const all = D.students.filter(st => gs.includes(st.group));
  if (!s.school) return { list: all, unset: [] };
  return {
    list: all.filter(st => schoolHit(st.school, s.school)),
    unset: all.filter(st => !st.school),
  };
}
function pickDefaultSlot(slots) {
  if (!slots.length) return null;
  if (curDate !== todayStr()) return slots[0].i;
  // 지금 진행 중인 칸 → 없으면 다음 칸 → 다 끝났으면 마지막 칸
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  const live = slots.find(s => minutesOf(s.e) > m);
  return (live || slots[slots.length - 1]).i;
}

function render() {
  $('modetabs').innerHTML = `<button class="${mode === 'today' ? 'on' : ''}" data-m="today">오늘 수업</button><button class="${mode === 'plan' ? 'on' : ''}" data-m="plan">수업 패턴</button>`;
  $('modetabs').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
  document.querySelector('.date').style.display = mode === 'plan' ? 'none' : '';
  $('lvtabs').style.display = mode === 'plan' ? 'none' : '';
  $('slots').style.display = mode === 'plan' ? 'none' : '';
  if (mode === 'plan') { $('view').innerHTML = planView(); bindPlan(); return; }
  const dow = dowOf(curDate), dn = '일월화수목금토'[dow];
  const [y, mo, d] = curDate.split('-');
  $('d-label').textContent = `${+mo}월 ${+d}일 (${dn})${curDate === todayStr() ? ' · 오늘' : ''}`;
  const slots = slotsOf(curDate);
  if (curSlot == null || !slots.some(s => s.i === curSlot)) curSlot = pickDefaultSlot(slots);

  const nowM = (() => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); })();
  $('lvtabs').innerHTML = `<button class="${level === 'el' ? 'on' : ''}" data-lv="el">초등</button><button class="${level === 'mid' ? 'on' : ''}" data-lv="mid">중등</button>`;
  $('slots').innerHTML = slots.map(s => {
    const past = curDate === todayStr() && minutesOf(s.e) <= nowM;
    return `<button class="slot ${s.i === curSlot ? 'on' : ''} ${past ? 'past' : ''}" data-i="${s.i}">
      <div class="t">${s.t}~${s.e} · ${s.room}</div>
      <div class="n">${esc(slotName(s))}</div>
      ${s.kind === 'main' && typeOf(s.g, dow) === '3800' ? '<span class="k k-38">3800 날</span>' : `<span class="k ${KIND[s.kind].cls}">${KIND[s.kind].label}</span>`}
    </button>`;
  }).join('');
  $('slots').querySelectorAll('.slot').forEach(b => b.onclick = () => { curSlot = +b.dataset.i; render(); });
  $('lvtabs').querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { level = b.dataset.lv; curSlot = null; render(); });
  const on = $('slots').querySelector('.slot.on');
  if (on) { const box = $('slots'); box.scrollLeft = on.offsetLeft - box.offsetLeft - 8; }

  const v = $('view');
  if (!slots.length) { v.innerHTML = `<div class="empty-day" style="margin-top:14px">${dn}요일에는 ${level === 'el' ? '초등' : '중등'} 영어 수업이 없어요.</div>`; return; }
  if (!D) { v.innerHTML = ''; return; }
  const s = slots.find(x => x.i === curSlot);
  s.dayType = s.kind === 'main' ? typeOf(s.g, dow) : null;
  v.innerHTML = slotView(s);
  v.querySelectorAll('[data-mapsave]').forEach(b => b.onclick = () => {
    const g = b.dataset.mapsave, pick = [...v.querySelectorAll(`[data-map="${CSS.escape(g)}"]:checked`)].map(x => x.value);
    if (!pick.length) { toast('반을 하나 이상 골라 주세요'); return; }
    saveMap(g, pick);
  });
}
async function saveMap(g, pick) {
  GMAP[g] = pick; render();
  try {
    const r = await fetch(`${DB_URL}/${MAP_PATH}/${encodeURIComponent(g)}.json`, { method:'PUT', body: JSON.stringify(pick) });
    if (!r.ok) throw new Error(r.status);
    toast(`${g} → ${pick.join('·')} 연결했어요`);
  } catch (e) { toast('저장하지 못했어요 — 다시 눌러 주세요'); }
}

function slotView(s) {
  const { list, unset } = slotStudents(s);
  const until = curDate;
  const rows = list.map(st => {
    const vc = vocaInfo(st, until), bk = bookInfo(st), sv = VIEW[st.id] || {};
    const ex = examFor(st, curDate);
    const examMode = !!ex;   // 시험대비 기간 안에서만 (기간이 끝나면 시험대비 교재가 남아 있어도 원래 수업으로)
    return { st, vc, bk, sv, ex, examMode, att: attendOf(st.id, curDate), due: vc.home.due.length };
  });

  // 정렬: 본수업 = 레벨순, RV·단어 = 챙길 학생 먼저 (밀린 숙제 많은 순 → 차량)
  const lvOrder = { '5':0, in:1, ba:2, wa:3 };
  const bookKey = r => { const m = (r.bk.elMain || '').match(/^(\D+?)\s*(\d+)/); const o = { alphabet:0, phonics:1, story:2, basic:3 }; return m ? (o[m[1].toLowerCase()] ?? 5) * 100 + +m[2] : 999; };
  if (s.kind === 'el') rows.sort((a, b) => (bookKey(a) - bookKey(b)) || a.st.name.localeCompare(b.st.name, 'ko'));
  else if (s.kind === 'main') rows.sort((a, b) => ((lvOrder[a.bk.level && a.bk.level.key] ?? 9) - (lvOrder[b.bk.level && b.bk.level.key] ?? 9)) || a.st.name.localeCompare(b.st.name, 'ko'));
  else rows.sort((a, b) => (b.due - a.due) || ((b.sv.van ? 1 : 0) - (a.sv.van ? 1 : 0)) || a.st.name.localeCompare(b.st.name, 'ko'));

  const nDue = rows.filter(r => r.due > 0).length, nRed = rows.filter(r => r.due >= DUE_RED).length;
  const nVan = rows.filter(r => r.sv.van).length, nExam = rows.filter(r => r.examMode).length;
  const lvCount = k => rows.filter(r => !r.examMode && r.bk.level && r.bk.level.key === k).length;

  const scName = s.school ? ([...new Set(D.students.map(x => x.school).filter(x => schoolHit(x, s.school)))][0] || s.school) : '';
  const sc = s.label ? '' : s.school ? `(${scName})` : (s.kind === 'main' ? '' : '(전체)');
  const title = s.label ? s.label : `${ttList(s).join('·')}${sc}`;
  const lmsNames = gList(s).join(' + ');
  const miss = missingTT(s);
  const daysNote = (() => { if (gList(s).length > 1) return ''; const gd = groupDays(gList(s)[0]); return gd ? `LMS 수업 요일 ${gd.map(x => '일월화수목금토'[x]).join('·')}` : ''; })();

  let guide = '';
  if (s.kind === 'el') {
    guide = `<b>초등 수업</b> · 수업 시작 전에 밀린 홈보카 학생을 먼저 확인하세요. 3세트 이상 밀린 학생은 원장님께 보고.`;
  } else if (s.kind === 'main' && s.dayType === '3800') {
    guide = `<b>3800 날 45분</b> · 0~5분 포스트잇 학생은 천문장 고치기, 나머지는 지난 페이지 수업보카 복습 → 5~35분 각자 자기 3800 단계 풀기 + 단계별로 10분씩 돌아가며 설명 (보조샘은 반복 확인·초기화) → 35~42분 막힌 문제 질문 → 숙제 안내. 천문장 테스트는 쉬어요.`;
    if (nExam) guide += ` <b>시험대비 ${nExam}명</b>은 이날도 시험대비 교재.`;
  } else if (s.kind === 'main') {
    guide = `<b>본수업 45분</b> · 0~5분 수업보카(어제+오늘 p) → 테스트(입문 7분·기본 10분) → 채점 → 대표문장(입문·기본 5분씩) → 오답 고치기. 5형식 학생은 테스트 시간에 진도 수업.`
      + (lvCount('in') && lvCount('ba') ? '' : ' 오늘은 한 레벨만 있어 대표문장 10분.');
    if (nExam) guide += ` <b>시험대비 ${nExam}명</b>은 천문장 대신 시험대비 교재.`;
  } else if (s.kind === 'rv') {
    guide = `<b>RV 순서</b> · 밀린 홈보카 먼저(차량 학생 20분, 그 밖 10분) → 3800. 못 끝내면 차량은 다음 회차, 그 밖은 하원 전 15분.`;
    if (nExam) guide += ` <b>시험대비 ${nExam}명</b>은 3800 대신 시험 대비.`;
  } else {
    guide = `<b>단어 시간</b> · 홈보카 범위를 단어장으로 시험. 클래스카드를 안 한 학생은 그 자리에서 홈보카 먼저.`;
    if (nExam) guide += ` <b>시험대비 ${nExam}명</b>은 시험범위 단어.`;
  }

  const allG = [...D.lmsGroups].sort((a, b) => a.localeCompare(b, 'ko'));
  const mapWarn = miss.map(g => `<div class="warn">시간표의 <b>${esc(g)}</b> 반이 숙제관리 앱에 없어요. 이 시간에 오는 숙제관리 앱의 반을 골라 주세요:
      <span style="display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:6px">${allG.map(x => `<label style="font-size:13px;white-space:nowrap"><input type="checkbox" data-map="${esc(g)}" value="${esc(x)}"> ${esc(x)}</label>`).join('')}</span>
      <button class="icon-btn pri" data-mapsave="${esc(g)}" style="margin-left:6px">연결</button></div>`).join('');
  const warn = mapWarn + (s.school && unset.length
    ? `<div class="warn">학교가 비어 있는 ${esc(gList(s).join(', '))} 학생 ${unset.length}명은 이 명단에 안 나와요 (${unset.map(x => esc(x.name)).join(', ')}). 숙제관리 앱 👥 학생 관리에서 학교를 넣어 주세요.</div>` : '');

  const stats = s.kind === 'main'
    ? [[rows.length, '명'], [rows.length - nExam, '천문장·5형식'], [nExam, '시험대비'], [nDue, '밀린 홈보카', nDue ? 'amb' : '']]
    : (s.kind === 'el' || gList(s).every(isEl)) ? [[rows.length, '명'], [nDue, '밀린 홈보카 학생', nDue ? 'amb' : ''], [nRed, `${DUE_RED}세트 이상 · 원장님 보고`, nRed ? 'red' : ''], [nVan, '🚐 차량']]
    : [[nDue, '밀린 홈보카 학생', nDue ? 'amb' : ''], [nRed, `${DUE_RED}세트 이상 · 원장님 보고`, nRed ? 'red' : ''], [nVan, '🚐 차량'], [nExam, '시험대비']];

  return `
    <div class="head"><h2>${esc(title)} ${s.label ? '' : KIND[s.kind].label}${s.dayType === '3800' ? ' · 3800 날' : ''}</h2>
      <span class="sub">${s.t}~${s.e} · ${s.room} · ${rows.length}명${s.label ? ' · LMS ' + esc(lmsNames) + '반' : ''}${daysNote ? ' · ' + daysNote : ''}</span></div>
    <div class="guide">${guide}</div>
    ${warn}
    <div class="stats">${stats.map(([v, l, c]) => `<div class="stat ${c || ''}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    ${rows.length ? listHtml(rows, s) : `<div class="nostu">이 시간 명단이 비어 있어요.${s.school ? ' 숙제관리 앱 👥 학생 관리에서 학교를 넣어 주세요.' : ''}</div>`}`;
}

/* 본수업은 하는 일이 다른 묶음별로 나눠 보여 준다 (5형식 → 입문 → 기본 → 시험 기간) */
function listHtml(rows, s) {
  if (s.kind !== 'main') return `<div class="list">${rows.map(r => card(r, s)).join('')}</div>`;
  if (s.dayType === '3800') {   // 3800 날: 단계별로 묶어서, 설명 순서대로
    const stages = [...new Set(rows.filter(r => !r.examMode && r.bk.drill).map(r => r.bk.drill))].sort((a, b) => a.localeCompare(b, 'ko'));
    const gs = stages.map((d, i) => ({ t:`${d} — 설명 ${5 + i * 10}~${15 + i * 10}분`, f:r => !r.examMode && r.bk.drill === d }));
    gs.push({ t:'3800 배부 없음', f:r => !r.examMode && !r.bk.drill }, { t:'시험대비 — 시험대비 교재', f:r => r.examMode });
    return gs.map(g => { const rs = rows.filter(g.f); return rs.length
      ? `<div class="sec">${esc(g.t)} <span>${rs.length}명</span></div><div class="list">${rs.map(r => card(r, s)).join('')}</div>` : ''; }).join('');
  }
  const groups = [
    { t:'5형식 — 테스트 없이 진도 수업', f:r => !r.examMode && r.bk.level && r.bk.level.key === '5' },
    { t:'입문 — 테스트 7분 · 대표문장 18~23분', f:r => !r.examMode && r.bk.level && r.bk.level.key === 'in' },
    { t:'기본·완성 — 테스트 10분 · 대표문장 23~28분', f:r => !r.examMode && r.bk.level && (r.bk.level.key === 'ba' || r.bk.level.key === 'wa') },
    { t:'레벨 미정 — 천문장·5형식 교재 배부 없음', f:r => !r.examMode && !r.bk.level },
    { t:'시험대비 — 시험대비 교재 풀기 · 자기 채점 · 모르는 문제 표시', f:r => r.examMode },
  ];
  return groups.map(g => { const rs = rows.filter(g.f); return rs.length
    ? `<div class="sec">${g.t} <span>${rs.length}명</span></div><div class="list">${rs.map(r => card(r, s)).join('')}</div>` : ''; }).join('');
}

function card(r, s) {
  const { st, vc, bk, sv, ex, examMode, att, due } = r;

  else if (bk.level) chips.push(`<span class="chip lv-${bk.level.key}">${bk.level.label}</span>`);
  if (st.school) chips.push(`<span class="chip">${esc(st.school)}</span>`);

  const dueTxt = due === 0 ? '<span class="due ok">밀린 것 없음</span>'

  const clsDue = vc.cls.due.length;

  const lines = [];
  if (examMode) {
    const exTxt = `${esc(ex.p.label || '시험대비')} · ~${+ex.p.end.slice(5, 7)}/${+ex.p.end.slice(8)}${ex.left > 0 ? ` (${ex.left}일 남음)` : ' (마지막 날)'}`;
    lines.push(`<div class="row"><span class="lb">시험</span><span class="exam">${exTxt}</span>${bk.examBooks.length ? `<span>${bk.examBooks.map(esc).join(', ')}</span>` : '<span class="muted">시험대비 교재 아직 배부 안 됨</span>'}</div>`);
  }
  if (s.kind === 'el') {
    lines.push(`<div class="row"><span class="lb">교재</span><span>${bk.elBooks.length ? bk.elBooks.map(esc).join(' · ') : '<span class="muted">배부 없음</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">수업보카</span><span>${vLabel(vc.cls.cur)}</span>${clsDue ? `<span class="due amb">미통과 ${clsDue}</span>` : ''}</div>`);
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
  } else if (s.kind === 'main' && s.dayType === '3800') {
    lines.push(`<div class="row"><span class="lb">3800</span><span>${examMode ? '<span class="muted">시험대비 기간이라 쉬어요</span>' : bk.drill ? esc(bk.drill) : '<span class="muted">배부 없음</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">천문장</span><span>${bk.level ? esc(bk.level.book) : '<span class="muted">—</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
  } else if (s.kind === 'main') {
    lines.push(`<div class="row"><span class="lb">교재</span><span>${bk.level ? esc(bk.level.book) : '<span class="muted">천문장·5형식 배부 없음</span>'}</span></div>`);
    lines.push(`<div class="row"><span class="lb">수업보카</span><span>${vLabel(vc.cls.cur)}</span>${clsDue ? `<span class="due amb">미통과 ${clsDue}</span>` : ''}</div>`);
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
  } else if (s.kind === 'rv') {
    lines.push(`<div class="row"><span class="lb">홈보카</span>${dueTxt}</div>`);
    if (clsDue) lines.push(`<div class="row"><span class="lb">수업보카</span><span class="due amb">재시험 ${clsDue}</span><span class="miss">${vc.cls.due.slice(0, 3).map(a => `${esc(String(a.unitFrom ?? ''))}회`).join(' · ')}</span></div>`);
    lines.push(`<div class="row"><span class="lb">3800</span><span>${examMode ? '<span class="muted">시험대비 기간이라 쉬어요</span>' : bk.drill ? esc(bk.drill) : '<span class="muted">배부 없음</span>'}</span></div>`);
  } else {
    lines.push(`<div class="row"><span class="lb">홈보카</span><span>${vLabel(vc.home.cur)}</span></div>`);
    lines.push(`<div class="row"><span class="lb">밀린</span>${dueTxt}</div>`);
  }
  return `<div class="st ${flag} ${att === 'absent' ? 'absent' : ''}">
    <div><div class="nm">${esc(st.name)}${sv.van ? ' <span class="chip van">🚐 차량</span>' : ''}</div><div class="chips">${chips.join('')}</div></div>
    <div class="rows">${lines.join('')}</div>
  </div>`;
}

/* ══════════ 수업 패턴 설계 ══════════ */
const DN = '일월화수목금토';
function midGroups() { return [...new Set(Object.values(TT).flat().filter(x => x.kind === 'main').map(x => x.g))].sort(); }
function patOf(g) { return draft[g] || PAT[g] || DEFAULT_PAT[g] || {}; }
function typeOf(g, dow) { return (PAT[g] || DEFAULT_PAT[g] || {})['d' + dow] || 'chun'; }   // 오늘 수업 화면은 저장된 것만
function dirty(g) { return !!draft[g] && JSON.stringify(normPat(g, draft[g])) !== JSON.stringify(normPat(g, PAT[g] || DEFAULT_PAT[g] || {})); }
function normPat(g, p) { const o = {}; mainDays(g).forEach(d => { o['d' + d] = p['d' + d] || 'chun'; }); return o; }
function mainDays(g) { return [1,2,3,4,5].filter(d => (TT[d] || []).some(x => x.kind === 'main' && x.g === g)); }
function mainSlot(g, d) { return (TT[d] || []).find(x => x.kind === 'main' && x.g === g); }
function otherSlots(g, d, kind) { return (TT[d] || []).filter(x => x.kind === kind && x.g === g); }
function gaps(days) {   // 한 주를 돌아가며 수업 사이에 비는 날 수 (주말 포함)
  const d = [...new Set(days)].sort((a, b) => a - b);
  if (!d.length) return [];
  return d.map((x, i) => ({ from:x, to: i < d.length - 1 ? d[i + 1] : d[0], n: i < d.length - 1 ? d[i + 1] - x - 1 : d[0] + 7 - x - 1 }));
}
const near = (a, b) => Math.abs(minutesOf(a) - minutesOf(b)) <= 10;

/* 패턴 하나를 평가: 벌점이 낮을수록 좋음 + 이유 목록 */
function evalPattern(g, pat, opt) {
  const days = mainDays(g), notes = [];
  const chun = days.filter(d => (pat['d' + d] || 'chun') === 'chun');
  const t38 = days.filter(d => pat['d' + d] === '3800');
  let pen = 0;

  // 1) 천문장 간격
  if (!chun.length) { pen += 30; notes.push(['warn', '천문장 수업이 하루도 없어요. 테스트북 진도가 멈춰요.']); }
  else {
    const gp = gaps(chun), mx = gp.reduce((a, b) => b.n > a.n ? b : a);
    pen += mx.n * 3 + gp.reduce((a, b) => a + b.n * b.n, 0) * 0.5;
    const pair = `${DN[mx.from]}→${DN[mx.to]}`;
    if (mx.n <= 2) notes.push(['good', `천문장 사이 가장 긴 공백 ${mx.n}일 (${pair}) — 단어·포인트를 잊기 전에 다음 테스트`]);
    else notes.push(['warn', `천문장이 ${mx.n}일 비어요 (${pair}) — 다음 테스트 때 앞 내용을 많이 잊어요`]);
    notes.push(['info', `천문장 주 ${chun.length}번 → 88p 한 권 약 ${Math.ceil(88 / chun.length)}주`]);
  }

  // 2) 3800을 만나는 날 (3800 수업 + RV)
  const rvDays = days.length ? [1,2,3,4,5].filter(d => otherSlots(g, d, 'rv').length) : [];
  const touch = [...new Set([...t38, ...rvDays])];
  if (touch.length) {
    const gp = gaps(touch), mx = gp.reduce((a, b) => b.n > a.n ? b : a);
    pen += mx.n + gp.reduce((a, b) => a + b.n * b.n, 0) * 0.25;
    const lab = touch.sort((a, b) => a - b).map(d => DN[d] + (t38.includes(d) ? '(수업)' : '(RV)')).join('·');
    notes.push([mx.n <= 2 ? 'good' : 'info', `3800 만나는 날 ${lab} — 가장 긴 공백 ${mx.n}일`]);
  }
  if (!t38.length) notes.push(['info', '3800은 RV에서만 해요']);

  // 3) 3800 날마다
  t38.forEach(d => {
    const m = mainSlot(g, d);
    otherSlots(g, d, 'rv').forEach(rv => {
      if (near(rv.t, m.e) || near(m.t, rv.e)) {
        const who = rv.school ? `${rv.school} 학생은 ` : '';
        if (opt.avoid90) pen += rv.school ? 2 : 4;
        notes.push(['warn', `${DN[d]} ${m.t} 3800 수업과 ${rv.t} RV가 이어져 ${who}3800만 90분 연속`]);
      }
    });
    const nx = otherSlots(g, d + 1, 'rv');
    if (nx.length) {
      const full = nx.some(x => !x.school);
      pen -= full ? 2 : 1;
      notes.push(['good', `${DN[d]}에 배운 3800을 다음 날 ${DN[d + 1]} RV${full ? '(전체)' : `(${nx.map(x => x.school).join('·')})`}에서 바로 연습`]);
    }
    const others = midGroups().filter(x => x !== g && patOf(x)['d' + d] === '3800');
    if (others.length) {
      if (opt.align) pen -= 1;
      notes.push(['good', `${others.join('·')}과 같은 3800 요일 — 원장님 ${DN[d]}요일은 3800 설명으로 이어서`]);
    }
    const load = midGroups().filter(x => (x === g ? pat : patOf(x))['d' + d] === '3800' && mainSlot(x, d)).length;
    if (load >= 3) { pen += 1; notes.push(['warn', `${DN[d]}요일 원장님 3800 수업 ${load}반 연속`]); }
  });
  if (t38.length >= 2) {
    const gp = gaps(t38); if (gp.some(x => x.n === 0)) { pen += 2; notes.push(['warn', '3800 수업이 이틀 연달아 있어요']); }
  }
  return { pen: Math.round(pen * 10) / 10, notes };
}
function combos(arr, k) {
  if (k === 0) return [[]];
  if (arr.length < k) return [];
  const [h, ...t] = arr;
  return [...combos(t, k - 1).map(c => [h, ...c]), ...combos(t, k)];
}
function candidates(g, opt) {
  const days = mainDays(g);
  return combos(days, Math.min(opt.n, days.length)).map(c => {
    const pat = {}; days.forEach(d => { pat['d' + d] = c.includes(d) ? '3800' : 'chun'; });
    return { pat, ...evalPattern(g, pat, opt) };
  }).sort((a, b) => a.pen - b.pen);
}
const samePat = (g, a, b) => JSON.stringify(normPat(g, a)) === JSON.stringify(normPat(g, b));

function planView() {
  const groups = midGroups();
  if (!groups.includes(planGroup)) planGroup = groups[0];
  const g = planGroup, pat = patOf(g), days = mainDays(g);
  const cur = evalPattern(g, pat, planOpt);
  const cands = candidates(g, planOpt);
  const curRank = cands.findIndex(c => samePat(g, c.pat, pat));
  const rankTxt = curRank === 0 ? ['r1', '가장 좋은 틀'] : curRank > 0 && curRank <= 2 ? ['r2', `${curRank + 1}번째로 좋은 틀`] : ['r3', '더 나은 틀이 있어요'];

  const cell = (d, row) => {
    if (row === 'main') {
      const m = mainSlot(g, d); if (!m) return '<div class="c none">—</div>';
      const t = pat['d' + d] || 'chun';
      return `<button class="c ${DAY_TYPES[t].cls}" data-tog="${d}" title="눌러서 바꾸기">${DAY_TYPES[t].label}<small>${m.t}</small></button>`;
    }
    const xs = otherSlots(g, d, row);
    return xs.length ? `<div class="c ${row}">${xs.map(x => `${x.t}${x.school ? ' ' + x.school : ' 전체'}`).join('<br>')}</div>` : '<div class="c none">—</div>';
  };
  const grid = `<div class="wk"><div></div>${[1,2,3,4,5].map(d => `<div class="h">${DN[d]}</div>`).join('')}
    <div class="rl">본수업</div>${[1,2,3,4,5].map(d => cell(d, 'main')).join('')}
    <div class="rl">RV</div>${[1,2,3,4,5].map(d => cell(d, 'rv')).join('')}
    <div class="rl">단어</div>${[1,2,3,4,5].map(d => cell(d, 'word')).join('')}</div>`;

  const noteHtml = ns => `<ul class="notes">${ns.map(([t, x]) => `<li class="n-${t}"><i>${t === 'good' ? '✓' : t === 'warn' ? '!' : '·'}</i><span>${esc(x)}</span></li>`).join('')}</ul>`;
  const strip = p => `<div class="strip">${[1,2,3,4,5].map(d => { const has = days.includes(d); const t = p['d' + d] || 'chun';
    return `<span class="${has ? DAY_TYPES[t].cls : ''}">${DN[d]}${has && t === '3800' ? ' 38' : ''}</span>`; }).join('')}</div>`;
  const candHtml = cands.slice(0, 3).map((c, i) => {
    const isCur = samePat(g, c.pat, pat);
    const top = c.notes.filter(n => n[0] !== 'info').slice(0, 3).map(n => (n[0] === 'good' ? '✓ ' : '! ') + n[1]).join(' · ');
    return `<div class="cand"><span class="no ${i === 0 ? 'best' : ''}">${i === 0 ? '추천' : (i + 1) + '번째'}</span>${strip(c.pat)}
      <span class="act">${isCur ? '<span class="cur">지금 틀</span>' : `<button class="icon-btn" data-use="${i}">이걸로</button>`}</span>
      <div class="why">${esc(top)}</div></div>`;
  }).join('');

  // 원장님 요일별 본수업
  const loadRows = [1,2,3,4,5].map(d => {
    const ms = (TT[d] || []).filter(x => x.kind === 'main').sort((a, b) => minutesOf(a.t) - minutesOf(b.t));
    const n38 = ms.filter(m => patOf(m.g)['d' + d] === '3800').length;
    return `<tr><th>${DN[d]}</th><td>${ms.map(m => { const t = patOf(m.g)['d' + d] || 'chun'; return `<span class="tag ${DAY_TYPES[t].cls}">${m.t} ${m.g} ${DAY_TYPES[t].label}</span>`; }).join('') || '—'}</td><td>${n38 ? `3800 ${n38}반` : ''}</td></tr>`;
  }).join('');

  const anyDirty = groups.filter(dirty);
  return `
  <div class="pl-head"><h2>수업 패턴 설계</h2><p>반마다 요일별로 무엇을 할지 정해요. 칸을 눌러 바꾸면 바로 평가가 나오고, 저장하면 오늘 수업 화면이 그 요일에 맞게 바뀌어요.</p></div>
  <div class="pl-groups">${groups.map(x => `<button class="${x === g ? 'on' : ''}" data-g="${esc(x)}">${esc(x)}<small>주 ${mainDays(x).length}회${dirty(x) ? ' · 수정 중' : ''}</small></button>`).join('')}</div>

  <div class="pl-card"><h3>${esc(g)} 이번 주 틀 <span class="hint">본수업 칸을 누르면 천문장 ↔ 3800</span></h3>${grid}</div>

  <div class="pl-card"><h3>이 틀 평가</h3>
    <div class="verdict"><span class="rank ${rankTxt[0]}">${rankTxt[1]}</span><span class="muted" style="font-size:12px">${days.length}일 중 3800 ${days.filter(d => pat['d' + d] === '3800').length}일 · 가능한 틀 ${cands.length}개 중 ${curRank + 1}위</span></div>
    ${noteHtml(cur.notes)}</div>

  <div class="pl-card"><h3>추천 받기</h3>
    <div class="opts">
      <label>3800 수업 <select id="po-n" class="icon-btn">${[0,1,2].map(n => `<option value="${n}" ${planOpt.n === n ? 'selected' : ''}>주 ${n}일</option>`).join('')}</select></label>
      <label><input type="checkbox" id="po-90" ${planOpt.avoid90 ? 'checked' : ''}> 3800 90분 연속 피하기</label>
      <label><input type="checkbox" id="po-al" ${planOpt.align ? 'checked' : ''}> 다른 반과 3800 요일 맞추기</label>
    </div>
    ${candHtml || '<p class="muted">본수업이 없는 반이에요.</p>'}</div>

  <div class="pl-card"><h3>원장님 요일별 본수업 <span class="hint">저장 전 수정 내용 포함</span></h3>
    <table class="load-tb"><tbody>${loadRows}</tbody></table></div>

  ${anyDirty.length ? `<div class="savebar"><span>${anyDirty.join('·')} 저장 안 됨</span><button class="rs" id="pl-reset">되돌리기</button><button class="sv" id="pl-save">저장</button></div>` : ''}`;
}
function bindPlan() {
  const v = $('view');
  v.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { planGroup = b.dataset.g; render(); });
  v.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    const g = planGroup, k = 'd' + b.dataset.tog, p = { ...patOf(g) };
    p[k] = (p[k] || 'chun') === 'chun' ? '3800' : 'chun';
    draft[g] = p; render();
  });
  v.querySelectorAll('[data-use]').forEach(b => b.onclick = () => { draft[planGroup] = { ...candidates(planGroup, planOpt)[+b.dataset.use].pat }; render(); });
  const n = $('po-n'); if (n) n.onchange = e => { planOpt.n = +e.target.value; render(); };
  const a = $('po-90'); if (a) a.onchange = e => { planOpt.avoid90 = e.target.checked; render(); };
  const l = $('po-al'); if (l) l.onchange = e => { planOpt.align = e.target.checked; render(); };
  const rs = $('pl-reset'); if (rs) rs.onclick = () => { midGroups().forEach(g => { if (dirty(g)) delete draft[g]; }); render(); };
  const sv = $('pl-save'); if (sv) sv.onclick = savePatterns;
}
async function savePatterns() {
  const gs = midGroups().filter(dirty);
  try {
    for (const g of gs) {
      const body = normPat(g, draft[g]);
      const r = await fetch(`${DB_URL}/${PAT_PATH}/${encodeURIComponent(g)}.json`, { method:'PUT', body: JSON.stringify(body) });
      if (!r.ok) throw new Error(r.status);
      PAT[g] = body; draft[g] = { ...body };
    }
    toast(`${gs.join('·')} 패턴을 저장했어요`);
  } catch (e) { toast('저장하지 못했어요 — 다시 눌러 주세요'); }
  render();
}

/* ── 설정 창 ── */
function openDlg(g) {
  if (!D) return;
  const groups = [...new Set(D.students.map(s => s.group).filter(Boolean))].sort((a, b) => {
    const am = /^중/.test(a), bm = /^중/.test(b);
    return am === bm ? a.localeCompare(b, 'ko') : am ? -1 : 1;
  });
  if (g) dlgGroup = g;
  else if (!groups.includes(dlgGroup) || isEl(dlgGroup) !== (level === 'el')) dlgGroup = groups.find(x => isEl(x) === (level === 'el')) || groups[0];
  $('dlg-group').innerHTML = groups.map(x => `<option ${x === dlgGroup ? 'selected' : ''}>${esc(x)}</option>`).join('');
  renderDlg();
  $('dlg').querySelector('h3').textContent = '차량 설정';
  $('dlg').showModal();
}
function renderDlg() {
  if (!D) return;
  const list = D.students.filter(s => s.group === dlgGroup).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  $('dlg-list').innerHTML = list.map(st => {
    const sv = VIEW[st.id] || {};
    return `<div class="set-row">
      <span class="nm2">${esc(st.name)}</span>
      ${isEl(st.group) ? '' : `<span class="chip" title="학교는 숙제관리 앱 👥 학생 관리에서 바꿔요">${st.school ? esc(st.school) : '<span style="color:#b45309">학교 미입력</span>'}</span>`}
      <button class="van-t ${sv.van ? 'on' : ''}" data-van="${st.id}">${sv.van ? '🚐 차량' : '차량 아님'}</button>
    </div>`;
  }).join('') || '<p>학생이 없어요.</p>';
  $('dlg-list').querySelectorAll('[data-van]').forEach(b => b.onclick = () => {
    const sid = b.dataset.van; saveView(sid, { van: !(VIEW[sid] || {}).van });
  });
}

/* ── 이벤트 ── */
$('d-prev').onclick = () => { curDate = addDays(curDate, -1); curSlot = null; render(); };
$('d-next').onclick = () => { curDate = addDays(curDate, 1); curSlot = null; render(); };
$('d-today').onclick = () => { curDate = todayStr(); curSlot = null; render(); };
$('btn-reload').onclick = load;
$('btn-set').onclick = () => openDlg();
$('dlg-close').onclick = () => $('dlg').close();
$('dlg-group').onchange = e => { dlgGroup = e.target.value; renderDlg(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) load(); });
setInterval(() => { if (!document.hidden) load(); }, 3 * 60 * 1000);   // 3분마다 LMS 다시 읽기

{ const h = new Date().getHours(); level = h < 17 ? 'el' : 'mid'; }   // 5시 전에는 초등, 그 뒤에는 중등부터
render();
load();
</script>
</body>
</html>
